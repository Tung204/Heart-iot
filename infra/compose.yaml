services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: annhien
      POSTGRES_USER: annhien
      POSTGRES_PASSWORD: annhien
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U annhien -d annhien"]
      interval: 5s
      timeout: 3s
      retries: 10

  mosquitto:
    image: eclipse-mosquitto:2
    ports:
      - "1883:1883"
    volumes:
      - ./mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
