# CẤU HÌNH MẪU CHO PROFILE THỬ NGHIỆM "mqtt-experimental" — KHÔNG PHẢI BROKER PRODUCTION.
#
# Broker này vẫn là profile THỬ NGHIỆM, chưa phải đường ingest production.
# Backend subscribe telemetry + events và publish ACK sự kiện; P0-2 đã có mã/test
# nhưng P0-1 (xác thực thiết bị ở tầng ứng dụng) vẫn mở. Chưa kiểm broker/ACL/TLS thật.
#
# Các bất biến của file này (kiểm bằng `node infra/check-mqtt-exposure.mjs`):
#   - allow_anonymous false — không có client ẩn danh, kể cả khi chạy local.
#   - password_file — mỗi thiết bị/backend có user riêng; file tạo cục bộ ngoài repo.
#   - acl_file — chỉ publish/subscribe topic của chính device_id (xem acl).
#   - listener chỉ bind loopback (127.0.0.1), không bind 0.0.0.0.
# Cần TLS trước khi dùng ngoài máy local; xem khối cuối file.

persistence false
log_type error
log_type warning
log_type notice

# Không cho client ẩn danh. Thiếu các dòng này broker sẽ mở cho cả LAN.
allow_anonymous false
password_file /mosquitto/config/passwd
acl_file /mosquitto/config/acl

# Chỉ nghe trên loopback của container; compose chỉ publish ra 127.0.0.1 host.
listener 1883 127.0.0.1

# TLS chưa được dựng hay kiểm trong repo này. Khi cần dùng ngoài localhost:
#   1. Đặt `per_listener_settings true` TRƯỚC mọi listener và khai báo lại
#      allow_anonymous/password_file/acl_file cho từng listener.
#   2. Thêm listener TLS và bắt buộc client certificate (mTLS) như sau, rồi bỏ
#      listener 1883:
#        listener 8883 127.0.0.1
#        allow_anonymous false
#        password_file /mosquitto/config/passwd
#        acl_file /mosquitto/config/acl
#        cafile   /mosquitto/config/certs/ca.crt
#        certfile /mosquitto/config/certs/server.crt
#        keyfile  /mosquitto/config/certs/server.key
#        require_certificate true
#        use_identity_as_username true
#   3. Không commit cert/key/passwd; mount từ secret ngoài repo.
