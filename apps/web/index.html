<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light" />
    <meta name="theme-color" content="#F4F7FB" />
    <meta
      name="description"
      content="Theo dõi sức khỏe người thân: xem dữ liệu thiết bị, xử lý cảnh báo và hỏi trợ lý AI. Dữ liệu mô phỏng · chỉ cập nhật khi ứng dụng đang mở · không tự gọi cấp cứu và không thay thế cấp cứu."
    />
    <title>Theo dõi sức khỏe</title>
    <!--
      Khung tĩnh + CSS tối thiểu: trên mạng chậm, người dùng thấy khung và trạng thái
      tải ngay khi HTML tới thay vì màn hình trắng chờ JS.
      React thay toàn bộ nội dung #root ở lần render đầu nên không cần gỡ thủ công.
      Skeleton tĩnh, không shimmer; dùng font hệ thống để không phát sinh request
      font trước khi CSS chính tải xong.
    -->
    <style>
      html {
        background-color: #f4f7fb;
      }
      body {
        margin: 0;
        color: #18263d;
        background-color: #f4f7fb;
        font-family: 'Be Vietnam Pro', 'Segoe UI', system-ui, sans-serif;
        line-height: 1.55;
      }
      .boot {
        max-width: 70rem;
        margin: 0 auto;
        padding: 2rem 1rem;
        display: flex;
        flex-direction: column;
        gap: 0.5rem;
      }
      .boot__brand {
        margin: 0;
        font-size: 1rem;
        font-weight: 700;
        color: #15253e;
      }
      .boot__title {
        margin: 0;
        font-size: 1.125rem;
        color: #526176;
      }
      .boot__skeleton {
        display: flex;
        flex-direction: column;
        gap: 0.5rem;
        margin-top: 0.5rem;
      }
      .boot__skeleton span {
        display: block;
        height: 0.875rem;
        border-radius: 6px;
        background: #dfe7f1;
      }
      .boot__skeleton span:nth-child(1) {
        width: min(100%, 18rem);
        height: 1.5rem;
      }
      .boot__skeleton span:nth-child(2) {
        width: min(100%, 28rem);
      }
      .boot__skeleton span:nth-child(3) {
        width: min(100%, 22rem);
      }
      .boot__note {
        margin: 0.75rem 0 0;
        max-width: 38rem;
        color: #526176;
        font-size: 0.875rem;
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="boot" role="status" aria-live="polite" aria-busy="true">
        <p class="boot__brand">Theo dõi sức khỏe</p>
        <p class="boot__title">Đang tải giao diện…</p>
        <div class="boot__skeleton" aria-hidden="true">
          <span></span><span></span><span></span>
        </div>
        <p class="boot__note">
          Dữ liệu mô phỏng · cảnh báo chỉ cập nhật khi ứng dụng đang mở · không thay thế cấp cứu.
        </p>
      </div>
    </div>
    <noscript>
      <p style="max-width: 70rem; margin: 0 auto; padding: 1rem; color: #18263d">
        Giao diện cần JavaScript để hiển thị. Hãy bật JavaScript rồi tải lại. Cảnh báo được xử lý ở
        máy chủ; đây không phải kênh cấp cứu — hãy gọi số cấp cứu khi cần.
      </p>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
