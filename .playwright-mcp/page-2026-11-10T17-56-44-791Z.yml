            - paragraph [ref=f4e943]:
              - text: Lỗi API dùng envelope
              - code [ref=f4e944]: "{ \"code\": \"...\", \"message\": \"...\", \"request_id\": \"...\" }"
              - text: ; không trả stack trace hoặc thông tin hồ sơ khác. Dùng
              - code [ref=f4e945]: "401"
              - text: khi không có phiên,
              - code [ref=f4e946]: "403"
              - text: khi bị cấm theo chính sách,
              - code [ref=f4e947]: "409"
              - text: khi xung đột trạng thái/version theo contract nghiệp vụ,
              - code [ref=f4e948]: "422"
              - text: khi payload không phù hợp hợp đồng,
              - code [ref=f4e949]: "429"
              - text: khi vượt giới hạn. Nếu dùng conditional update với
              - code [ref=f4e950]: If-Match
              - text: /strong ETag, precondition không thỏa thì trả
              - code [ref=f4e951]: 412 Precondition Failed
              - text: ", không thay bằng"
              - code [ref=f4e952]: "409"
              - text: . Quy ước này đối chiếu RFC 9110; endpoint phải nói rõ ETag thuộc tài nguyên nào, xem
              - link "đặc tả AI, mục 9" [ref=f4e953] [cursor=pointer]:
                - /url: "#thuc-thi-ai"
              - text: . Với tài nguyên riêng tư cần thống nhất cách dùng
              - code [ref=f4e954]: "404"
              - text: để tránh dò tồn tại.
            - heading "Retention và xóa" [level=3] [ref=f4e955]
            - paragraph [ref=f4e956]: Trước dữ liệu thật, chốt thời hạn cho raw signal, telemetry tổng hợp, audit, AI và backup. Raw IMU/PPG chỉ thu trong phiên thử có mục đích, không truyền/lưu liên tục mặc định. Một yêu cầu xóa phải xét database, file export, cache, tóm tắt AI và vòng đời backup; không ghi “đã xóa hết” khi mới ẩn trên giao diện.
            - paragraph [ref=f4e957]: Tài khoản người thân đã bị thu hồi không nhận notification còn trong hàng đợi và không đọc bản tóm tắt cache. Dữ liệu đã xuất ra ngoài cần được giải thích trong chính sách chia sẻ trước khi sử dụng thực tế.
