              - text: Thư mục giữ định nghĩa dùng chung giữa firmware, simulator, API và web.
              - strong [ref=f4e3347]: Hiện có payload JSON tổng hợp minh họa v1; chưa có JSON Schema/OpenAPI/codegen hoặc validator thực thi.
            - region "Bảng dữ liệu có thể cuộn ngang" [ref=f4e3348]:
