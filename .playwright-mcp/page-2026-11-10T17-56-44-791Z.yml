            - code [ref=f4e1145]: "[Người đang được theo dõi] [Quản lý chia sẻ] [Cảnh báo đang mở — người phụ trách / Chưa có người xác nhận] [Thiết bị: Online / Offline] [Dữ liệu cập nhật lúc ...] [Nhịp tim: ... bpm + chất lượng] [Vận động hôm nay + độ phủ] [Biểu đồ — phân biệt rõ những khoảng không có dữ liệu] [Tóm tắt ngày — dữ liệu dùng, dữ liệu thiếu, nguồn khi cần]"
            - paragraph [ref=f4e1146]: Ưu tiên sự kiện cần hành động và độ mới của dữ liệu trước biểu đồ trang trí. Số liệu tổng hợp từ simulator phải có nhãn “Dữ liệu mô phỏng”. Không dùng tên hoặc ảnh bệnh nhân thật trong demo.
            - heading "Luồng chính" [level=3] [ref=f4e1147]
            - paragraph [ref=f4e1148]:
              - strong [ref=f4e1149]: "Thiết lập:"
              - text: tạo tài khoản → xác lập hồ sơ → claim thiết bị bằng bằng chứng dùng một lần → nhận dữ liệu thử → mời người thân → người thân chấp nhận quyền. Người thân không mặc định truy cập toàn bộ dữ liệu trước ngày chia sẻ.
            - paragraph [ref=f4e1150]:
              - strong [ref=f4e1151]: "Cảnh báo:"
              - text: thiết bị báo nghi ngã và cho hủy → confirmed → dashboard người thân hiện cảnh báo → chọn “Tôi đang hỗ trợ” → liên hệ thủ công → kết thúc với lý do. Nếu một người khác đã xác nhận, UI vẫn cho người có quyền phối hợp nhưng hiển thị rõ người nhận đầu và lịch sử; API xử lý cạnh tranh trạng thái.
            - paragraph [ref=f4e1152]:
              - strong [ref=f4e1153]: "Thu hồi chia sẻ:"
              - text: chủ hồ sơ thu hồi → người thân mất quyền đọc API/AI/export và stream đang mở → thông báo chưa gửi bị hủy → giao diện người thân xóa dữ liệu nhạy cảm khỏi bộ nhớ hiển thị. Không chỉ ẩn một nút menu.
