            - heading "Khung thư mục" [level=3] [ref=f4e3215]
            - code [ref=f4e3217]: "DATN/ ├── apps/ │ ├── web/ # Web responsive cho người dùng, người thân, admin │ └── api/ # Backend nghiệp vụ, tiếp nhận dữ liệu, cảnh báo ├── firmware/ # Chương trình trên thiết bị IoT ├── hardware/ # BOM, sơ đồ mạch, kết quả khảo sát cơ khí/nguồn ├── packages/contracts/ # Hợp đồng dữ liệu và payload minh họa ├── infra/ # Cấu hình môi trường và triển khai dự kiến ├── tools/ │ ├── simulator/ # Công cụ mô phỏng thiết bị dự kiến │ └── docs/ # Công cụ sinh và kiểm bản HTML từ Markdown/JSON ├── tests/ # Quy ước và kịch bản kiểm thử liên thành phần ├── data/ # Quy ước dữ liệu mẫu/thử nghiệm ├── reports/ # Báo cáo, hình, tài liệu bảo vệ └── docs/ # Nguồn chính của thiết kế kỹ thuật └── html/index.html # Bản đọc ngoại tuyến được sinh từ nguồn"
            - paragraph [ref=f4e3218]:
              - text: Các thư mục hiện có README nêu trách nhiệm và điều kiện bắt đầu. Payload trong
              - code [ref=f4e3219]: packages/contracts/examples/
              - text: là dữ liệu tổng hợp để trao đổi thiết kế; chưa phải bộ dữ liệu đo. Chưa tạo package manifest, lockfile hay lệnh chạy giả khi framework/version chưa được chốt.
            - heading "Hướng đề xuất" [level=3] [ref=f4e3220]
            - list [ref=f4e3221]:
              - listitem [ref=f4e3222]: Prototype tại nhà dùng Wi-Fi; web responsive là giao diện đầu tiên.
              - listitem [ref=f4e3223]: Kiểm chứng vị trí đeo, IMU và tín hiệu nhịp tim trước khi chốt vỏ thiết bị.
              - listitem [ref=f4e3224]: Backend dạng modular monolith, database quan hệ, giao tiếp thiết bị có định danh và chống xử lý trùng.
              - listitem [ref=f4e3225]: Cảnh báo hoạt động độc lập với AI. Baseline có tóm tắt dữ liệu; hướng mới bổ sung AI thực thi qua Business Tools dùng chung với UI, được kiểm quyền và ghi lịch sử.
              - listitem [ref=f4e3226]: Đề xuất lõi nền tảng dùng chung, lấy sức khỏe IoT làm ứng dụng hoàn chỉnh đầu tiên; phạm vi tổng quát và mức sinh code chưa chốt.
              - listitem [ref=f4e3227]: Bản demo đầu tiên dùng dữ liệu mô phỏng, thể hiện đủ mất mạng, báo nhầm và xác nhận cảnh báo.
