          - generic [ref=f4e2227]:
            - paragraph [ref=f4e2228]:
              - text: "Ngày soạn:"
              - strong [ref=f4e2229]: 11/11/2026
              - text: . Tài liệu viết sâu từ
              - link "định hướng nền tảng" [ref=f4e2230] [cursor=pointer]:
                - /url: "#nen-tang-ai"
              - text: ", phục vụ review và chốt kỹ thuật."
              - strong [ref=f4e2231]: Mọi tên thực thể, trạng thái, tool và endpoint dưới đây là thiết kế đề xuất, chưa có implementation hoặc contract đã được duyệt.
              - text: Các ID và ví dụ đều tổng hợp. Không dùng tài liệu này để kết luận đã có AI Agent, sandbox, kiểm thử sản phẩm hoặc hệ thống tự vận hành.
            - paragraph [ref=f4e2232]:
              - text: "Yêu cầu đã xác nhận: AI làm được công việc, có tự động hóa, giao diện nghiệp vụ đầy đủ, Dynamic / Configurable, luôn có docs và frontend được preview/chấp nhận. Cách thực hiện các yêu cầu đó được trình bày bên dưới để có thể đánh giá trước khi chọn stack. Không thay thế đặc tả thiết bị trong"
              - link "chương 04" [ref=f4e2233] [cursor=pointer]:
                - /url: "#du-lieu"
              - text: ; bốn phát hiện
              - link "review v0.1" [ref=f4e2234] [cursor=pointer]:
                - /url: "#review"
              - text: vẫn mở.
            - heading "1. Phân chia trách nhiệm để triển khai và chứng minh" [level=3] [ref=f4e2235]
            - region "Bảng dữ liệu có thể cuộn ngang" [ref=f4e2236]:
              - table [ref=f4e2237]:
                - rowgroup [ref=f4e2238]:
                  - row [ref=f4e2239]:
                    - columnheader "Phần" [ref=f4e2240]
                    - columnheader "Sở hữu hành vi" [ref=f4e2241]
                    - columnheader "Không suy ra từ việc phần này tồn tại" [ref=f4e2242]
                - rowgroup [ref=f4e2243]:
                  - row [ref=f4e2244]:
                    - cell "Nền tảng dùng chung" [ref=f4e2245]
                    - cell "Xác thực, phạm vi truy cập, capability registry, run/step, cấu hình có version, audit, artifact" [ref=f4e2246]
                    - cell "Chưa đồng nghĩa có SaaS đa ngành hoặc thu phí thuê bao" [ref=f4e2247]
                  - row [ref=f4e2248]:
                    - cell "Module sức khỏe IoT" [ref=f4e2249]
                    - cell "Hồ sơ theo dõi, chia sẻ, thiết bị, telemetry, incident, thống kê đã định nghĩa" [ref=f4e2250]
                    - cell "AI không tự chọn ngưỡng y khoa hoặc định nghĩa lại số đo" [ref=f4e2251]
                  - row [ref=f4e2252]:
                    - cell "Module công việc/bảo trì, nếu được chọn" [ref=f4e2253]
                    - cell "Công việc, người phụ trách, hạn xử lý, liên kết thiết bị" [ref=f4e2254]
                    - cell "Không được cấp quyền xem sức khỏe chỉ vì có quyền bảo trì thiết bị" [ref=f4e2255]
                  - row [ref=f4e2256]:
                    - cell "AI planner" [ref=f4e2257]
                    - cell "Chuyển mục tiêu thành kế hoạch bằng các capability hiện có; giải thích kết quả" [ref=f4e2258]
                    - cell "Kế hoạch do model sinh chưa phải hành động đã được cấp phép" [ref=f4e2259]
                  - row [ref=f4e2260]:
                    - cell "Execution engine" [ref=f4e2261]
                    - cell "Kiểm điều kiện, chạy bước, lưu kết quả, retry/đối soát, dừng, phát sự kiện" [ref=f4e2262]
                    - cell "Không cần model cho mọi transition hoặc mỗi mẫu cảm biến" [ref=f4e2263]
                  - row [ref=f4e2264]:
                    - cell "Renderer" [ref=f4e2265]
                    - cell "Hiển thị form/bảng/chart từ component và data source đã đăng ký" [ref=f4e2266]
                    - cell "Một cấu hình mới không tạo component hoặc integration chưa được lập trình" [ref=f4e2267]
            - paragraph [ref=f4e2268]: Đề xuất bắt đầu bằng một orchestrator và các nhóm capability theo nghiệp vụ. Chỉ tách specialist agent khi có nhiệm vụ, quyền, context hoặc bộ đánh giá khác biệt chứng minh được lợi ích. Không dùng số lượng agent làm thước đo độ khó.
            - paragraph [ref=f4e2269]: "Chứng minh tính tổng quát bằng một phép mở rộng: thêm module nhỏ, đăng ký contract/quyền/tool/view; dùng lại cơ chế đăng nhập, thực thi, audit và preview. Ghi phần code phải bổ sung và phần dùng lại thực tế. Thay tên hồ sơ, số bản ghi hoặc thứ tự câu lệnh không được làm mất khả năng chạy. Phạm vi module thứ hai vẫn cần chốt."
            - heading "2. Ủy quyền và nhận dạng người thực thi" [level=3] [ref=f4e2270]
            - paragraph [ref=f4e2271]:
              - text: Đề xuất phân biệt
              - code [ref=f4e2272]: requested_by
              - text: (người yêu cầu),
              - code [ref=f4e2273]: execution_principal
              - text: (định danh chạy tác vụ),
              - code [ref=f4e2274]: delegation_id
              - text: (phạm vi đã giao) và
              - code [ref=f4e2275]: approved_by
              - text: (người duyệt một hành động cụ thể). Tác vụ nền có định danh riêng nhưng không kế thừa toàn quyền tài khoản quản trị hoặc tài khoản database của worker.
            - paragraph [ref=f4e2276]: Quyền hiệu lực là phần giao giữa quyền hiện tại của người giao việc, giới hạn delegation, quyền đối tượng/thuộc tính và policy của capability. Chỉ quyền đọc không cho phép xuất, gửi ra ngoài hoặc sửa dữ liệu. Người duyệt không tự trở thành nguồn cấp thêm mọi quyền cho run.
            - region "Bảng dữ liệu có thể cuộn ngang" [ref=f4e2277]:
              - table [ref=f4e2278]:
                - rowgroup [ref=f4e2279]:
                  - row [ref=f4e2280]:
                    - columnheader "Thành phần delegation đề xuất" [ref=f4e2281]
                    - columnheader "Ý nghĩa cần chốt/kiểm" [ref=f4e2282]
                - rowgroup [ref=f4e2283]:
                  - row [ref=f4e2284]:
                    - cell "Đối tượng và phạm vi" [ref=f4e2285]
                    - cell "Workspace, tập hồ sơ/thiết bị, quan hệ chia sẻ, trường dữ liệu; server xác định từ phiên và nguồn tin cậy" [ref=f4e2286]
                  - row [ref=f4e2287]:
                    - cell "Capability được dùng" [ref=f4e2288]
                    - cell "Danh sách thao tác và version tương thích; không nhận tên tool bất kỳ từ prompt" [ref=f4e2289]
                  - row [ref=f4e2290]:
                    - cell "Điều kiện chạy" [ref=f4e2291]
                    - cell "Trigger, lịch/timezone nếu có, thời hạn hiệu lực; không tự đặt lịch khi người dùng chưa giao" [ref=f4e2292]
                  - row [ref=f4e2293]:
                    - cell "Hạn mức" [ref=f4e2294]
                    - cell "Số đối tượng được tác động, số bước, thời gian, số lần thử, ngân sách model/provider; giá trị còn cần chốt" [ref=f4e2295]
                  - row [ref=f4e2296]:
                    - cell "Điều kiện dừng" [ref=f4e2297]
                    - cell "Hết hạn, bị thu hồi, mất quyền, thiếu nguồn bắt buộc, xung đột dữ liệu, hết hạn mức" [ref=f4e2298]
                  - row [ref=f4e2299]:
                    - cell "Quy tắc duyệt" [ref=f4e2300]
                    - cell "Loại tác động tự làm được; hành động nào cần duyệt đúng đối tượng/nội dung/phạm vi" [ref=f4e2301]
            - paragraph [ref=f4e2302]:
              - text: UI, AI, scheduler, export và callback từ job đều đi qua cùng lớp kiểm quyền. Tên hoặc ID do model trả chỉ là yêu cầu tra cứu, không phải bằng chứng sở hữu. Quyền được kiểm trước đọc dữ liệu, trước gửi dữ liệu tới model, trước tác động và trước giao artifact/kết quả. Đề xuất các điểm kiểm này nhằm cụ thể hóa yêu cầu kiểm quyền ở backend; cơ sở chung xem nguồn OWASP trong
              - link "chương 10" [ref=f4e2303] [cursor=pointer]:
                - /url: "#nguon"
              - text: .
            - paragraph [ref=f4e2304]: Thu hồi quyền có mốc hiệu lực được lưu phía server. Với ghi nội bộ, phép kiểm quyền và commit phải được phối hợp để không có khoảng hở “kiểm xong rồi quyền bị thu hồi nhưng vẫn ghi”; cơ chế transaction/lock/version sẽ chọn cùng database. Với dịch vụ ngoài, kiểm lại trước dispatch nhưng không hứa thu hồi được yêu cầu đã được nhà cung cấp nhận. Nếu quyền mất sau khi gửi dữ liệu tới model thì dữ liệu đó đã được tiết lộ cho provider; việc chặn câu trả lời sau đó không đảo ngược tiết lộ.
            - paragraph [ref=f4e2305]: Người dùng xem tiến độ và yêu cầu dừng trong phạm vi được giao. Admin kỹ thuật có thể thấy trạng thái vận hành và mã lỗi đã lọc; quyền đó không tự mở nội dung sức khỏe, hội thoại hoặc file export của người khác.
            - heading "3. Hợp đồng capability và kế hoạch hành động" [level=3] [ref=f4e2306]
            - paragraph [ref=f4e2307]: Một capability có một service nghiệp vụ sở hữu. Frontend thông thường và tool adapter chuyển yêu cầu về service đó; không nhân đôi luật validation/quyền ở một nhánh dành riêng cho AI.
            - region "Bảng dữ liệu có thể cuộn ngang" [ref=f4e2308]:
              - table [ref=f4e2309]:
                - rowgroup [ref=f4e2310]:
                  - row [ref=f4e2311]:
                    - columnheader "Nhóm thông tin" [ref=f4e2312]
                    - columnheader "Trường/hành vi đề xuất" [ref=f4e2313]
                - rowgroup [ref=f4e2314]:
                  - row [ref=f4e2315]:
                    - cell "Nhận dạng" [ref=f4e2316]
                    - cell [ref=f4e2317]:
                      - code [ref=f4e2318]: capability_id
                      - text: ","
                      - code [ref=f4e2319]: contract_version
                      - text: ", module/service sở hữu, trạng thái"
                      - code [ref=f4e2320]: planned
                      - text: ","
                      - code [ref=f4e2321]: active
                      - text: ","
                      - code [ref=f4e2322]: deprecated
                      - text: ","
                      - code [ref=f4e2323]: disabled
                  - row [ref=f4e2324]:
                    - cell "Input/output" [ref=f4e2325]
                    - cell "Schema có version; trường được phép sửa; giới hạn độ dài, kích thước tập kết quả và phân trang; kết quả và mã lỗi có cấu trúc" [ref=f4e2326]
                  - row [ref=f4e2327]:
                    - cell "Quyền" [ref=f4e2328]
                    - cell [ref=f4e2329]:
                      - text: Permission, điều kiện đối tượng/thuộc tính, scope do server cấp; không cho input ghi đè
                      - code [ref=f4e2330]: actor_id
                      - text: ", tenant hoặc policy"
                  - row [ref=f4e2331]:
                    - cell "Tác động" [ref=f4e2332]
                    - cell "Đọc, ghi nội bộ, export, gửi bên ngoài, thay cấu hình; mức rủi ro và khả năng preview" [ref=f4e2333]
                  - row [ref=f4e2334]:
                    - cell "Thực thi" [ref=f4e2335]
                    - cell "Điều kiện trước ghi, version tài nguyên, idempotency, timeout, quy tắc retry/đối soát" [ref=f4e2336]
                  - row [ref=f4e2337]:
                    - cell "Duyệt và phục hồi" [ref=f4e2338]
                    - cell "Khi nào cần approval; nội dung approval ràng buộc; có compensation hay không; điều kiện thực hiện" [ref=f4e2339]
                  - row [ref=f4e2340]:
                    - cell "Theo dõi" [ref=f4e2341]
                    - cell [ref=f4e2342]:
                      - code [ref=f4e2343]: request_id
                      - text: ","
                      - code [ref=f4e2344]: run_id
                      - text: ","
                      - code [ref=f4e2345]: step_id
                      - text: ", tham chiếu kết quả đã lọc, sự kiện nghiệp vụ và audit"
            - paragraph [ref=f4e2346]: JSON Schema chỉ kiểm cấu trúc theo khả năng validator được chọn. Service vẫn kiểm quan hệ, trường bất biến, scope, giá trị tham chiếu và luật nghiệp vụ. Input hợp schema không có nghĩa người gọi có quyền làm việc đó.
