                        - /url: "#payload-telemetry"
                    - cell "Một mẫu BPM và tổng bước trong boot, kèm chất lượng/đồng hồ" [ref=f4e3358]
                  - row [ref=f4e3359]:
                    - cell [ref=f4e3360]:
                      - link "fall-confirmed.v1.json" [ref=f4e3361] [cursor=pointer]:
                        - /url: "#payload-confirmed"
                    - cell "Thiết bị xác nhận sau cửa sổ hủy; đủ thông tin để xử lý nếu candidate đến sau" [ref=f4e3362]
                  - row [ref=f4e3363]:
                    - cell [ref=f4e3364]:
                      - link "event-ack.v1.json" [ref=f4e3365] [cursor=pointer]:
                        - /url: "#payload-ack"
                    - cell "Backend xác nhận đã lưu bản tin incident" [ref=f4e3366]
            - paragraph [ref=f4e3367]:
              - text: Quy tắc trường, idempotency, MQTT và API nằm ở
              - link "đặc tả dữ liệu" [ref=f4e3368] [cursor=pointer]:
                - /url: "#du-lieu"
              - text: . Giá trị
              - code [ref=f4e3369]: demo-*
              - text: ", timestamp và chỉ số đều là minh họa, không phải dữ liệu người thật hoặc kết quả thử."
            - paragraph [ref=f4e3370]: Khi triển khai, viết JSON Schema cho envelope/payload và OpenAPI cho HTTP, chọn một nguồn sinh kiểu dữ liệu thay vì giữ nhiều bản độc lập. Thay đổi phá tương thích phải có version mới và thử firmware cũ trong phạm vi hỗ trợ. Cần chốt giới hạn kích thước, độ dài ID, kiểu số và các enum trước khi dùng validator trong ingest.
            - heading "Telemetry — nhịp tim và bước chân" [level=3] [ref=f4e3371]
            - paragraph [ref=f4e3372]:
              - link "Mở telemetry.v1.json" [ref=f4e3373] [cursor=pointer]:
                - /url: ../../packages/contracts/examples/telemetry.v1.json
            - code [ref=f4e3375]: "{ \"schema_version\": \"1.0\", \"message_id\": \"demo-telemetry-001\", \"device_id\": \"demo-device-001\", \"boot_id\": \"demo-boot-001\", \"sequence\": 100, \"measured_at\": \"2026-11-10T09:20:00Z\", \"clock_status\": \"synced\", \"uptime_ms\": 120000, \"metrics\": { \"heart_rate_bpm\": 72, \"steps_since_boot\": 125 }, \"quality\": { \"heart_rate\": \"valid\", \"motion\": \"valid\" }, \"battery_percent\": null, \"firmware_version\": \"0.0.0-design\" }"
