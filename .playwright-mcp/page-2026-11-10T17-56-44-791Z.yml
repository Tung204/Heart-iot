                    - cell "Bản preview, version và phạm vi nếu đổi frontend; ai chấp nhận và bằng chứng thực tế; chưa duyệt thì ghi chưa duyệt" [ref=f4e2184]
                  - row [ref=f4e2185]:
                    - cell "Kiểm chứng" [ref=f4e2186]
                    - cell "Lệnh, môi trường/version, dữ liệu, expected/actual, số tác động, artifact đã lọc; phân biệt test đề xuất với test đã chạy" [ref=f4e2187]
                  - row [ref=f4e2188]:
                    - cell "Giới hạn và phục hồi" [ref=f4e2189]
                    - cell "Phần chưa kiểm, migration/compatibility, cách rollout hoặc compensation có điều kiện; không hứa undo mọi tác động" [ref=f4e2190]
            - paragraph [ref=f4e2191]:
              - text: Truy vết theo chuỗi
              - strong [ref=f4e2192]: yêu cầu → contract/quyết định → hành vi → phép kiểm → bằng chứng thực tế
              - text: ". Ví dụ cho một yêu cầu đã có: “AI tự làm trong quyền được giao” → proposal delegation ở chương 13 → kiểm tại ranh giới đọc/gửi model/ghi/giao file → AI-02/AI-08/AI-14 → kết quả còn"
              - strong [ref=f4e2193]: chưa chạy
              - text: . Cùng mã phép kiểm không được dùng để ngụ ý đã có file test.
            - paragraph [ref=f4e2194]: Đối với AI, lưu model/prompt/tool/config version thực dùng, tập nhiệm vụ và số lần thử; lưu plan công khai/tool result đã lọc để giải thích tác động. Không lưu suy luận nội bộ của model làm bằng chứng, không đưa secrets hoặc raw dữ liệu sức khỏe vào log chung. Phiên bản có nguồn chưa khóa chỉ ghi là phiên bản khảo sát.
            - heading "Đối chiếu review và quyết định" [level=4] [ref=f4e2195]
            - paragraph [ref=f4e2196]:
              - text: "Mỗi finding ghi tình huống, hệ quả, vị trí nguồn, thay đổi đáp ứng và cách kiểm. Tách ba trạng thái:"
              - strong [ref=f4e2197]: đã bổ sung đặc tả
              - text: ","
              - strong [ref=f4e2198]: đã triển khai
              - text: ","
              - strong [ref=f4e2199]: đã kiểm với bằng chứng
              - text: . Review tài liệu không tự chuyển hai trạng thái sau; fix đã có test cục bộ cũng chưa đồng nghĩa deploy/nghiệm thu.
              - link "Review nền tảng AI" [ref=f4e2200] [cursor=pointer]:
                - /url: "#review-ai"
              - text: áp dụng cách ghi này.
            - paragraph [ref=f4e2201]:
              - text: "Quyết định kỹ thuật chỉ chuyển sang accepted khi có căn cứ và chấp thuận trong phạm vi cần chốt; giữ nguyên các phương án còn mở. Với thay đổi quy tắc dùng chung, rà cả các ví dụ/baseline để tránh mâu thuẫn: chẳng hạn version conflict theo body và thất bại"
              - code [ref=f4e2202]: If-Match
              - text: cần phân biệt trong mọi tài liệu HTTP liên quan.
            - heading "Báo cáo kết quả" [level=4] [ref=f4e2203]
            - paragraph [ref=f4e2204]: "Kết quả phải ghi đúng: đã thay gì, vì sao, phạm vi/API/data bị ảnh hưởng, kiểm nào đã chạy với kết quả thật, phần chưa kiểm và giới hạn. Tài liệu liên quan phải cập nhật, HTML phải khớp nguồn, phần cần preview phải có bản review được. Chỉ nói một module/khả năng hoạt động khi có bằng chứng thực thi, không dựa vào việc đã viết thiết kế."
            - paragraph [ref=f4e2205]: Hướng dẫn bằng văn bản giúp các agent làm nhất quán; nó không bảo đảm AI không bao giờ sai. Cần kiểm chứng thực tế và cơ chế backend/CI ở những ranh giới đã xác định.
