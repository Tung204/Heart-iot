                    - cell "Dải đo, tần số lấy mẫu, tuổi đời/nguồn hàng, driver, nhiễu và vị trí gắn" [ref=f4e997]
                  - row [ref=f4e998]:
                    - cell "Tương tác" [ref=f4e999]
                    - cell "Nút SOS/hủy, LED, buzzer hoặc rung" [ref=f4e1000]
                    - cell "Bấm nhầm, lực bấm, phân biệt trạng thái, giới hạn dòng driver" [ref=f4e1001]
                  - row [ref=f4e1002]:
                    - cell "Nguồn" [ref=f4e1003]
                    - cell "Nguồn bàn/USB trước; pin sau" [ref=f4e1004]
                    - cell "Mạch sạc/bảo vệ đúng loại pin, đường cấp nguồn, nhiệt độ, tiêu thụ đỉnh" [ref=f4e1005]
                  - row [ref=f4e1006]:
                    - cell "Cơ khí" [ref=f4e1007]
                    - cell "Vỏ thử và dây đeo" [ref=f4e1008]
                    - cell "Tiếp xúc da, khối lượng, độ chắc, dễ tháo, không lộ dây/mạch khi đeo" [ref=f4e1009]
            - paragraph [ref=f4e1010]: Tên linh kiện chỉ là ứng viên. Không suy ra module bất kỳ tương thích 3,3 V/5 V từ tên chip; phải đọc datasheet và sơ đồ module được mua. Chưa đưa pin/charger vào thiết kế chi tiết trước khi xác định yêu cầu nguồn.
            - heading "Trình tự khảo sát vị trí đeo" [level=3] [ref=f4e1011]
            - list [ref=f4e1012]:
              - listitem [ref=f4e1013]: "Trên bàn: đọc định danh cảm biến, kiểm nguồn và dữ liệu thô ổn định; ghi cấu hình và phiên bản driver."
              - listitem [ref=f4e1014]: "PPG: thu phiên ngồi yên, so với thiết bị tham chiếu đã biết giới hạn; ghi tỷ lệ mất tín hiệu và ảnh hưởng tiếp xúc."
              - listitem [ref=f4e1015]: "IMU: ghi hoạt động thường ngày có nhãn ở vị trí đề xuất như cổ tay/thắt lưng; không trộn vị trí mà không lưu metadata."
              - listitem [ref=f4e1016]: So sánh tỷ lệ báo nhầm, khả năng đeo và chất lượng nhịp tim để chọn một thiết bị hay tách phép đo theo phiên.
            - paragraph [ref=f4e1017]: Không yêu cầu người cao tuổi cố tình té ngã. Thử va chạm trước bằng mô hình/vật thay thế; dữ liệu đó chỉ chứng minh phản ứng với kịch bản cơ học, không đại diện độ nhạy trên người. Thử có người cần phương án phù hợp, đồng ý và điều kiện an toàn riêng.
            - heading "Thuật toán ban đầu có thể giải thích" [level=3] [ref=f4e1018]
            - paragraph [ref=f4e1019]:
              - text: "Luồng dự kiến: kiểm chất lượng → lọc nhiễu IMU → trích độ lớn gia tốc/thay đổi tư thế → nhận diện chuỗi đặc trưng →"
              - code [ref=f4e1020]: fall.candidate
              - text: → cửa sổ hủy →
              - code [ref=f4e1021]: fall.confirmed
              - text: hoặc
              - code [ref=f4e1022]: fall.cancelled
              - text: .
            - paragraph [ref=f4e1023]: Free-fall, impact và bất động có thể là đặc trưng nghiên cứu; không bắt buộc mọi cú ngã đều có đủ ba dấu hiệu. Ngồi mạnh, vỗ tay, tháo/rơi thiết bị cũng phải có trong tập hoạt động âm tính. Ngưỡng lấy từ calibration, không đặt một giá trị g rồi gọi là đã phát hiện ngã chính xác.
            - paragraph [ref=f4e1024]: Bắt đầu bằng rule-based baseline và ghi version/tham số. Chỉ cân nhắc mô hình học máy sau khi có dữ liệu đủ nguồn, chia tập đúng và chứng minh cải thiện trên cùng phép đo. Không dùng AI ngôn ngữ để phân loại từng mẫu cảm biến trong đường cảnh báo.
            - heading "Ranh giới module firmware dự kiến" [level=3] [ref=f4e1025]
            - region "Bảng dữ liệu có thể cuộn ngang" [ref=f4e1026]:
              - table [ref=f4e1027]:
                - rowgroup [ref=f4e1028]:
                  - row [ref=f4e1029]:
                    - columnheader "Module" [ref=f4e1030]
                    - columnheader "Trách nhiệm" [ref=f4e1031]
                - rowgroup [ref=f4e1032]:
                  - row [ref=f4e1033]:
                    - cell [ref=f4e1034]:
                      - code [ref=f4e1035]: sensors
                    - cell "Driver, timestamp, chất lượng, lỗi bus" [ref=f4e1036]
                  - row [ref=f4e1037]:
                    - cell [ref=f4e1038]:
                      - code [ref=f4e1039]: signal_processing
                    - cell "Lọc, suy BPM, bước chân, đặc trưng IMU" [ref=f4e1040]
                  - row [ref=f4e1041]:
                    - cell [ref=f4e1042]:
                      - code [ref=f4e1043]: fall_detection
                    - cell "State machine nghi ngã, tham số, version thuật toán" [ref=f4e1044]
