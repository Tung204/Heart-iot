                    - cell "Quyền chặn đúng; xóa có phạm vi và trạng thái, không chỉ ẩn UI" [ref=f4e1371]
                  - row [ref=f4e1372]:
                    - cell "T-13" [ref=f4e1373]
                    - cell "FR-12" [ref=f4e1374]
                    - cell "Trình duyệt đóng/tắt quyền push/kênh lỗi" [ref=f4e1375]
                    - cell "Chỉ công bố hỗ trợ ở nền tảng đã kiểm; trạng thái thất bại không bị coi đã nhận" [ref=f4e1376]
                  - row [ref=f4e1377]:
                    - cell "T-14" [ref=f4e1378]
                    - cell "NFR-07" [ref=f4e1379]
                    - cell "Đo chuỗi timestamp khi dashboard online" [ref=f4e1380]
                    - cell "Báo p50/p95 và số mẫu; tách cửa sổ hủy, truyền mạng, xử lý, hiển thị" [ref=f4e1381]
            - paragraph [ref=f4e1382]: T-13 chỉ chạy khi triển khai Web Push/P1. Các phép kiểm ở bảng là mục tiêu dự kiến; chưa có test executable hoặc kết quả đạt.
            - heading "Bổ sung cho AI thực thi và cấu hình động" [level=3] [ref=f4e1383]
            - paragraph [ref=f4e1384]:
              - link "Chương 13, mục 12" [ref=f4e1385] [cursor=pointer]:
                - /url: "#thuc-thi-ai"
              - text: là nguồn của
              - strong [ref=f4e1386]: AI-01…AI-17
              - text: ": dùng chung service UI/AI, kiểm quyền xuyên các đường dữ liệu, approval, dedup từ request tạo run đến từng tác động, restart/cancel, preview/publication, cutover lịch, vòng phản hồi trigger, prompt injection và khả năng mở rộng module. AI-17 chỉ áp dụng nếu chọn Coding Agent trong sản phẩm. Không sao chép bảng sang đây để tránh hai nguồn khác nhau."
            - paragraph [ref=f4e1387]:
              - text: Bộ này là thiết kế phép kiểm, chưa chạy.
              - link "Review nền tảng AI" [ref=f4e1388] [cursor=pointer]:
                - /url: "#review-ai"
              - text: liên kết finding với phép kiểm cần thực hiện. Khi có implementation, bắt đầu ở lớp sở hữu invariant; chỉ dùng integration/race/E2E cho ranh giới thực sự liên quan.
            - paragraph [ref=f4e1389]: Đánh giá chất lượng tác vụ theo kết quả nghiệp vụ, thời gian/thao tác, can thiệp, chi phí và lỗi quyền/tác động trùng theo định nghĩa trong chương 13. Bộ nhiệm vụ giữ lại để đánh giá tách khỏi bộ dùng chỉnh prompt; báo điều kiện, version, mẫu số và dữ liệu thiếu. Kịch bản bảo vệ trong chương 13 nối thiết bị → tự động hóa → cấu hình → gây lỗi; không thay phép đo phần cứng bên dưới.
            - heading "Đánh giá phát hiện té ngã" [level=3] [ref=f4e1390]
            - paragraph [ref=f4e1391]:
              - text: Xác định đơn vị đánh giá là
              - strong [ref=f4e1392]: sự kiện
              - text: ", không đếm mỗi cửa sổ IMU như một người ngã độc lập. Lưu nhãn và ranh giới thời gian, vị trí đeo, người/phiên thử, cấu hình cảm biến và version thuật toán."
            - region "Bảng dữ liệu có thể cuộn ngang" [ref=f4e1393]:
              - table [ref=f4e1394]:
                - rowgroup [ref=f4e1395]:
                  - row [ref=f4e1396]:
                    - columnheader "Chỉ số" [ref=f4e1397]
                    - columnheader "Cách tính/ghi nhận" [ref=f4e1398]
                - rowgroup [ref=f4e1399]:
                  - row [ref=f4e1400]:
                    - cell "Precision" [ref=f4e1401]
                    - cell [ref=f4e1402]:
                      - code [ref=f4e1403]: TP / (TP + FP)
                      - text: ; không xác định khi mẫu số bằng 0
                  - row [ref=f4e1404]:
                    - cell "Recall" [ref=f4e1405]
                    - cell [ref=f4e1406]:
                      - code [ref=f4e1407]: TP / (TP + FN)
                      - text: ; không xác định khi mẫu số bằng 0
                  - row [ref=f4e1408]:
                    - cell "F1" [ref=f4e1409]
                    - cell [ref=f4e1410]:
                      - code [ref=f4e1411]: 2 * precision * recall / (precision + recall)
                      - text: khi xác định
                  - row [ref=f4e1412]:
                    - cell "Báo nhầm theo thời gian" [ref=f4e1413]
                    - cell "Số cảnh báo giả / giờ theo dõi hợp lệ trong các hoạt động thường ngày" [ref=f4e1414]
                  - row [ref=f4e1415]:
                    - cell "Độ trễ" [ref=f4e1416]
                    - cell "Từ mốc sự kiện đã gán nhãn đến candidate và confirmed; báo riêng cửa sổ hủy" [ref=f4e1417]
                  - row [ref=f4e1418]:
                    - cell "Mất dữ liệu" [ref=f4e1419]
                    - cell "Thời gian hoặc mẫu thiếu / lượng kỳ vọng theo cấu hình" [ref=f4e1420]
            - paragraph [ref=f4e1421]: Không chỉ dùng accuracy khi dữ liệu không ngã chiếm phần lớn. Nếu dùng dataset công khai, ghi giấy phép, thiết bị/vị trí thu và khác biệt với prototype. Chia train/tune/test theo người hoặc phiên, không để các cửa sổ gần nhau rơi vào cả train và test. Giữ tập test không dùng để chọn ngưỡng.
            - paragraph [ref=f4e1422]: Tập hoạt động âm tính nên có ngồi xuống nhanh, nằm xuống, đi bộ, vung tay, tháo thiết bị và thiết bị rơi khỏi bàn. Mô phỏng bằng vật thay thế cần báo riêng; không gộp với thử trên người để tăng số liệu. Chưa có quy mô mẫu/đích accuracy được chốt.
            - heading "Đánh giá nhịp tim và bước chân" [level=3] [ref=f4e1423]
            - paragraph [ref=f4e1424]: "Nhịp tim: căn chỉnh thời gian với thiết bị tham chiếu, ghi nguồn/giới hạn tham chiếu, MAE trên cặp mẫu hợp lệ, phân bố sai số và tỷ lệ không có phép đo. Không loại im lặng các đoạn nhiễu để tạo kết quả đẹp; báo riêng nghỉ/vận động và điều kiện tiếp xúc."
            - paragraph [ref=f4e1425]: "Bước chân: dùng số bước đếm thủ công/nguồn tham chiếu của từng phiên, so chênh lệch tuyệt đối/tương đối theo hoạt động và vị trí đeo. Phiên có bước tham chiếu bằng 0 không dùng phần trăm chia cho 0; báo số đếm nhầm."
            - paragraph [ref=f4e1426]: "Pin: ghi cấu hình đo, chu kỳ gửi, RSSI/điều kiện mạng, dung lượng sử dụng và hoạt động cảnh báo. Thời lượng ước tính không thay phép đo chạy thực tế."
            - heading "Biểu mẫu bằng chứng tối thiểu" [level=3] [ref=f4e1427]
            - paragraph [ref=f4e1428]: "Mỗi lần thử ghi: mã lần thử, mục đích, phiên bản code/config, phần cứng/vị trí đeo, dữ liệu đầu vào và quyền dùng, bước thực hiện, kết quả kỳ vọng/thực tế, số mẫu/thời lượng, lỗi/giới hạn và đường dẫn artifact. Dùng ID ẩn danh; raw data ở vùng local đã loại khỏi Git."
            - paragraph [ref=f4e1429]: Kết luận báo cáo phải kèm điều kiện thử. Không suy rộng từ một demo vài phút sang độ tin cậy trong gia đình hoặc khả năng chẩn đoán.
