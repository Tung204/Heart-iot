                    - cell "Không nhận HTML/JavaScript tùy ý từ model để chạy với quyền ứng dụng" [ref=f4e1890]
                  - row [ref=f4e1891]:
                    - cell "Workflow, lịch chạy, điều kiện và hành động" [ref=f4e1892]
                    - cell "Đồ thị hữu hạn với trigger và tool đã đăng ký" [ref=f4e1893]
                    - cell "Giới hạn vòng lặp, thời gian, chi phí, retry; không thực thi chuỗi lệnh tùy ý" [ref=f4e1894]
                  - row [ref=f4e1895]:
                    - cell "Trường mở rộng của module" [ref=f4e1896]
                    - cell "Schema có kiểu dữ liệu, validation và version" [ref=f4e1897]
                    - cell "Thay đổi kiểu/xóa trường có tác động dữ liệu; không coi mọi thay đổi schema đều an toàn" [ref=f4e1898]
                  - row [ref=f4e1899]:
                    - cell "Vai trò và quyền được gán" [ref=f4e1900]
                    - cell "Cấu hình assignment/grant theo capability" [ref=f4e1901]
                    - cell "Chỉ người có quyền quản trị tương ứng được cấp/thu hồi; AI không đổi chính cơ chế enforcement" [ref=f4e1902]
                  - row [ref=f4e1903]:
                    - cell "Chọn model/provider và giới hạn tác vụ" [ref=f4e1904]
                    - cell "Adapter có hợp đồng và cấu hình phía server" [ref=f4e1905]
                    - cell "Chọn trong tập đã kiểm tương thích; secrets không nằm trong prompt hoặc cấu hình UI" [ref=f4e1906]
