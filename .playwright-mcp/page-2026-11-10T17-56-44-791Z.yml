            - heading "Chốt đối tượng trước khi ghi" [level=4] [ref=f4e2356]
            - paragraph [ref=f4e2357]: Với lệnh “đổi tên A thành B”, AI tìm trong phạm vi được phép và trả ID cùng thông tin phân biệt tối thiểu. Nhiều đối tượng cùng tên thì cần làm rõ, không chọn bản đầu tiên. Hành động ghi dùng ID đã xác định và version dữ liệu đọc được, không chỉ dùng chuỗi tên.
            - paragraph [ref=f4e2358]:
              - text: Với batch cần duyệt, đề xuất đóng băng danh sách ID/version và diff sẽ áp dụng, kèm tổng số tác động. Approval gắn
              - code [ref=f4e2359]: plan_version
              - text: ", digest nội dung, target set, người có quyền duyệt, thời hạn và giới hạn sử dụng. Nếu chỉ hiển thị một trang mẫu, phải cho xem đủ tập được duyệt hoặc ghi rõ cách truy cập toàn bộ diff. Không được duyệt 10 bản ghi rồi chạy lại bộ lọc để tác động 100 bản ghi mới xuất hiện."
            - paragraph [ref=f4e2360]: Một ủy quyền dài hạn có thể cho phép tập đối tượng thay đổi theo bộ lọc, nhưng phải định nghĩa bộ lọc, giới hạn mỗi lần chạy và thời điểm đánh giá. Mỗi lần chạy ghi snapshot tập thực tế; đối tượng mới không tự được hưởng approval của batch cũ.
            - paragraph [ref=f4e2361]: Phê duyệt chỉ xác nhận ý định trong phạm vi cụ thể. Trước commit vẫn kiểm lại quyền, version và điều kiện nghiệp vụ. Approval hết hạn, bị thu hồi, nội dung thay đổi hoặc target bị thay thế thì không thực thi bằng approval cũ. Tính dùng một lần gắn với một logical action; retry của chính action đó dùng cùng khóa chống trùng, không tiêu thụ thành một hành động mới.
            - heading "4. Lưu vòng đời tác vụ và kết quả từng bước" [level=3] [ref=f4e2362]
