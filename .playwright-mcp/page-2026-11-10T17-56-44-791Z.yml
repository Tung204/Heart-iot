              - text: ". Phạm vi: chương 11/12, chương 13 được bổ sung trong lượt làm việc và các tài liệu liên quan. Reviewer độc lập:"
              - strong [ref=f4e3025]: Codex qua Orca
              - text: ", chỉ đọc repository, không sửa file hoặc Obsidian. Mã tham chiếu lượt review:"
