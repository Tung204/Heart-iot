              - text: ; nguồn đọc bổ sung được ghi ngày riêng bên dưới. Các nguồn trả HTTP 200 ở lần đọc thành công; JSON Schema trả 403 ở một lần truy cập bổ sung. Tra cứu Context7 gặp giới hạn quota nên dùng nguồn chính thức trực tiếp. Không sao chép mã thư viện; khi lấy code/asset/dataset cần ghi giấy phép cụ thể. Các nguồn phần mềm này mô tả tiêu chuẩn/hướng dẫn, không cung cấp kết quả thực nghiệm của đồ án.
