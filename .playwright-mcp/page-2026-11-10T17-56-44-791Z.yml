                    - cell "Cảnh báo vẫn theo logic riêng; không để LLM tự đóng hoặc quyết định sự an toàn" [ref=f4e2772]
            - paragraph [ref=f4e2773]:
              - text: Chặng incident phụ thuộc việc sửa findings v0.1 và kiểm trên firmware/backend thực tế. Mô phỏng sự kiện té ngã không phải đo độ chính xác phát hiện té ngã; khả năng đo phần cứng được trình bày riêng theo
              - link "chương 08" [ref=f4e2774] [cursor=pointer]:
                - /url: "#kiem-thu"
              - text: . Chưa có kết quả demo của các chặng trên.
            - heading "12. Ma trận kiểm chứng cho hướng AI thực thi" [level=3] [ref=f4e2775]
            - paragraph [ref=f4e2776]:
              - text: Các mã dưới đây là tiêu chí đề xuất,
              - strong [ref=f4e2777]: chưa phải test executable hoặc kết quả đạt
              - text: . Chọn lớp nhỏ nhất sở hữu hành vi; integration/race/E2E được dùng khi tình huống yêu cầu. Bộ này bổ sung T-01…T-14 của baseline, không đánh dấu chúng đã hoàn tất.
