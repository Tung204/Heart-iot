            - 'heading "Ví dụ soft-delete: chốt nghĩa trước khi chia sẻ code" [level=3] [ref=f4e2135]'
            - paragraph [ref=f4e2136]:
              - text: Đây là tình huống người dùng kể về dự án khác,
              - strong [ref=f4e2137]: chưa phải chính sách xóa đã chọn cho DATN
              - text: . “Soft-delete”, “archive”, vô hiệu hóa truy cập và tháo liên kết có thể là các hành vi khác nhau. Không suy việc gắn
              - code [ref=f4e2138]: deleted_at
              - text: sẽ tự gỡ khóa ngoại hoặc tự thu hồi toàn bộ quyền.
            - paragraph [ref=f4e2139]: "Khi đặc tả chính sách xóa, cần xác định: dữ liệu giữ lại, quyền đọc chi tiết/truy vấn trực tiếp, quan hệ còn giữ hay được kết thúc, tác vụ đang chạy, phục hồi, xung đột định danh và lịch sử audit. Quan hệ lịch sử phục vụ báo cáo có thể cần giữ nguyên; nếu cần tháo quan hệ hoạt động thì mô tả riêng, không xóa khóa ngoại hàng loạt từ một tên chức năng."
            - paragraph [ref=f4e2140]: "Tình huống hồi quy phù hợp: một đối tượng bị xóa theo chính sách không còn xuất hiện hoặc được thao tác qua các đường bị cấm như danh sách, URL chi tiết, search, export, AI tool, job và cache; những đường lịch sử/quản trị được phép vẫn đúng quyền. Có kiểm restore nếu nghiệp vụ cho phép. Không chỉ test một utility hoặc hai trang rồi kết luận toàn hệ thống nhất quán."
            - heading "Phát triển backend và preview frontend" [level=3] [ref=f4e2141]
            - paragraph [ref=f4e2142]:
              - text: Áp dụng ranh giới trong
              - link "định hướng nền tảng" [ref=f4e2143] [cursor=pointer]:
                - /url: "#nen-tang-ai"
              - text: . Người dùng yêu cầu frontend có preview/chấp nhận; chuẩn bị đầy đủ bản xem trước, diff và kiểm liên quan trước khi xin quyết định áp dụng. Thay đổi nội dung tài liệu hiện tại không phải phát hành frontend của sản phẩm.
            - paragraph [ref=f4e2144]: Việc AI được giao sửa backend ở môi trường phát triển không có nghĩa AI runtime có quyền sửa chính backend đang chạy. Cơ chế branch/review/release/sandbox của sản phẩm là đề xuất cần chốt, không tự coi bài trả lời ở link chia sẻ là ủy quyền triển khai production.
            - heading "Kiểm chứng đúng lớp và đúng phạm vi" [level=3] [ref=f4e2145]
            - list [ref=f4e2146]:
              - listitem [ref=f4e2147]: Bắt đầu bằng lint/type-check hoặc syntax liên quan khi đã có toolchain, rồi test nhỏ nhất bao phủ hành vi ứng dụng sở hữu.
              - listitem [ref=f4e2148]: Mở rộng integration/contract khi luồng dữ liệu qua nhiều module, quyền hoặc lưu trữ bị ảnh hưởng. E2E, race, load và stress dùng khi khớp rủi ro cần điều tra.
              - listitem [ref=f4e2149]: Không test lại nội bộ framework, không viết test chỉ lặp lại implementation hoặc tạo test hình thức cho sửa đổi tài liệu nhỏ.
              - listitem [ref=f4e2150]: Chạy test tuần tự mặc định. Lỗi thì đọc bằng chứng và sửa nguyên nhân; không retry mù, bỏ/nới test để làm xanh.
              - listitem [ref=f4e2151]: Chỉ chạy full suite khi cần release gate hoặc bằng chứng hồi quy rộng. Chạy đạt không đồng nghĩa đã deploy hoặc được nghiệm thu.
            - paragraph [ref=f4e2152]: Khi có source, có thể thêm kiểm dependency boundary, contract và policy để ngăn lệch kiến trúc. Chọn kiểm tra gắn với rủi ro cụ thể; không mặc định phải cài mọi công cụ nêu trong bài tham khảo. Hiện chưa có các quality gate đó.
            - heading "Điều kiện báo hoàn thành" [level=3] [ref=f4e2153]
            - heading "Hồ sơ thay đổi có thể đối chiếu" [level=4] [ref=f4e2154]
            - paragraph [ref=f4e2155]:
              - text: Bổ sung ngày
              - strong [ref=f4e2156]: 11/11/2026
              - text: . Mẫu dưới đây dùng trong tài liệu module, ADR hoặc mô tả thay đổi tương ứng; không tạo checklist tiến độ thứ hai. Điền bằng nguồn thật, ghi rõ “chưa có/chưa đo” khi thiếu. Với sửa tài liệu đơn giản, chỉ cần các mục liên quan; không tạo hồ sơ hình thức cho mỗi câu chữ.
            - region "Bảng dữ liệu có thể cuộn ngang" [ref=f4e2157]:
              - table [ref=f4e2158]:
