            - paragraph [ref=f4e3190]: "Hệ thống gồm thiết bị ghi nhận nhịp tim/vận động, nền tảng theo dõi cho người dùng và người thân, luồng cảnh báo té ngã có xác nhận. Yêu cầu bổ sung: AI thực hiện nghiệp vụ và tự chạy trong phạm vi được giao, cùng web/app có cấu hình động và giao diện thao tác thông thường."
            - paragraph [ref=f4e3191]:
              - strong [ref=f4e3192]: "Trạng thái ngày 11/11/2026:"
              - text: có thiết kế IoT v0.1, khung thư mục, yêu cầu nền tảng AI/cấu hình động và đặc tả đề xuất chi tiết về thực thi AI. Đã dùng Codex review độc lập và bổ sung quy tắc cho bốn khoảng trống thiết kế tìm được. Chưa có mã ứng dụng, firmware chạy được, thiết bị đã kiểm chứng hoặc kết quả thử nghiệm sản phẩm. Hướng nền tảng và các lựa chọn công nghệ còn cần chốt; không coi baseline v0.1 là đặc tả đầy đủ cho AI thực thi.
