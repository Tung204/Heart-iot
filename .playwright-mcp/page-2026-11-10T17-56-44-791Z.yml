            - paragraph [ref=f4e1873]:
              - text: Hai vai trò AI có thể sử dụng cùng model nhưng phải khác credential và đường thực thi.
              - strong [ref=f4e1874]: AI vận hành
              - text: chỉ dùng capability được cấp;
              - strong [ref=f4e1875]: AI hỗ trợ phát triển
              - text: tạo code/tài liệu/bài kiểm thử ở môi trường phát triển. Không chuyển quyền production hoặc credential của developer vào Agent runtime.
            - paragraph [ref=f4e1876]: "Luồng đề xuất khi thật sự cần code mới: yêu cầu → khảo sát/tài liệu/impact map → branch chứa diff và môi trường thực thi giới hạn quyền → test → review/preview phù hợp → phát hành đúng bản được duyệt → theo dõi. Nếu đưa Coding Agent vào sản phẩm, tiến trình coding/build/test không được có credential hoặc đường ghi production, không đọc secrets/file ngoài phạm vi được cấp; filesystem, network và database phải được cưỡng chế ở môi trường chạy. Quyền release nằm ở đường phát hành riêng. Đây là điều kiện cho năng lực còn đang đề xuất, chưa yêu cầu dựng sandbox ngay hoặc khẳng định sandbox đã có. Chi tiết và cách kiểm nằm ở mục 7 của chương 13."
            - paragraph [ref=f4e1877]: Rollback code không tự phục hồi dữ liệu đã biến đổi; migration cần xét riêng khả năng phục hồi, backup và tương thích với phiên bản cũ.
