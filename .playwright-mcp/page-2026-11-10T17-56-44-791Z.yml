            - paragraph [ref=f4e1800]: Các chương 02/03/06/07 mô tả baseline v0.1 trước yêu cầu AI thực thi. Giữ chúng để đối chiếu; phạm vi AI chỉ đọc trong baseline không còn mô tả đầy đủ mục tiêu mới. Sau khi chốt tài liệu này phải cập nhật đồng bộ yêu cầu, kiến trúc, API, giao diện và kiểm thử trước khi triển khai AI Agent. Những giới hạn về quyền sức khỏe và đường cảnh báo độc lập vẫn có giá trị.
