            - paragraph [ref=f4e1209]:
              - strong [ref=f4e1210]: "Mục đích đề xuất:"
              - text: giúp người dùng/người thân hiểu dữ liệu đã có, nhận biết dữ liệu thiếu và tra cứu kiến thức phổ thông từ nguồn được duyệt. AI không nằm trong đường quyết định phát hiện/gửi cảnh báo té ngã.
            - heading "Phạm vi theo mức hoàn thiện" [level=3] [ref=f4e1211]
            - region "Bảng dữ liệu có thể cuộn ngang" [ref=f4e1212]:
              - table [ref=f4e1213]:
                - rowgroup [ref=f4e1214]:
                  - row [ref=f4e1215]:
                    - columnheader "Mức" [ref=f4e1216]
