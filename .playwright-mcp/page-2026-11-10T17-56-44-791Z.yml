            - paragraph [ref=f4e802]:
              - text: Server bổ sung
              - code [ref=f4e803]: received_at
              - text: ","
              - code [ref=f4e804]: assignment_id
              - text: và cờ dữ liệu trễ. Firmware không được tự khai người được theo dõi. Khi không đủ bằng chứng để gán dữ liệu vào lịch sử assignment, giữ bản tin ở vùng cách ly; không tự gán vào chủ hiện tại.
            - paragraph [ref=f4e805]: Tổng bước theo ngày được tính từ delta trong từng boot và gán vào khoảng có thời gian tin cậy. Lần nhận đầu của boot sau một đoạn mất dữ liệu có thể không phân bổ chính xác theo ngày; đánh dấu chưa đủ dữ liệu thay vì cộng toàn bộ vào ngày nhận. Khi counter giảm trong cùng boot, ghi lỗi dữ liệu. Ngày hiển thị theo timezone hồ sơ; lưu timestamp UTC.
            - heading "Topic và giao nhận MQTT" [level=3] [ref=f4e806]
            - region "Bảng dữ liệu có thể cuộn ngang" [ref=f4e807]:
              - table [ref=f4e808]:
                - rowgroup [ref=f4e809]:
                  - row [ref=f4e810]:
                    - columnheader "Topic" [ref=f4e811]
                    - columnheader "Hướng" [ref=f4e812]
                    - columnheader "Payload/chính sách" [ref=f4e813]
                - rowgroup [ref=f4e814]:
                  - row [ref=f4e815]:
                    - cell [ref=f4e816]:
                      - code [ref=f4e817]: "v1/devices/{device_id}/telemetry"
                    - cell "Thiết bị → backend" [ref=f4e818]
                    - cell "Envelope telemetry; QoS 1 đề xuất, có thể tổng hợp mẫu để giảm băng thông" [ref=f4e819]
                  - row [ref=f4e820]:
                    - cell [ref=f4e821]:
                      - code [ref=f4e822]: "v1/devices/{device_id}/events"
                    - cell "Thiết bị → backend" [ref=f4e823]
                    - cell [ref=f4e824]:
                      - code [ref=f4e825]: fall.candidate
                      - text: ","
                      - code [ref=f4e826]: fall.cancelled
                      - text: ","
                      - code [ref=f4e827]: fall.confirmed
                      - text: ","
                      - code [ref=f4e828]: user.cancel_requested
                      - text: ","
                      - code [ref=f4e829]: sos.confirmed
                      - text: ; QoS 1
                  - row [ref=f4e830]:
                    - cell [ref=f4e831]:
                      - code [ref=f4e832]: "v1/devices/{device_id}/status"
                    - cell "Thiết bị/broker → backend" [ref=f4e833]
                    - cell "Presence/heartbeat gồm boot_id, uptime, firmware, pin nếu có; LWT chỉ là gợi ý mất kết nối" [ref=f4e834]
                  - row [ref=f4e835]:
                    - cell [ref=f4e836]:
                      - code [ref=f4e837]: "v1/devices/{device_id}/acks"
                    - cell "Backend → thiết bị" [ref=f4e838]
                    - cell "ACK ứng dụng cho sự kiện quan trọng sau commit" [ref=f4e839]
            - paragraph [ref=f4e840]: "Không retain telemetry hoặc sự kiện té ngã: subscriber mới không được hiểu một sự kiện cũ là mới. Có thể retain presence, nhưng phải kiểm thời gian nhận. Topic status dùng cùng envelope định danh khi do thiết bị gửi; LWT do broker gửi phải được nhận diện riêng và không đưa vào bảng dữ liệu đo."
            - paragraph [ref=f4e841]:
              - text: ACL buộc
              - code [ref=f4e842]: device_id
              - text: trong topic và payload khớp định danh đã cấp. Subscriber backend không tin một device_id chỉ vì JSON hợp lệ. Certificate/credential provisioning và rotation được chọn khi dựng broker; không dùng chung một tài khoản thiết bị cho mọi board.
            - heading "Incident và ACK" [level=3] [ref=f4e843]
            - paragraph [ref=f4e844]:
              - text: Sự kiện dùng envelope như telemetry, thay
              - code [ref=f4e845]: metrics
              - text: bằng
              - code [ref=f4e846]: incident_id
              - text: ","
              - code [ref=f4e847]: event_revision
              - text: ","
              - code [ref=f4e848]: event_type
              - text: và
              - code [ref=f4e849]: evidence
              - text: .
              - code [ref=f4e850]: event_revision
              - text: bắt đầu 1 ở candidate, tăng theo từng thay đổi của incident và cần phục hồi được sau reboot nếu incident còn mở.
              - code [ref=f4e851]: fall.confirmed
              - text: phải mang đủ dữ liệu để xử lý khi candidate chưa đến.
            - paragraph [ref=f4e852]:
              - code [ref=f4e853]: evidence.algorithm_version
              - text: ", vị trí đeo và cờ chất lượng giúp giải thích nguyên nhân; không gọi một điểm heuristic là “xác suất té ngã” nếu chưa hiệu chuẩn."
            - paragraph [ref=f4e854]:
              - text: ACK gồm
              - code [ref=f4e855]: source_message_id
              - text: ","
              - code [ref=f4e856]: incident_id
              - text: ","
              - code [ref=f4e857]: accepted_revision
              - text: ","
              - code [ref=f4e858]: status
              - text: ","
              - code [ref=f4e859]: received_at
              - text: .
              - code [ref=f4e860]: accepted
              - text: nghĩa server đã ghi bền;
              - code [ref=f4e861]: duplicate
              - text: nghĩa bản tin giống hệt đã được ghi.
              - code [ref=f4e862]: rejected
              - text: kèm mã lý do để không retry vô hạn. Thiết bị chỉ xóa sự kiện khỏi hàng đợi sau ACK accepted/duplicate đúng định danh; bản tin bị reject chuyển vùng lỗi hữu hạn để kiểm tra.
            - paragraph [ref=f4e863]:
              - text: Nếu revision mới tới trước revision cũ, server lưu lịch sử và áp dụng transition hợp lệ theo revision mới; bản cũ tới sau không làm lùi trạng thái. Hai payload khác nhau cùng revision là lỗi giao thức cần audit. Chuyển
              - code [ref=f4e864]: cancelled
              - text: sang
              - code [ref=f4e865]: open
              - text: bằng dữ liệu cũ bị cấm.
            - heading "API dự kiến" [level=3] [ref=f4e866]
            - paragraph [ref=f4e867]:
              - text: Prefix
              - code [ref=f4e868]: /api/v1
              - text: ; đây là inventory thiết kế, chưa có endpoint chạy.
            - region "Bảng dữ liệu có thể cuộn ngang" [ref=f4e869]:
