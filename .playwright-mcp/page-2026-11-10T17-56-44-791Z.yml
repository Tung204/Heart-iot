              - text: hoặc khẳng định chưa có tác động. Resume phải giữ lịch sử tác động và kiểm lại điều kiện, không tạo lại run mới để né trạng thái chưa xác định.
            - paragraph [ref=f4e2461]: "Các chuyển trạng thái dùng kiểm version và worker ownership. Hai worker cùng lấy việc phải có cơ chế claim/lease; worker mất lease không được ghi đè kết quả của worker mới. Lease không tự ngăn request bên ngoài đã gửi: vẫn cần idempotency/đối soát ở nơi sở hữu tác động."
            - paragraph [ref=f4e2462]:
              - text: Run gắn version workflow, contract và bản build thực thi có khả năng chạy lại version đó. Nếu version không còn an toàn hoặc đã bị vô hiệu hóa, chuyển
              - code [ref=f4e2463]: suspended
              - text: ", chặn bước mới và xử lý bằng migration/replan có lưu vết; tác động đã dispatch vẫn phải đối soát. Không âm thầm dùng implementation mới dưới nhãn version cũ. Replan tăng"
              - code [ref=f4e2464]: plan_version
              - text: ", giữ lịch sử bước đã hoàn tất và vô hiệu hóa approval không còn khớp; không chạy lại các tác động cũ để “làm lại từ đầu”."
            - heading "Dừng, hoàn tác và thất bại một phần" [level=4] [ref=f4e2465]
            - paragraph [ref=f4e2466]: Dừng ngăn bước mới theo mốc server đã ghi; tác động đang commit hoặc đã dispatch được xử lý theo trạng thái thực tế. UI phải nói được “đã yêu cầu dừng”, “đã dừng”, “còn tác động đang đối soát”.
            - paragraph [ref=f4e2467]: Hoàn tác là capability riêng với quyền và điều kiện hiện tại. Nếu A sửa tên rồi B sửa tiếp, undo của A không được ghi đè thay đổi của B; cần version/precondition. Gửi thông báo, tải file ra ngoài và việc người nhận đã xem không thể thu hồi bằng rollback database. Một chuỗi nhiều service không được quảng cáo là transaction nguyên khối; nếu có compensation thì ghi rõ hành động bù, điều kiện thất bại và trạng thái còn lại.
            - heading "5. Retry, idempotency và sự kiện" [level=3] [ref=f4e2468]
            - heading "Nhận diện yêu cầu trước lần gửi đầu tiên" [level=4] [ref=f4e2469]
            - paragraph [ref=f4e2470]:
              - text: Đề xuất bên gọi tạo và giữ
              - code [ref=f4e2471]: request_key
              - text: ổn định trước lần đầu gọi
              - code [ref=f4e2472]: POST /agent-runs
              - text: . API xác định scope từ danh tính đã xác thực và workspace được phép, chuẩn hóa input rồi lưu ánh xạ
              - code [ref=f4e2473]: (scope, request_key) → run_id, operation_id, input_fingerprint
              - text: cùng bản ghi run trong một transaction. Unique constraint/điều kiện ghi tương đương phải ngăn hai request đồng thời tạo hai run. Khóa do client gửi chỉ nhận diện ý định, không cấp quyền, không cho chọn tenant hoặc chạy dưới danh tính khác.
            - paragraph [ref=f4e2474]: Nếu server đã commit nhưng response mất, client retry cùng key/input sẽ nhận lại cùng run sau kiểm quyền hiện tại. Cùng key khác input trả conflict; request thật sự độc lập dùng key mới. Client không tạo key mới chỉ vì timeout. Với scheduler/event handler, khóa khởi tạo lấy từ trigger/activation generation và occurrence/event ID ổn định; không sinh ID ngẫu nhiên mỗi lần callback được giao lại. Thời hạn hỗ trợ retry và cách xử lý key hết hạn phải có trong contract; client không tự gửi lại một ý định cũ bằng key mới khi chưa đối soát.
            - heading "Chống trùng tác động bên trong run" [level=4] [ref=f4e2475]
            - paragraph [ref=f4e2476]: Đề xuất logical operation ID được server tạo và giữ qua mọi attempt. Khóa chống trùng được định danh theo phạm vi chủ sở hữu, capability/version và operation; lưu fingerprint input đã chuẩn hóa cùng kết quả. Cùng khóa nhưng khác input phải bị từ chối. Khóa không được đổi mỗi lần model lập lại câu lệnh.
            - paragraph [ref=f4e2477]: Với ghi trong cùng database, kết quả nghiệp vụ, dấu đã xử lý và sự kiện outbox cần commit nhất quán. Retry sau timeout đọc lại kết quả đã commit qua quyền hiện tại, không tạo bản ghi thứ hai. Thời hạn giữ khóa phải bao phủ khoảng retry/recovery được hỗ trợ; không tự chọn TTL ngắn hơn vòng đời tác vụ. Dù có khóa chống trùng, hai yêu cầu độc lập khác khóa vẫn có thể tạo trùng nghiệp vụ; module cần quy tắc riêng, ví dụ một công việc bảo trì cho cùng episode mất tín hiệu.
            - region "Bảng dữ liệu có thể cuộn ngang" [ref=f4e2478]:
              - table [ref=f4e2479]:
                - rowgroup [ref=f4e2480]:
                  - row [ref=f4e2481]:
                    - columnheader "Tình huống" [ref=f4e2482]
                    - columnheader "Xử lý đề xuất" [ref=f4e2483]
                - rowgroup [ref=f4e2484]:
                  - row [ref=f4e2485]:
                    - cell "Validation sai, thiếu quyền, tool không hỗ trợ" [ref=f4e2486]
                    - cell "Không retry; trả lỗi rõ, làm rõ yêu cầu hoặc đổi kế hoạch trong scope" [ref=f4e2487]
                  - row [ref=f4e2488]:
                    - cell "Xung đột version" [ref=f4e2489]
                    - cell "Đọc lại trong quyền hiện tại, tính lại diff; duyệt lại nếu tác động thay đổi" [ref=f4e2490]
                  - row [ref=f4e2491]:
                    - cell "Quá tải/rate limit hoặc lỗi tạm thời chưa gây tác động" [ref=f4e2492]
                    - cell "Retry có backoff, hạn lần và deadline; theo contract provider" [ref=f4e2493]
                  - row [ref=f4e2494]:
                    - cell "Timeout sau khi đã gửi thao tác ghi" [ref=f4e2495]
                    - cell [ref=f4e2496]:
                      - text: Tra trạng thái theo operation/provider reference; giữ
                      - code [ref=f4e2497]: unknown
                      - text: nếu chưa có bằng chứng
                  - row [ref=f4e2498]:
                    - cell "Dịch vụ ngoài hỗ trợ idempotency" [ref=f4e2499]
                    - cell "Giữ nguyên khóa và payload, ghi tham chiếu trả về; kiểm giới hạn bảo đảm của provider" [ref=f4e2500]
                  - row [ref=f4e2501]:
                    - cell "Dịch vụ ngoài không hỗ trợ dedup/status" [ref=f4e2502]
                    - cell "Không hứa exactly-once; dừng retry tự động khi có thể nhân đôi, chuyển đối soát có người xử lý" [ref=f4e2503]
            - paragraph [ref=f4e2504]: Event có ID, loại, resource ID/version và correlation tới run; payload chỉ chứa phần cần thiết. Consumer phải xử lý bản tin lặp và sự kiện tới muộn. Sau thay đổi nghiệp vụ, UI tải lại dữ liệu đang có quyền từ service; không dùng câu trả lời model làm nguồn ghi trực tiếp vào bảng.
            - paragraph [ref=f4e2505]: Outbox chỉ giải quyết một phần bài toán ghi database và phát sự kiện. Nó không tự bảo đảm thông báo còn hợp lệ ở lúc gửi, không tự ngăn consumer xử lý lặp và không chứng minh người nhận đã đọc. Đây cũng là lý do finding về incident đã đóng trong review v0.1 vẫn phải xử lý riêng.
            - heading "Chặn vòng phản hồi giữa nhiều run" [level=4] [ref=f4e2506]
            - paragraph [ref=f4e2507]:
              - text: Giới hạn số bước trong một run không chặn được chuỗi A tạo event → B chạy → B tạo event → A chạy lại. Đề xuất event/run giữ
              - code [ref=f4e2508]: root_execution_id
              - text: ","
              - code [ref=f4e2509]: causation_event_id
              - text: ","
              - code [ref=f4e2510]: parent_run_id
              - text: ", trigger và activation generation từ server. Chuỗi con giữ nguồn và quota đã kế thừa; không tự reset ngân sách bằng cách tạo run mới. Callback từ connector cần correlation đáng tin; thiếu nguồn theo contract thì không tự coi là một ý định độc lập được cấp ngân sách mới."
            - paragraph [ref=f4e2511]: Baseline đề xuất không kích hoạt lại cùng workflow từ tác động của chính nó hoặc từ nhánh có workflow đó trong ancestry, trừ khi có chính sách re-entry đã được chốt. Workflow A/B kích hoạt chéo vẫn phải qua kiểm lineage. Khi publish, kiểm chu kỳ trong phần đồ thị đã biết; kiểm tĩnh này không thay kiểm lúc chạy vì sự kiện có thể đi qua nhiều module/connector.
            - paragraph [ref=f4e2512]: Trước tạo run con và trước tác động, kiểm và tiêu thụ/reserve hạn mức dùng chung theo delegation/root execution bằng thao tác atomic. Quy định độ sâu, tổng run, tổng tác động, thời gian và ngân sách theo policy có version; giá trị cụ thể chưa chốt. Retry một occurrence không tiêu thụ như một run mới. Tác động chưa rõ kết quả không được hoàn quota như chắc chắn chưa chạy. Thêm quota theo workspace trong một cửa sổ thời gian để chặn chuỗi mất correlation hoặc nhiều nguồn độc lập; không dựa riêng vào việc model giữ đúng lineage.
            - paragraph [ref=f4e2513]: Vượt hạn mức hoặc gặp chu kỳ bị cấm thì không tạo run mới, ghi trigger bị chặn và nguồn gốc vào audit; run hiện tại dừng/suspend phần phụ thuộc theo lý do thực tế. Quy tắc này chỉ áp dụng tự động hóa AI/module được giao, không làm đường cảnh báo IoT phụ thuộc ngân sách model.
            - heading "6. Cấu hình, preview và phát hành một phiên bản" [level=3] [ref=f4e2514]
            - paragraph [ref=f4e2515]:
              - text: Đề xuất mọi bản cấu hình lưu
              - code [ref=f4e2516]: config_id
              - text: ","
              - code [ref=f4e2517]: schema_version
              - text: ","
              - code [ref=f4e2518]: revision
              - text: ","
              - code [ref=f4e2519]: base_revision
              - text: ", scope, nội dung, digest, phụ thuộc và trạng thái. Phụ thuộc gồm component/data source/tool/workflow version cần để chạy."
              - code [ref=f4e2520]: revision
              - text: là phiên bản nội dung;
              - code [ref=f4e2521]: schema_version
              - text: mô tả định dạng. Hai giá trị không thay thế nhau.
            - region "Bảng dữ liệu có thể cuộn ngang" [ref=f4e2522]:
              - table [ref=f4e2523]:
                - rowgroup [ref=f4e2524]:
                  - row [ref=f4e2525]:
                    - columnheader "Giai đoạn" [ref=f4e2526]
                    - columnheader "Điều kiện chuyển" [ref=f4e2527]
                    - columnheader "Bằng chứng lưu" [ref=f4e2528]
                - rowgroup [ref=f4e2529]:
                  - row [ref=f4e2530]:
                    - cell "Nháp" [ref=f4e2531]
                    - cell "Người tạo được phép trong scope" [ref=f4e2532]
                    - cell "Nội dung và phiên bản nền" [ref=f4e2533]
                  - row [ref=f4e2534]:
                    - cell "Kiểm hợp lệ" [ref=f4e2535]
                    - cell "Schema, tham chiếu, quyền, compatibility và giới hạn đạt" [ref=f4e2536]
                    - cell "Kết quả validator cùng version công cụ" [ref=f4e2537]
                  - row [ref=f4e2538]:
                    - cell "Preview/chạy thử" [ref=f4e2539]
                    - cell "Có môi trường/data source xác định rõ" [ref=f4e2540]
                    - cell "Diff, layout, dữ liệu mẫu có nhãn hoặc dữ liệu được cấp quyền" [ref=f4e2541]
                  - row [ref=f4e2542]:
                    - cell "Chấp nhận" [ref=f4e2543]
                    - cell "Đúng người có quyền, đúng digest/version/scope" [ref=f4e2544]
                    - cell "Quyết định, thời hạn, dependencies đã kiểm" [ref=f4e2545]
                  - row [ref=f4e2546]:
                    - cell "Kích hoạt" [ref=f4e2547]
                    - cell "Kiểm lại quyền và phiên bản nền; cập nhật atomically" [ref=f4e2548]
                    - cell "Publication ID, phiên bản đã áp dụng, sự kiện sau commit" [ref=f4e2549]
                  - row [ref=f4e2550]:
                    - cell "Theo dõi/thu hồi" [ref=f4e2551]
                    - cell "Kết quả chạy và compatibility thực tế" [ref=f4e2552]
                    - cell "Lỗi, phiên bản thay thế, ảnh hưởng tới run đang chạy" [ref=f4e2553]
            - paragraph [ref=f4e2554]: Frontend chính thức luôn cần preview/chấp nhận theo yêu cầu người dùng, kể cả cấu hình chỉ áp dụng cá nhân. Người chấp nhận cho từng scope còn cần chốt. Nếu một cấu hình backend đồng thời tạo/sửa form/menu/dashboard thì phần thay đổi giao diện cũng đi qua cổng này; không lách bằng cách gọi nó là “chỉ cấu hình”.
            - heading "Preview phải tách tác động thật" [level=4] [ref=f4e2555]
            - paragraph [ref=f4e2556]: Preview hiển thị đúng artifact/digest sắp công bố, với responsive, empty/error/loading và quyền vai trò liên quan. Đề xuất adapter preview chỉ đọc dữ liệu đã được cấp quyền, còn thao tác ghi/gửi notification/export tới người nhận thật bị thay bằng kết quả mô phỏng hoặc bị chặn. Nhãn preview không đủ bảo vệ nếu nút vẫn gọi production API; backend cần phân biệt môi trường và từ chối tác động thật từ đường preview.
            - paragraph [ref=f4e2557]: "Chạy thử workflow sinh bản dự kiến: đối tượng nào, diff nào, tool nào, bước nào phải duyệt và chi phí ước lượng nếu có nguồn tính. Không gọi một tool ghi thật rồi rollback database để giả dry-run, vì email hoặc request ngoài có thể đã gửi. Dữ liệu mẫu không được ghi lẫn vào nguồn thật; preview dùng dữ liệu thật phải có quyền và giới hạn như trang chính thức."
            - paragraph [ref=f4e2558]: Publish dùng compare-and-set trên phiên bản hiện hành và đúng nội dung đã duyệt. Có thay đổi song song thì trả xung đột, tạo diff mới và preview lại; không tự merge rồi công bố bằng approval cũ. Thay đổi dependency có thể ảnh hưởng hiển thị/hành vi cũng làm bản preview cũ hết hiệu lực, trừ khi có quy tắc compatibility đã được kiểm chứng.
            - paragraph [ref=f4e2559]: Rollback cấu hình tạo một lần công bố mới từ phiên bản cũ đã được kiểm tương thích và preview/chấp nhận theo yêu cầu frontend. Không xóa lịch sử, không đổi ngược dữ liệu nghiệp vụ đã ghi. Run đang chạy giữ version đã gắn hoặc dừng theo policy; khi sửa lỗi bảo mật không được tiếp tục version cũ chỉ vì “đã pin”.
            - heading "Đổi lịch/trigger và mốc áp dụng" [level=4] [ref=f4e2560]
            - paragraph [ref=f4e2561]:
              - text: Đề xuất mỗi activation có
              - code [ref=f4e2562]: generation
              - text: tăng đơn điệu và mốc có hiệu lực do server ghi. Cập nhật active generation cùng publication trong một transaction; rollback nội dung cũng tạo generation mới. Callback mang trigger ID, generation và occurrence ID, không chỉ tên workflow hoặc giờ chạy. Khi nhận callback, kiểm generation còn được phép kích hoạt và tạo run/chống trùng occurrence atomically với nguồn trạng thái publication; không chỉ tin cache của scheduler.
            - paragraph [ref=f4e2563]: Nếu v2 đã bỏ lịch, callback v1 đến sau bị ghi nhận là stale và không tạo run. Nếu callback thắng transaction trước v2, đó là run cũ đã tồn tại và xử lý theo policy bên dưới. Publication event là tín hiệu để scheduler cập nhật; consumer bỏ event generation cũ đến muộn và đối chiếu nguồn hiện hành khi restart. Xóa timer phía scheduler giúp dọn việc nhưng không phải cơ chế bảo đảm duy nhất.
            - region "Bảng dữ liệu có thể cuộn ngang" [ref=f4e2564]:
              - table [ref=f4e2565]:
                - rowgroup [ref=f4e2566]:
                  - row [ref=f4e2567]:
                    - columnheader "Thời điểm của công việc v1 khi v2 có hiệu lực" [ref=f4e2568]
                    - columnheader "Policy baseline đề xuất" [ref=f4e2569]
                - rowgroup [ref=f4e2570]:
                  - row [ref=f4e2571]:
                    - cell "Callback đã lên lịch, chưa có run" [ref=f4e2572]
                    - cell "Không tạo run nếu generation đã hết hiệu lực" [ref=f4e2573]
                  - row [ref=f4e2574]:
                    - cell "Run đã tạo nhưng chưa bước nào được dispatch, kể cả đang chờ input/approval" [ref=f4e2575]
                    - cell "Hủy do cấu hình thay thế; nếu muốn chạy lại phải tạo ý định/approval phù hợp v2" [ref=f4e2576]
                  - row [ref=f4e2577]:
                    - cell "Run đã có bước dispatch hoặc tác động" [ref=f4e2578]
                    - cell "Giữ v1 để kết thúc/đối soát theo delegation còn hiệu lực; không chuyển ngầm sang v2" [ref=f4e2579]
                  - row [ref=f4e2580]:
                    - cell "Version bị security-disable, delegation bị thu hồi hoặc có yêu cầu dừng" [ref=f4e2581]
                    - cell "Chặn dispatch mới; xử lý tác động đang chạy theo mục 4, bất kể pin version" [ref=f4e2582]
            - paragraph [ref=f4e2583]: Chuyển từ run chưa chạy sang lần dispatch đầu phải kiểm generation tại ranh giới atomic/fencing phù hợp để không vượt qua publication vừa có hiệu lực. Nếu cần policy drain khác cho run chưa chạy, phải khai báo, hiển thị và duyệt trước khi publish; không dùng mặc định ẩn. Lịch/timezone, cách bỏ qua hoặc chạy bù occurrence bị lỡ và giới hạn backlog cần chốt trong contract scheduler; chạy bù cũng qua generation, dedup và quota như callback thường.
            - heading "Trường động và workflow động" [level=4] [ref=f4e2584]
            - paragraph [ref=f4e2585]: Trường mở rộng có kiểu, validation, khả năng tìm/lọc/sort/export và quyền đọc/ghi; không chỉ là nhãn trên form. Thêm field phải đi qua các đường service, API, AI, job, báo cáo và UI có liên quan. Cần chọn cách lưu/index sau khi có nhu cầu truy vấn và database; chưa mặc định JSON blob hoặc tự tạo bảng qua prompt.
            - paragraph [ref=f4e2586]: Workflow sử dụng trigger/condition/action trong registry, biểu thức hữu hạn và giới hạn fan-out, vòng lặp, thời gian và retry. Cấu hình không chứa SQL, shell, JavaScript hoặc URL tùy ý để engine thực thi. Connector mới là năng lực kỹ thuật cần xây và kiểm; không tự xuất hiện từ một manifest. Đổi kiểu/xóa field phải có phân tích dữ liệu cũ, migration và compatibility trước khi kích hoạt.
            - heading "7. Khi AI cần thay backend hoặc tạo module mới" [level=3] [ref=f4e2587]
            - paragraph [ref=f4e2588]: "Đề xuất chia ba mức để đo đúng độ khó và kiểm soát phạm vi:"
            - region "Bảng dữ liệu có thể cuộn ngang" [ref=f4e2589]:
              - table [ref=f4e2590]:
                - rowgroup [ref=f4e2591]:
                  - row [ref=f4e2592]:
                    - columnheader "Mức" [ref=f4e2593]
                    - columnheader "Đầu ra AI tạo" [ref=f4e2594]
                    - columnheader "Đường kiểm và phát hành" [ref=f4e2595]
                - rowgroup [ref=f4e2596]:
                  - row [ref=f4e2597]:
                    - cell "Kết hợp capability có sẵn" [ref=f4e2598]
                    - cell "Workflow, biểu mẫu, bộ lọc, dashboard, cấu hình module" [ref=f4e2599]
                    - cell "Schema/compatibility, chạy thử, preview và duyệt theo scope" [ref=f4e2600]
                  - row [ref=f4e2601]:
                    - cell "Thêm capability chưa có" [ref=f4e2602]
                    - cell "Đề xuất contract, implementation service/tool, test, tài liệu" [ref=f4e2603]
                    - cell "Coding Agent ở môi trường phát triển; diff, review, test và release riêng" [ref=f4e2604]
                  - row [ref=f4e2605]:
                    - cell "Thay core hoặc cấu trúc dữ liệu" [ref=f4e2606]
                    - cell "Auth/tenant logic, migration, hạ tầng, connector có credential" [ref=f4e2607]
                    - cell "Yêu cầu kỹ thuật có thẩm quyền, impact map, bằng chứng hồi quy và kế hoạch phục hồi riêng" [ref=f4e2608]
            - paragraph [ref=f4e2609]: Runtime không được gọi trực tiếp công cụ sửa repository, chạy shell, cấp secrets hoặc migration production. Nếu cần năng lực mới, nó tạo đề nghị có mục đích, input/output và phần đang thiếu; không giả gọi một tool chưa được triển khai. Việc đưa Coding Agent vào chính sản phẩm vẫn là lựa chọn chưa chốt, khác với dùng Codex hỗ trợ phát triển đồ án hiện tại.
            - paragraph [ref=f4e2610]: "Nếu chọn đưa Coding Agent vào sản phẩm, branch chỉ quản lý diff; môi trường chạy code chưa duyệt phải có ranh giới quyền thực thi riêng. Chưa chọn công nghệ sandbox, nhưng phải chứng minh được các điều kiện sau trước khi mở năng lực:"
            - region "Bảng dữ liệu có thể cuộn ngang" [ref=f4e2611]:
              - table [ref=f4e2612]:
                - rowgroup [ref=f4e2613]:
                  - row [ref=f4e2614]:
                    - columnheader "Bề mặt" [ref=f4e2615]
                    - columnheader "Điều kiện cho coding/build/test chưa duyệt" [ref=f4e2616]
                - rowgroup [ref=f4e2617]:
                  - row [ref=f4e2618]:
                    - cell "Filesystem và tiến trình" [ref=f4e2619]
                    - cell "Chỉ checkout/working directory và thư mục tạm được cấp; không đọc home/secrets ngoài phạm vi, không dùng host socket hoặc quyền hệ thống để thoát cô lập" [ref=f4e2620]
                  - row [ref=f4e2621]:
                    - cell "Credential và dữ liệu" [ref=f4e2622]
                    - cell "Chỉ fixture tổng hợp và credential test có scope; không kế thừa token developer, thông tin đăng nhập cloud hoặc quyền database production" [ref=f4e2623]
                  - row [ref=f4e2624]:
                    - cell "Network" [ref=f4e2625]
                    - cell "Chỉ đích cần thiết đã được cấp; chặn đường tới production và đích gửi dữ liệu tùy ý; dependency retrieval phải nằm trong cơ chế được kiểm" [ref=f4e2626]
                  - row [ref=f4e2627]:
                    - cell "Build/test/migration" [ref=f4e2628]
                    - cell "Cùng ranh giới khi chạy script cài đặt dependency, test hoặc migration thử; tên lệnh “test” không làm code trở nên đáng tin" [ref=f4e2629]
                  - row [ref=f4e2630]:
                    - cell "Artifact và release" [ref=f4e2631]
                    - cell "Lưu diff, build artifact/digest và bằng chứng; tiến trình release riêng kiểm đúng bản được duyệt, không cấp release credential cho môi trường coding" [ref=f4e2632]
            - paragraph [ref=f4e2633]: Phép kiểm cô lập dùng canary secret/file và endpoint giả lập production, không dùng secrets hay production thật để thử. Kiểm cả việc bị chặn và build/test hợp lệ vẫn chạy. Cấu hình sandbox hoặc Git branch chưa đủ bằng chứng nếu chưa kiểm quyền thực tế của tiến trình. Đây là điều kiện thiết kế cho năng lực tùy chọn, không phải tuyên bố workspace hiện tại đã được cô lập.
            - paragraph [ref=f4e2634]: "Hồ sơ thay đổi backend đề xuất gồm: nguồn yêu cầu; contract trước/sau; các đường bị ảnh hưởng; diff code/config; dependency/version và nguồn chính thức; test; tác động dữ liệu; cách rollout và điều kiện phục hồi. Có thay UI thì bổ sung preview tương ứng. Chỉ artifact đã được kiểm và duyệt mới được phát hành; sửa thêm sau đó cần kiểm lại phần ảnh hưởng."
            - paragraph [ref=f4e2635]: Migration phải nói rõ dữ liệu nào đổi, khóa/ràng buộc nào thêm, khả năng chạy với bản ứng dụng cũ/mới và cách xử lý thất bại giữa chừng. Backup chỉ có giá trị phục hồi khi quy trình restore đã được kiểm trong môi trường thích hợp. Không tự hứa rollback được migration phá hủy dữ liệu. Chưa tạo CI/sandbox giả khi repository chưa chọn stack.
            - heading "8. Trải nghiệm khách hàng và admin" [level=3] [ref=f4e2636]
            - paragraph [ref=f4e2637]: AI Workspace là một cách điều khiển cùng nghiệp vụ mà màn hình thông thường cung cấp. Trong đề xuất này, canvas tạm chỉ render component đã kiểm; lưu thành trang chính thức cần preview/chấp nhận. Không ép mọi tác vụ phải đi qua chat.
            - region "Bảng dữ liệu có thể cuộn ngang" [ref=f4e2638]:
              - table [ref=f4e2639]:
                - rowgroup [ref=f4e2640]:
                  - row [ref=f4e2641]:
                    - columnheader "Khu vực" [ref=f4e2642]
                    - columnheader "Khách hàng/người được chia sẻ" [ref=f4e2643]
                    - columnheader "Admin/người vận hành được cấp quyền" [ref=f4e2644]
                - rowgroup [ref=f4e2645]:
                  - row [ref=f4e2646]:
                    - cell "Tổng quan" [ref=f4e2647]
                    - cell "Hồ sơ, thiết bị, số đo, cảnh báo thuộc phạm vi" [ref=f4e2648]
                    - cell "Sức khỏe hệ thống, lỗi thiết bị, tác vụ; dữ liệu sức khỏe chỉ khi có quyền riêng" [ref=f4e2649]
                  - row [ref=f4e2650]:
                    - cell "Nghiệp vụ" [ref=f4e2651]
                    - cell "Chi tiết/biểu mẫu/lịch sử thao tác được phép" [ref=f4e2652]
                    - cell "Quản lý người dùng, thiết bị, cấu hình theo quyền" [ref=f4e2653]
                  - row [ref=f4e2654]:
                    - cell "AI Workspace" [ref=f4e2655]
                    - cell "Hỏi và giao việc trong hồ sơ/thiết bị được phép" [ref=f4e2656]
                    - cell "Giao việc trên phạm vi quản trị được cấp; không dùng tài khoản toàn quyền mặc định" [ref=f4e2657]
                  - row [ref=f4e2658]:
                    - cell "Task Center" [ref=f4e2659]
                    - cell "Run của mình/được chia sẻ, bước đang chạy, chờ nhập/duyệt, dừng" [ref=f4e2660]
                    - cell "Theo dõi run vận hành, lỗi và quota; không mặc định đọc nội dung riêng" [ref=f4e2661]
                  - row [ref=f4e2662]:
                    - cell "Báo cáo và artifact" [ref=f4e2663]
                    - cell "Xem/tải kết quả sau kiểm quyền hiện tại" [ref=f4e2664]
                    - cell "Báo cáo vận hành hoặc nghiệp vụ theo quyền tương ứng" [ref=f4e2665]
                  - row [ref=f4e2666]:
                    - cell "Cấu hình/preview" [ref=f4e2667]
                    - cell "Trang cá nhân nếu được cho phép" [ref=f4e2668]
                    - cell "Draft, diff, preview và publish trong scope quản lý" [ref=f4e2669]
            - paragraph [ref=f4e2670]: Kết quả AI có thể gồm bảng, chart, form nháp, diff, task card và link artifact. Mỗi kết quả phân biệt “đề xuất”, “đang chạy”, “đã xác nhận hoàn tất” và “chưa xác định tác động”. Task Center vẫn đọc được khi model không khả dụng, vì tiến độ lấy từ execution store. Ẩn nút chỉ là trình bày; server chịu trách nhiệm từ chối truy cập trực tiếp.
            - heading "9. Hợp đồng HTTP và dữ liệu đề xuất" [level=3] [ref=f4e2671]
            - paragraph [ref=f4e2672]: Chương 04 hiện chỉ có inventory v0.1. Bảng này là phần bổ sung cần hòa vào một OpenAPI duy nhất sau khi chốt; không tạo một API nghiệp vụ thứ hai dành riêng cho chat. Quy ước lỗi và version phải thống nhất khi triển khai.
            - region "Bảng dữ liệu có thể cuộn ngang" [ref=f4e2673]:
              - table [ref=f4e2674]:
                - rowgroup [ref=f4e2675]:
                  - row [ref=f4e2676]:
                    - columnheader [ref=f4e2677]:
                      - text: Tài nguyên/endpoint minh họa dưới
                      - code [ref=f4e2678]: /api/v1
                    - columnheader "Hành vi dự kiến" [ref=f4e2679]
                - rowgroup [ref=f4e2680]:
                  - row [ref=f4e2681]:
                    - cell [ref=f4e2682]:
                      - code [ref=f4e2683]: POST /agent-runs
                    - cell "Nhận request key có trước lần gửi đầu; ghi ánh xạ key/input → run/operation cùng transaction; retry trả cùng run; nhận việc không có nghĩa đã hoàn thành" [ref=f4e2684]
                  - row [ref=f4e2685]:
                    - cell [ref=f4e2686]:
                      - code [ref=f4e2687]: "GET /agent-runs/{id}"
                    - cell "Đọc trạng thái, plan version, step/result refs sau kiểm quyền" [ref=f4e2688]
                  - row [ref=f4e2689]:
                    - cell [ref=f4e2690]:
                      - code [ref=f4e2691]: "POST /agent-runs/{id}/cancellation-requests"
                    - cell "Ghi yêu cầu dừng idempotent; trả trạng thái hiện tại và tác động còn đang xử lý" [ref=f4e2692]
                  - row [ref=f4e2693]:
                    - cell [ref=f4e2694]:
                      - code [ref=f4e2695]: "POST /action-plans/{id}/approvals"
                    - cell "Kiểm người duyệt, digest/target set/version/thời hạn; không nhận approval tự khai từ model" [ref=f4e2696]
                  - row [ref=f4e2697]:
                    - cell [ref=f4e2698]:
                      - code [ref=f4e2699]: "POST /workspace-views/{id}/drafts"
                    - cell "Tạo bản nháp từ phiên bản nền" [ref=f4e2700]
                  - row [ref=f4e2701]:
                    - cell [ref=f4e2702]:
                      - code [ref=f4e2703]: "POST /workspace-views/{id}/previews"
                    - cell "Tạo preview cho đúng draft revision, không publish" [ref=f4e2704]
                  - row [ref=f4e2705]:
                    - cell [ref=f4e2706]:
                      - code [ref=f4e2707]: "POST /workspace-views/{id}/publications"
                    - cell "Kích hoạt đúng bản đã duyệt nếu phiên bản nền còn phù hợp" [ref=f4e2708]
                  - row [ref=f4e2709]:
                    - cell [ref=f4e2710]:
                      - code [ref=f4e2711]: "GET /artifacts/{id}"
                    - cell "Kiểm lại quyền của người tải và scope dữ liệu; không trả file chỉ vì biết URL" [ref=f4e2712]
            - paragraph [ref=f4e2713]:
              - text: Đề xuất
              - code [ref=f4e2714]: If-Match
              - text: "/strong ETag cho cập nhật có precondition: precondition sai trả"
              - code [ref=f4e2715]: 412 Precondition Failed
              - text: ; xung đột nghiệp vụ khác có thể dùng
              - code [ref=f4e2716]: 409 Conflict
              - text: . Đây là phân biệt HTTP theo RFC 9110, không dùng
              - code [ref=f4e2717]: "409"
              - text: thay mọi lỗi
              - code [ref=f4e2718]: If-Match
              - text: . Endpoint ghi phải khai báo rõ dùng ETag của tài nguyên nào; với collection publication và phiên bản nền của view, có thể dùng precondition trong body cùng kiểm atomic của service, không gắn nhầm ETag của view lên collection. Chưa chốt hình thức cuối cùng trước khi có contract.
            - paragraph [ref=f4e2719]:
              - text: Mã lỗi nghiệp vụ cần ổn định như
              - code [ref=f4e2720]: TARGET_AMBIGUOUS
              - text: ","
              - code [ref=f4e2721]: APPROVAL_STALE
              - text: ","
              - code [ref=f4e2722]: CAPABILITY_DISABLED
              - text: ","
              - code [ref=f4e2723]: EFFECT_UNKNOWN
              - text: ; đây là tên đề xuất. Thông báo người dùng không chứa stack trace hoặc dữ liệu tài nguyên ngoài quyền. Retry client không tự biến một
              - code [ref=f4e2724]: POST
              - text: thành idempotent; contract phải ghi quy tắc operation key và thời hạn hỗ trợ.
            - heading "10. Dữ liệu của model, audit và giải thích" [level=3] [ref=f4e2725]
            - paragraph [ref=f4e2726]: Nội dung file, ghi chú người dùng, kết quả tìm kiếm và tool result là dữ liệu có thể chứa chỉ dẫn giả. Đề xuất hệ thống tách nguồn, giới hạn context và kiểm lại tool arguments ở executor; không lấy “bỏ qua quyền” trong ghi chú làm lệnh có thẩm quyền. Model output cũng phải qua validator/renderer; không chèn HTML hoặc mã model sinh trực tiếp vào ứng dụng. Nguyên tắc và giới hạn chống prompt injection được đối chiếu OWASP, không hứa loại bỏ hoàn toàn tấn công bằng một prompt.
            - paragraph [ref=f4e2727]: Mỗi phân tích/báo cáo lưu nguồn dữ liệu, khoảng thời gian, timezone, version cách tính và cờ thiếu dữ liệu. Metric được tính bởi service/query đã định nghĩa; model diễn giải và dẫn nguồn, không tự bịa số. Coverage/aggregate telemetry còn vướng review v0.1 thì ghi giới hạn, không đặt một công thức mới rồi coi số đo đã hợp lệ.
            - paragraph [ref=f4e2728]: Audit ghi ai yêu cầu, ai thực thi/duyệt, capability/version, đối tượng, thời gian, kết quả, correlation và mã lỗi. Không mặc định lưu toàn bộ prompt, output tool, payload sức khỏe hoặc secrets vào log chung. Dữ liệu cần phục vụ điều tra được lưu riêng theo quyền và retention phải chốt; log lỗi của provider cũng phải được lọc.
            - paragraph [ref=f4e2729]: Hội thoại, memory, cache, search index và artifact cần owner/scope/provenance; một context đã được tải không mặc định có quyền tái sử dụng vĩnh viễn. Khi quyền nguồn bị thu hồi, không đưa dữ liệu đã cache vào model hoặc hiển thị lại từ lịch sử cho người không còn quyền. Với artifact chứa nhiều nguồn, đề xuất chặn toàn artifact khi không còn đủ quyền, rồi tái tạo bản được phép; tránh chỉ xóa một dòng trong bảng nhưng để nguyên phần tổng hợp tiết lộ dữ liệu đó. Cách retention/xóa vật lý còn cần chốt.
            - paragraph [ref=f4e2730]: Giải thích hành động dựa trên plan công khai, policy decision, nguồn, diff và tool result thực tế. Không cần lưu hoặc phơi bày suy luận nội bộ của model; không dùng đoạn giải thích tự sinh làm bằng chứng tác động đã xảy ra. URL tải dùng kiểm quyền ở lúc truy cập nếu cần thu hồi tức thời; file đã tải xuống thiết bị của người nhận không thể được đảm bảo thu hồi.
            - heading "11. Kịch bản bảo vệ đồ án có thể tái lập" [level=3] [ref=f4e2731]
            - paragraph [ref=f4e2732]: "Đề xuất trình diễn một câu chuyện xuyên suốt: theo dõi thiết bị → phát hiện tình trạng kỹ thuật bằng policy → AI tổ chức công việc → chạy tự động → đổi cấu hình có preview → gây lỗi và kiểm phục hồi. Không gắn điều kiện “đạt điểm cao” khi chưa có rubric của trường."
