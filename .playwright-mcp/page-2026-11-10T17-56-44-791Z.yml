            - paragraph [ref=f4e2088]: Một nguồn chính cho mỗi loại thông tin. Code/schema/manifest là nguồn chi tiết kỹ thuật có thể kiểm; tài liệu giải thích nghiệp vụ và lý do. Khi hai bên mâu thuẫn, đối chiếu yêu cầu và test trước khi sửa, không mặc định bên nào cũng đúng. Obsidian giữ quyết định, tiến độ và liên kết, không thành bản sao đặc tả thứ hai.
            - heading "Đọc tài liệu chính thức và dùng đúng phiên bản" [level=3] [ref=f4e2089]
            - list [ref=f4e2090]:
              - listitem [ref=f4e2091]: Xác định ngôn ngữ, runtime/SDK, framework, package, version và công cụ build/test từ repository và môi trường thực. Editor không quyết định framework; ví dụ dùng C# trong một editor không xác định phiên bản .NET hay framework web.
              - listitem [ref=f4e2092]: Đọc tài liệu chính thức/API reference đúng chức năng và phiên bản; khi nâng phiên bản đọc migration guide và release notes liên quan. Không cần đọc toàn bộ tài liệu framework cho một sửa đổi nhỏ.
              - listitem [ref=f4e2093]: Kiểm API/package thực sự tồn tại và cách sử dụng; không tự sáng tác tên method rồi xem như API thư viện.
              - listitem [ref=f4e2094]: Ghi nguồn, phiên bản, luận điểm dùng và giới hạn vào tài liệu quyết định phù hợp. Blog/câu trả lời AI hỗ trợ tìm hướng, không thay xác minh API.
              - listitem [ref=f4e2095]: Kiểm hành vi trong môi trường dự án. “Có tiêu chuẩn”, “thư viện hỗ trợ” và “đã chạy đúng trong đồ án” là ba mức bằng chứng khác nhau.
            - paragraph [ref=f4e2096]: Nếu công cụ tra cứu không dùng được, truy cập nguồn chính thức khác hoặc tài liệu đúng version có sẵn. Ghi rõ phần chưa đọc được, không báo đã xác minh hoặc tự nâng dependency để né vấn đề.
            - heading "Tái sử dụng trước khi viết mới" [level=3] [ref=f4e2097]
            - paragraph [ref=f4e2098]: Khảo sát source hiện có, manifest/lockfile, API và component nội bộ liên quan; đối chiếu chức năng chuẩn của ngôn ngữ/framework. Ưu tiên implementation đúng nghiệp vụ đã tồn tại. Nếu chưa có, đánh giá thư viện được duy trì phù hợp; tự viết phần nhỏ đặc thù khi lựa chọn đó có lý do rõ ràng.
            - paragraph [ref=f4e2099]: Thư viện “đã cài trên máy” chưa chắc là dependency của dự án hoặc tái lập được trên CI. Khi dùng phải khai báo ở đúng manifest/lockfile. Cân nhắc compatibility, license, bảo trì, lỗ hổng liên quan, kích thước và chi phí vận hành; không thêm dependency chỉ để tránh viết vài dòng đơn giản.
            - paragraph [ref=f4e2100]: Không ép các nghiệp vụ khác nhau dùng chung một abstraction vì tên hàm giống nhau. Shared Core chứa cơ chế chung có trách nhiệm rõ; luật đặc thù thuộc module sở hữu. Frontend và AI không tự viết lại nghiệp vụ đã có ở Business Service.
            - heading "Tra cứu năng lực và phạm vi ảnh hưởng" [level=3] [ref=f4e2101]
            - paragraph [ref=f4e2102]:
              - text: "Đề xuất khi bắt đầu có source: mỗi capability có tên, mục đích, nơi triển khai chính thức, contract, quyền, module dùng, test/tài liệu liên quan và trạng thái"
              - code [ref=f4e2103]: planned
              - text: /
              - code [ref=f4e2104]: active
              - text: /
              - code [ref=f4e2105]: deprecated
              - text: . Phần có thể suy ra từ source/manifest nên sinh hoặc kiểm tự động; không duy trì danh sách endpoint/package thủ công thứ hai.
            - paragraph [ref=f4e2106]:
              - text: Hiện tại repository chỉ có công cụ sinh tài liệu, payload minh họa và README module. Chưa có runtime tool registry, API contract triển khai hoặc Business Service để đăng ký là
              - code [ref=f4e2107]: active
              - text: . Dùng README/mục lục hiện tại; không tạo index giả chứa các đường dẫn code chưa tồn tại.
            - paragraph [ref=f4e2108]: "Với thay đổi xuyên module, thực hiện:"
            - list [ref=f4e2109]:
              - listitem [ref=f4e2110]:
                - strong [ref=f4e2111]: "Discovery:"
                - text: tìm định nghĩa, call sites, truy vấn, quyền, event/job, báo cáo/export, frontend, AI tools và test liên quan. Bắt đầu bằng tìm text/file, bổ sung symbol/reference/dependency search nếu cần.
              - listitem [ref=f4e2112]:
                - strong [ref=f4e2113]: "Impact map:"
                - text: ghi đường đi dữ liệu, module ảnh hưởng, thay đổi cần làm, nơi không cần đổi và bằng chứng cho kết luận đó. Không suy phạm vi chỉ từ trang người dùng nhắc đến.
              - listitem [ref=f4e2114]:
                - strong [ref=f4e2115]: "Thực hiện:"
                - text: sửa nguồn quy tắc chính và mọi điểm chịu ảnh hưởng trong phạm vi đã giao; xét migration/backward compatibility. Không tiện tay refactor phần độc lập.
              - listitem [ref=f4e2116]:
                - strong [ref=f4e2117]: "Xác minh:"
                - text: kiểm hành vi ở các điểm đã liệt kê, tìm implementation cũ còn sót, đối chiếu contract và cập nhật docs. Search không thấy chuỗi cũ chưa đủ chứng minh hành vi đúng.
            - paragraph [ref=f4e2118]: "Mẫu ghi ngắn, dùng khi đã có thay đổi thực tế:"
