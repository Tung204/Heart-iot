            - paragraph [ref=f4e2442]:
              - text: Run có nhánh độc lập được phép tiếp tục khi một nhánh chờ; trạng thái từng step là nguồn chi tiết, UI hiển thị nhánh chờ thay vì giả mọi thứ đang chạy.
              - code [ref=f4e2443]: waiting_input
              - text: /
              - code [ref=f4e2444]: waiting_approval
              - text: ở cấp run áp dụng khi không còn bước độc lập có thể chạy. Scheduler đánh thức theo sự kiện hoặc thời điểm, không vòng lặp gọi model liên tục.
            - paragraph [ref=f4e2445]:
              - text: Step đề xuất có
