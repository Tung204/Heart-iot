            - paragraph [ref=f4e2013]: Đo tỷ lệ hoàn thành nhiệm vụ, số lần cần người can thiệp, bước/thời gian thủ công so với AI, độ trễ, chi phí, lỗi quyền và tác động lặp. Xác định bộ tình huống trước khi đo, dùng trường hợp chưa có trong prompt demo; không đặt con số thành tích hoặc hứa điểm số khi chưa có dữ liệu/rubric.
            - heading "Những quyết định còn cần chốt" [level=3] [ref=f4e2014]
            - list [ref=f4e2015]:
              - listitem [ref=f4e2016]: Phê chuẩn ranh giới AI runtime/coding ở trên; có đưa sinh code module vào đồ án hay chỉ mở rộng bằng cấu hình.
              - listitem [ref=f4e2017]: Ý nghĩa workspace/tenant, đối tượng người dùng và ma trận quyền thực tế; ai duyệt giao diện dùng chung.
              - listitem [ref=f4e2018]: Phạm vi tự chạy, loại hành động phải duyệt, khả năng hoàn tác và giới hạn chi phí.
              - listitem [ref=f4e2019]: Rubric, nhóm, thời hạn, phần cứng và ngân sách; từ đó chốt mức nền tảng và stack cụ thể.
