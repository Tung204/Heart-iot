        - generic [ref=f4e3386]:
          - generic [ref=f4e3387]: Đồ án sức khỏe IoT · Tài liệu thiết kế
          - link "Về đầu tài liệu ↑" [ref=f4e3388] [cursor=pointer]:
            - /url: "#mo-dau"
          - paragraph [ref=f4e3389]:
            - text: "Bản HTML được sinh từ Markdown và payload mẫu. Mở được ngoại tuyến; tìm kiếm diễn ra trên máy. Hướng dẫn cập nhật:"
            - link "tools/docs" [ref=f4e3390] [cursor=pointer]:
              - /url: ../../tools/docs/README.md
            - text: .