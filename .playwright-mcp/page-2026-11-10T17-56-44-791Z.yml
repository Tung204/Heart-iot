              - text: ; không coi một file hướng dẫn là hệ thống cưỡng chế đã hoạt động.
            - heading "Tài liệu là một phần của thay đổi" [level=3] [ref=f4e2042]
            - paragraph [ref=f4e2043]: "Trước khi thay đổi, đọc nguồn liên quan và phân biệt: yêu cầu đã xác nhận, đề xuất đang xét, giả định tạm, kết quả có bằng chứng. Thiếu thông tin ảnh hưởng hành vi thì xác minh hoặc hỏi; không tự đặt dữ liệu/luật nghiệp vụ để hoàn tất cho nhanh. Quyết định triển khai thường lệ trong phạm vi đã giao có thể tự xử lý và ghi rõ lý do, không yêu cầu người dùng duyệt lại từng bước."
            - paragraph [ref=f4e2044]: "Mỗi thay đổi đáng kể cần trả lời được: vấn đề gì, hành vi mong muốn, phạm vi ảnh hưởng, nguồn kỹ thuật, cách kiểm và phần còn chưa biết. Không tạo một file riêng cho mỗi hàm hoặc chép nguyên log/hội thoại vào tài liệu."
