            - paragraph [ref=f4e3032]: Mức P1/P2 chỉ mức cần xử lý trước khi triển khai năng lực tương ứng. Không mô tả đây là lỗ hổng đã được tái hiện trên một sản phẩm đang chạy. Vị trí dòng bên dưới thuộc bản được review lần đầu; sau bổ sung, số dòng có thể thay đổi. Dùng liên kết tới chương và tên mục để đọc bản hiện tại.
            - 'heading "AI-R01 — P1: branch không cô lập việc chạy code chưa duyệt" [level=3] [ref=f4e3033]'
            - paragraph [ref=f4e3034]:
              - strong [ref=f4e3035]: "Vị trí lúc phát hiện:"
              - code [ref=f4e3036]: docs/11-nen-tang-ai-va-cau-hinh-dong.md:54
              - text: ", đối chiếu dòng 49/52 và"
              - code [ref=f4e3037]: docs/13-dac-ta-thuc-thi-ai-va-cau-hinh.md:160
              - text: ", 163, 167."
            - paragraph [ref=f4e3038]:
              - strong [ref=f4e3039]: "Tình huống:"
              - text: Coding Agent tạo code trong một branch rồi chạy build/test trước review. Máy chạy vẫn có credential developer hoặc đường ghi production. Script test, cài dependency hoặc migration có thể đọc secrets, gửi dữ liệu hoặc thay production ngay trước bước phát hành. Tách credential của AI runtime không bảo vệ tiến trình build/test này.
            - paragraph [ref=f4e3040]:
              - strong [ref=f4e3041]: "Bổ sung đặc tả:"
              - link "chương 11 — AI có nên sửa backend" [ref=f4e3042] [cursor=pointer]:
                - /url: "#nen-tang-ai"
              - text: tách branch quản lý diff khỏi môi trường thực thi.
              - link "Chương 13, mục 7" [ref=f4e3043] [cursor=pointer]:
                - /url: "#thuc-thi-ai"
              - text: đặt điều kiện filesystem/process, credential, database và network; đường release có quyền riêng và chỉ phát hành artifact đã duyệt. Áp dụng nếu chọn Coding Agent trong sản phẩm; không tự đưa sandbox vào phạm vi đã cam kết.
            - paragraph [ref=f4e3044]:
              - strong [ref=f4e3045]: "Cách kiểm khi có triển khai:"
              - text: AI-17 dùng canary file/secret ngoài scope và endpoint giả lập production. Code chưa duyệt phải bị chặn truy cập trong khi build/test bằng fixture tổng hợp vẫn chạy. Lưu cấu hình và quyền thực tế của tiến trình, không lấy tên branch làm bằng chứng cô lập.
            - paragraph [ref=f4e3046]:
              - strong [ref=f4e3047]: "Trạng thái:"
              - text: đã bổ sung điều kiện thiết kế; chưa chọn cơ chế sandbox và chưa chạy kiểm cô lập.
            - 'heading "AI-R02 — P2: retry request đầu có thể tạo hai run" [level=3] [ref=f4e3048]'
            - paragraph [ref=f4e3049]:
              - strong [ref=f4e3050]: "Vị trí lúc phát hiện:"
              - code [ref=f4e3051]: docs/13-dac-ta-thuc-thi-ai-va-cau-hinh.md:105
              - text: ", 190, 201; đối chiếu AI-05 ở dòng 242."
            - paragraph [ref=f4e3052]:
              - strong [ref=f4e3053]: "Tình huống:"
              - code [ref=f4e3054]: POST /agent-runs
              - text: đã commit nhưng response mất; client chưa có run/operation ID do server cấp. Retry bị coi là yêu cầu mới, tạo hai run; mỗi run chống trùng operation đúng nhưng cả hai cùng thực hiện nhiệm vụ. Dedup bên trong run chưa chặn trùng ở cửa nhận việc.
            - paragraph [ref=f4e3055]:
              - strong [ref=f4e3056]: "Bổ sung đặc tả:"
              - link "chương 13, mục 5 và 9" [ref=f4e3057] [cursor=pointer]:
                - /url: "#thuc-thi-ai"
              - text: yêu cầu
              - code [ref=f4e3058]: request_key
              - text: có trước lần gửi đầu; server xác định scope, kiểm fingerprint và ghi ánh xạ key → run/operation cùng transaction. Retry cùng ý định trả cùng run sau kiểm quyền; cùng key khác input bị conflict. Scheduler/event handler có khóa occurrence/trigger/generation ổn định. Không tự đổi key vì timeout.
            - paragraph [ref=f4e3059]:
              - strong [ref=f4e3060]: "Cách kiểm khi có triển khai:"
              - text: AI-05 làm mất response sau commit tạo run, retry cùng request và cho hai request đến đồng thời; xác nhận đúng một run và một chuỗi tác động. Kiểm key trùng khác payload bị từ chối, yêu cầu độc lập có key khác được phân biệt. Sau đó mới kiểm dedup từng bước và hai worker cùng operation.
            - paragraph [ref=f4e3061]:
              - strong [ref=f4e3062]: "Trạng thái:"
              - text: đã bổ sung invariant nhận việc; vị trí truyền request key, schema lưu và thời hạn retry còn cần chốt cùng API/database. Chưa chạy test.
            - 'heading "AI-R03 — P2: workflow có thể tạo chuỗi run không giới hạn" [level=3] [ref=f4e3063]'
            - paragraph [ref=f4e3064]:
              - strong [ref=f4e3065]: "Vị trí lúc phát hiện:"
              - code [ref=f4e3066]: docs/13-dac-ta-thuc-thi-ai-va-cau-hinh.md:118
              - text: ", 151; đối chiếu dòng 33 và AI-15 ở dòng 252."
            - paragraph [ref=f4e3067]:
              - strong [ref=f4e3068]: "Tình huống:"
              - text: trigger “công việc được tạo” gọi action tạo công việc, hoặc hai workflow kích hoạt lẫn nhau. Mỗi run chỉ vài bước; ID event và operation mới nên per-run budget, dedup và giới hạn vòng lặp nội bộ đều không ngăn chuỗi run tăng liên tục.
            - paragraph [ref=f4e3069]:
              - strong [ref=f4e3070]: "Bổ sung đặc tả:"
              - link "chương 13, mục 5" [ref=f4e3071] [cursor=pointer]:
                - /url: "#thuc-thi-ai"
              - text: giữ root/parent/causation từ server; đề xuất chặn self-trigger/re-entry mặc định và kiểm chu kỳ có thể xác định khi publish. Quota delegation/root execution được kế thừa, reserve atomically qua các run; quota workspace bổ sung giới hạn khi mất correlation hoặc có nhiều nguồn độc lập. Run con không tự reset ngân sách. Tác động chưa xác định không được hoàn quota như chắc chắn chưa thực hiện.
            - paragraph [ref=f4e3072]:
              - strong [ref=f4e3073]: "Cách kiểm khi có triển khai:"
              - text: AI-15 có self-trigger, A/B kích hoạt qua lại, giao event lặp và worker đồng thời. Chuỗi phải bị chặn theo policy; audit truy về gốc, số run/tác động không tăng ngoài quota. Kiểm đường cảnh báo IoT vẫn chạy độc lập với ngân sách model.
            - paragraph [ref=f4e3074]:
              - strong [ref=f4e3075]: "Trạng thái:"
              - text: đã bổ sung phạm vi kiểm xuyên run; hạn mức, cửa sổ thời gian và chính sách re-entry còn là quyết định mở. Chưa có runtime test.
            - 'heading "AI-R04 — P2: callback lịch cũ có thể chạy sau publication mới" [level=3] [ref=f4e3076]'
            - paragraph [ref=f4e3077]:
              - strong [ref=f4e3078]: "Vị trí lúc phát hiện:"
              - code [ref=f4e3079]: docs/13-dac-ta-thuc-thi-ai-va-cau-hinh.md:132
              - text: ", 145; đối chiếu dòng 95/118 và AI-11 ở dòng 248."
            - paragraph [ref=f4e3080]:
              - strong [ref=f4e3081]: "Tình huống:"
              - text: v2 đã bỏ lịch nhưng callback v1 đang trong queue đến muộn và chưa có run. Quyền người giao việc vẫn hợp lệ; v1 vẫn chạy được. Pin version cho run đang chạy không bao phủ callback chưa tạo run, nên lịch đã bỏ vẫn phát sinh tác động mới.
            - paragraph [ref=f4e3082]:
              - strong [ref=f4e3083]: "Bổ sung đặc tả:"
              - link "chương 13, mục 6" [ref=f4e3084] [cursor=pointer]:
                - /url: "#thuc-thi-ai"
              - text: định nghĩa activation generation, mốc hiệu lực và occurrence ID. Khi tạo run phải kiểm generation atomically với nguồn publication và dedup occurrence. Callback stale bị chặn; event publication đến đảo thứ tự không làm lùi active generation. Phân biệt callback, run chưa dispatch và run đã dispatch; lần dispatch đầu cũng kiểm generation/fencing. Rollback nội dung tạo generation mới.
            - paragraph [ref=f4e3085]:
              - strong [ref=f4e3086]: "Cách kiểm khi có triển khai:"
              - text: AI-11 cho callback v1 đến sau v2 bỏ trigger, đảo event publication, restart scheduler và chạy race giữa publish/dispatch đầu. Không tạo run từ activation hết hiệu lực; run cũ giữ/dừng theo policy đã được công bố, không chuyển ngầm version.
            - paragraph [ref=f4e3087]:
              - strong [ref=f4e3088]: "Trạng thái:"
              - text: đã bổ sung policy baseline hủy run cũ chưa dispatch và cho run đã dispatch kết thúc/đối soát trong quyền còn hiệu lực. Policy vẫn là đề xuất; cơ chế atomic/fencing phụ thuộc stack, chưa được kiểm.
            - heading "Những điểm đã có trước khi trả findings" [level=3] [ref=f4e3089]
            - paragraph [ref=f4e3090]:
              - text: "Reviewer đã đối chiếu chương 13 và không tiếp tục liệt kê các điểm sau thành khoảng trống mở: tách principal/delegation/approver; kiểm quyền trước đọc/gửi model/ghi/giao kết quả; approval gắn target/digest/version;"
              - code [ref=f4e3091]: unknown
              - text: và đối soát; worker lease, cancel và pin version; preview chặn tác động thật; CAS publication; dependency làm preview stale; provenance và quyền hiện tại của memory/cache/artifact.
            - paragraph [ref=f4e3092]: Các nội dung đó mới được làm rõ trên giấy. Chúng cần contract và bằng chứng kiểm tương ứng sau khi chọn stack; việc reviewer không phát hiện vấn đề không chứng minh an toàn hoặc hoàn chỉnh tuyệt đối.
            - heading "Kết quả đối chiếu bản sửa" [level=3] [ref=f4e3093]
            - paragraph [ref=f4e3094]: "Codex đối chiếu chương 11/13 và ma trận kiểm, xác nhận các cặp: AI-R01 → AI-17 (cô lập thực thi), AI-R02 → AI-05 (chống trùng lúc nhận yêu cầu), AI-R03 → AI-15 (lineage và hạn mức xuyên run), AI-R04 → AI-11 (activation generation và cutover lịch)."
            - paragraph [ref=f4e3095]:
              - text: "Reviewer cũng đối chiếu vòng đời liên quan:"
              - code [ref=f4e3096]: suspended
              - text: chặn dispatch mới; nhánh độc lập vẫn có thể tiếp tục khi một step chờ; hết hạn đối soát giữ step
              - code [ref=f4e3097]: unknown
              - text: và lịch sử; version bị vô hiệu hóa không được âm thầm thay thế. Không phát hiện mâu thuẫn P1/P2 mới giữa các quy tắc này và policy cho run chưa/đã dispatch.
            - paragraph [ref=f4e3098]: "Phần hiện thực hóa còn phụ thuộc stack/policy được chốt: transaction/constraint/fencing, thời hạn request key, giá trị và cách lưu quota, timezone/backlog của lịch, môi trường cô lập. Đây là công việc triển khai còn lại, không phải kết quả đã kiểm và cũng không phải findings mới của lượt đối chiếu."
            - heading "Phạm vi kiểm chứng và phần còn mở" [level=3] [ref=f4e3099]
            - list [ref=f4e3100]:
              - listitem [ref=f4e3101]: Reviewer thực hiện đọc/tìm kiếm đối chiếu tài liệu; không chạy ứng dụng, firmware, thiết bị hoặc test runtime.
              - listitem [ref=f4e3102]: Agent chính bổ sung chương 13, mẫu hồ sơ bằng chứng ở chương 12 và đồng bộ mục lục/nguồn/HTML; kết quả kiểm tài liệu được ghi sau khi thực hiện.
              - listitem [ref=f4e3103]: Không khóa framework, tenant, hạn mức, hành động tự chủ hoặc Coding Agent chỉ để đóng findings. Đây vẫn là phương án cần chốt.
              - listitem [ref=f4e3104]:
                - text: Bốn findings IoT trong
                - link "review v0.1" [ref=f4e3105] [cursor=pointer]:
                  - /url: "#review"
                - text: vẫn mở; review này không thay thế hoặc đóng chúng.
            - paragraph [ref=f4e3106]:
