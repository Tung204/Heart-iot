            - paragraph [ref=f4e1505]:
              - text: Khi có code, cấu hình local sẽ được đặt trong
              - code [ref=f4e1506]: infra
              - text: ; secret ở môi trường thực thi, file mẫu chỉ chứa tên biến và giá trị vô hại. Chốt runtime/package manager/version trước khi thêm manifest và lockfile. Nêu rõ cổng, TLS, broker ACL, migration và rollback trong hướng dẫn triển khai thực tế.
            - paragraph [ref=f4e1507]: "Quan sát tối thiểu: last_seen thiết bị, số bản tin nhận/từ chối/trùng, sự kiện cách ly, tuổi notification outbox, số lần gửi lỗi, độ trễ xử lý, lỗi AI. Log dùng ID tham chiếu, không dump toàn bộ dữ liệu sức khỏe hoặc secret."
            - paragraph [ref=f4e1508]: "Trước dữ liệu thật: thử backup/restore, thu hồi quyền và credential, migration với backup, giới hạn retention/xóa, khôi phục worker và hành vi khi DB/broker lỗi. Bản backup phải được bảo vệ và có vòng đời; không đặt cạnh code để đồng bộ công khai."
            - heading "Hồ sơ học thuật đề xuất" [level=3] [ref=f4e1509]
            - paragraph [ref=f4e1510]: "Chưa có yêu cầu chính thức của trường. Cấu trúc tham khảo có thể gồm:"
            - list [ref=f4e1511]:
              - listitem [ref=f4e1512]: Bối cảnh, mục tiêu, phạm vi và phương pháp thực hiện.
              - listitem [ref=f4e1513]: Cơ sở lý thuyết, nghiên cứu/sản phẩm liên quan và nguồn có quyền sử dụng.
              - listitem [ref=f4e1514]: Phân tích yêu cầu, use case, phân quyền và thiết kế hệ thống.
              - listitem [ref=f4e1515]: Thiết kế phần cứng, firmware, phần mềm và hợp đồng dữ liệu.
              - listitem [ref=f4e1516]: Cách tích hợp AI, nguồn dữ liệu và đánh giá đầu ra.
              - listitem [ref=f4e1517]: Thử nghiệm, số liệu thực đo, phân tích lỗi và giới hạn.
              - listitem [ref=f4e1518]: Kết luận, khả năng phát triển và hướng dẫn vận hành/bàn giao.
            - paragraph [ref=f4e1519]: Phụ lục có thể gồm BOM, sơ đồ mạch, API/schema, bộ kịch bản, hướng dẫn cài đặt và demo. Không tạo tài liệu Word/PDF theo một mẫu trường chưa biết; soạn Markdown kỹ thuật trước, sau đó xuất theo biểu mẫu được cung cấp.
            - heading "Các yếu tố dễ làm thay đổi phạm vi" [level=3] [ref=f4e1520]
            - region "Bảng dữ liệu có thể cuộn ngang" [ref=f4e1521]:
              - table [ref=f4e1522]:
                - rowgroup [ref=f4e1523]:
                  - row [ref=f4e1524]:
                    - columnheader "Yếu tố" [ref=f4e1525]
                    - columnheader "Tác động" [ref=f4e1526]
                    - columnheader "Hướng xử lý đề xuất" [ref=f4e1527]
                - rowgroup [ref=f4e1528]:
                  - row [ref=f4e1529]:
                    - cell "Không đủ thời gian hoặc linh kiện" [ref=f4e1530]
                    - cell "Không thể chứng minh đủ phần cứng/AI" [ref=f4e1531]
                    - cell "Giữ lát cắt cảnh báo và phép đo tối thiểu; ghi rõ mô phỏng và phần chưa kiểm" [ref=f4e1532]
