          - generic [ref=f4e2937]:
            - paragraph [ref=f4e2938]:
              - strong [ref=f4e2939]: "Ngày review:"
              - text: 10/11/2026 — Codex.
              - strong [ref=f4e2940]: "Trạng thái:"
              - text: đã review tĩnh; các phát hiện bên dưới chưa được sửa trong đặc tả.
            - paragraph [ref=f4e2941]: "Phạm vi: README, tài liệu thiết kế, ADR, trách nhiệm các thư mục và ba payload mẫu. Dự án chưa có ứng dụng, firmware hoặc simulator chạy được. Các phát hiện là thiếu sót/mâu thuẫn của thiết kế, không phải lỗi runtime đã tái hiện. P1 cần giải quyết trước khi triển khai luồng liên quan; P2 cần làm rõ để các thành phần thực hiện thống nhất. Mức độ này thuộc báo cáo review, không thay thứ tự P0/P1 của phạm vi sản phẩm hoặc kế hoạch gốc."
            - 'heading "R-01 — P1: Thông báo chờ gửi chưa bị vô hiệu hóa khi incident đã đóng" [level=3] [ref=f4e2942]'
            - paragraph [ref=f4e2943]:
              - strong [ref=f4e2944]: "Vị trí:"
              - link "kiến trúc" [ref=f4e2945] [cursor=pointer]:
                - /url: "#kien-truc"
              - text: ", dòng 56 và 63;"
              - link "mô hình outbox" [ref=f4e2946] [cursor=pointer]:
                - /url: "#du-lieu"
              - text: ", dòng 18."
            - paragraph [ref=f4e2947]:
              - text: Đặc tả yêu cầu
              - code [ref=f4e2948]: user.cancel_requested
              - text: đóng incident và gửi cập nhật cho người đã nhận. Worker vẫn retry tác vụ outbox; quy tắc gửi chỉ nêu chống trùng và kiểm quyền, chưa kiểm trạng thái/version hiện tại của incident hoặc hủy tác vụ cũ.
            - paragraph [ref=f4e2949]:
              - text: "Tình huống:"
              - code [ref=f4e2950]: confirmed
              - text: được commit cùng thông báo đang chờ → worker chưa gửi hoặc đang backoff → người dùng hủy và incident đóng → worker tiếp tục gửi cảnh báo mở. Nếu chưa có người nhận tại lúc hủy, nhánh “cập nhật cho những người đã nhận” không tạo thông báo đính chính cho họ. Unique key không giải quyết tác vụ hợp lệ nhưng đã lỗi thời. Reconnect tải snapshot cũng chưa bảo vệ người đang xem một stream liên tục.
            - paragraph [ref=f4e2951]:
              - strong [ref=f4e2952]: "Hướng sửa đề xuất:"
              - text: đặc tả việc đánh dấu tác vụ chưa gửi là
              - code [ref=f4e2953]: superseded
              - text: khi đóng incident, kiểm version/trạng thái trước dispatch và quy tắc cho tác vụ đang gửi dở. Sự kiện gửi tới client cần version nghiệp vụ tăng đơn điệu; client không áp dụng trạng thái cũ. Nếu thông báo cũ đã ra ngoài thì bảo đảm người thực tế nhận được cũng nhận cập nhật kết thúc. Phân biệt version nghiệp vụ server với
              - code [ref=f4e2954]: event_revision
              - text: của firmware nếu cả hai đều thay đổi trạng thái.
            - paragraph [ref=f4e2955]:
              - strong [ref=f4e2956]: "Kiểm chứng cần bổ sung khi triển khai:"
              - text: mở rồi hủy trước dispatch; hủy trong lúc dispatch; worker restart sau hủy. T-07 kiểm khôi phục worker và T-10 kiểm hủy sau gửi hiện chưa mô tả đủ các trường hợp này.
            - 'heading "R-02 — P1: Khóa incident chưa có phạm vi định danh và kiểm quyền thiết bị rõ ràng" [level=3] [ref=f4e2957]'
            - paragraph [ref=f4e2958]:
              - strong [ref=f4e2959]: "Vị trí:"
              - link "mô hình dữ liệu" [ref=f4e2960] [cursor=pointer]:
                - /url: "#du-lieu"
              - text: ", dòng 15–16, 70 và 74."
            - paragraph [ref=f4e2961]:
              - text: Thiết bị cung cấp
              - code [ref=f4e2962]: incident_id
              - text: ", nhưng bảng sự kiện dùng unique"
              - code [ref=f4e2963]: (incident_id, event_revision)
              - text: toàn cục. Hợp đồng chưa quy định ID phải duy nhất toàn hệ thống hay chỉ trong một thiết bị; cũng chưa quy định ingest phải đối chiếu thiết bị đã xác thực với thiết bị trong assignment của incident trước mỗi cập nhật. Quyền thiết bị trong tài liệu yêu cầu đã nêu “sự kiện của chính nó”, nhưng quy tắc đó chưa được cụ thể hóa tại phép tra cứu/cập nhật incident.
            - paragraph [ref=f4e2964]:
              - text: Hai firmware tạo cùng ID cục bộ có thể khiến một sự kiện hợp lệ bị coi là trùng/xung đột. Nếu handler tra cứu bằng
              - code [ref=f4e2965]: incident_id
              - text: rồi chỉ kiểm topic với
              - code [ref=f4e2966]: payload.device_id
              - text: ", thiết bị B có thể gửi ID của incident A kèm revision tiếp theo và làm thay đổi sự cố của A, dù topic vẫn thuộc B. Đây là đường xử lý thiết kế chưa loại trừ, chưa phải lỗ hổng đã chứng minh trên code."
            - paragraph [ref=f4e2967]:
              - strong [ref=f4e2968]: "Hướng sửa đề xuất:"
              - text: chọn namespace
              - code [ref=f4e2969]: (authenticated_device_id, device_incident_id)
              - text: hoặc quy tắc ID toàn cục, đồng thời bắt buộc kiểm nguồn phát của incident trong transaction. UUID riêng lẻ không thay kiểm quyền.
              - code [ref=f4e2970]: assignment_id
              - text: được server gắn khi tạo incident phải bất biến; sự kiện tiếp theo không được chuyển incident sang assignment mới khi thiết bị đổi chủ.
            - paragraph [ref=f4e2971]:
              - strong [ref=f4e2972]: "Kiểm chứng cần bổ sung khi triển khai:"
              - text: hai thiết bị dùng cùng ID cục bộ; thiết bị B cập nhật incident của A với revision mới; thiết bị A gửi bản tin cũ sau khi đổi assignment. Kết quả phải tách incident đúng namespace hoặc từ chối rõ ràng, không thay đổi sự cố của hồ sơ khác.
            - 'heading "R-03 — P2: Chưa thống nhất xử lý confirmed không xác định được assignment" [level=3] [ref=f4e2973]'
            - paragraph [ref=f4e2974]:
              - strong [ref=f4e2975]: "Vị trí:"
              - link "chính sách thời gian/cảnh báo" [ref=f4e2976] [cursor=pointer]:
                - /url: "#kien-truc"
              - text: ", dòng 75–82;"
              - link "quy tắc gán dữ liệu" [ref=f4e2977] [cursor=pointer]:
                - /url: "#du-lieu"
              - text: ", dòng 55."
            - paragraph [ref=f4e2978]:
              - text: Kiến trúc hứa confirmed không rõ giờ sẽ được lưu lịch sử và gửi thông báo nhận trễ. Đồng thời, dữ liệu không đủ bằng chứng để gán vào assignment phải bị cách ly. Sau chuyển thiết bị A → B, một confirmed trong buffer có
              - code [ref=f4e2979]: "measured_at: null"
              - text: và boot chưa có mốc thời gian tin cậy không cho backend biết người được theo dõi nào liên quan. Không thể vừa cách ly vừa gửi thông báo sức khỏe đúng người nếu chưa có quy tắc giải quyết trường hợp này.
            - paragraph [ref=f4e2980]:
              - strong [ref=f4e2981]: "Hướng sửa đề xuất:"
              - text: tách “không rõ giờ nhưng biết chắc assignment” khỏi “không rõ assignment”. Trường hợp đầu có thể gửi thông báo nhận trễ. Trường hợp sau tiếp tục cách ly, có trạng thái theo dõi, quyền xử lý, cách bổ sung bằng chứng và quy tắc tái xử lý đúng một lần; sửa lời hứa gửi thông báo cho phù hợp. Có thể nghiên cứu assignment epoch/token do server cấp, gắn với từng bản tin lúc tạo và giữ qua reboot, kèm quy trình chuyển chủ được xác nhận. Không để firmware tự khai
              - code [ref=f4e2982]: subject_id
              - text: hoặc mặc định chọn chủ hiện tại.
            - paragraph [ref=f4e2983]:
              - strong [ref=f4e2984]: "Kiểm chứng cần bổ sung khi triển khai:"
              - text: đổi chủ khi thiết bị có sự kiện chưa gửi, reboot trước đồng bộ giờ, nhận lại confirmed/cancel nhiều lần và giải quyết cách ly. Không gửi sai người, không mất dấu sự kiện cần xử lý, không nhân đôi cảnh báo khi tái xử lý. T-03 hiện chỉ yêu cầu cách ly; chưa nêu đường đi tiếp.
            - 'heading "R-04 — P2: Telemetry chưa đủ ngữ nghĩa để tính coverage và thống kê khi gộp mẫu" [level=3] [ref=f4e2985]'
            - paragraph [ref=f4e2986]:
              - strong [ref=f4e2987]: "Vị trí:"
              - link "hợp đồng telemetry" [ref=f4e2988] [cursor=pointer]:
                - /url: "#du-lieu"
              - text: ", dòng 45–53 và 63;"
              - link "lấy mẫu firmware" [ref=f4e2989] [cursor=pointer]:
                - /url: "#phan-cung"
              - text: ", dòng 52;"
              - link "đầu vào AI" [ref=f4e2990] [cursor=pointer]:
                - /url: "#tro-ly-ai"
              - text: ", dòng 19."
            - paragraph [ref=f4e2991]:
              - text: Payload chỉ có một
              - code [ref=f4e2992]: heart_rate_bpm
              - text: và một timestamp. README ví dụ gọi đây là một mẫu BPM, nhưng tài liệu giao tiếp cho phép tổng hợp mẫu để giảm băng thông và firmware dự kiến chỉ gửi tổng hợp thường kỳ. Backend lại phải tính số mẫu hợp lệ, coverage theo cấu hình thu, min/max/trung bình. Chưa xác định một giá trị gửi lên là snapshot hay trung bình của cửa sổ, coverage đếm mẫu nào và cấu hình có hiệu lực trong khoảng nào.
            - paragraph [ref=f4e2993]: Khi hai gói tổng hợp có số mẫu hợp lệ khác nhau, lấy trung bình hai giá trị không bằng trung bình của toàn bộ mẫu hợp lệ. Min/max của các trung bình cũng không khôi phục được min/max mẫu gốc. Đếm số gói nhận được chỉ phản ánh lượng gói nhận, không chứng minh độ phủ cảm biến mà phần tóm tắt muốn công bố.
            - paragraph [ref=f4e2994]:
              - strong [ref=f4e2995]: "Hướng sửa đề xuất:"
              - text: chốt một semantics v1. Nếu dùng snapshot, định nghĩa rõ nhịp tạo snapshot, coverage và thống kê chỉ trên các snapshot đó. Nếu gửi aggregate, bổ sung ranh giới cửa sổ, số mẫu hợp lệ/kỳ vọng, thống kê đủ để gộp theo định nghĩa đã chọn và cấu hình có version/thời điểm hiệu lực. Không nhất thiết gửi raw PPG/IMU. Đồng bộ payload, schema tương lai và cách diễn đạt trên dashboard/AI với lựa chọn này.
            - paragraph [ref=f4e2996]:
              - strong [ref=f4e2997]: "Kiểm chứng cần bổ sung khi triển khai:"
              - text: gói có số mẫu khác nhau, đổi chu kỳ thu/gửi giữa ngày, tín hiệu kém và mất một gói. Đối chiếu mean/coverage với tập dữ liệu tổng hợp có đáp án biết trước; không chỉ đếm envelope.
            - heading "Kiểm chứng và giới hạn" [level=3] [ref=f4e2998]
            - paragraph [ref=f4e2999]:
              - text: Trước khi thêm báo cáo này, đã kiểm
              - strong [ref=f4e3000]: 24 file Markdown, 53 liên kết nội bộ và 3 JSON mẫu
              - text: "bằng Python standard library: đọc được UTF-8, code fence cân bằng, không có link nội bộ đứt, JSON parse được. Đối chiếu device/message/incident/revision giữa sự kiện và ACK, cùng cửa sổ hủy trong ví dụ: đạt. Đây là kiểm tài liệu và tính nhất quán của ví dụ, chưa phải validate JSON Schema hoặc test ứng dụng."
            - paragraph [ref=f4e3001]: Không chạy lint/type-check hoặc test ứng dụng vì chưa có toolchain/code. Chưa đo cảm biến, pin, độ trễ hoặc chất lượng thuật toán. Các tình huống trong findings là lập luận review và tiêu chí test đề xuất, không được ghi nhận là đã chạy.
            - paragraph [ref=f4e3002]: Phạm vi cảnh báo chỉ trong web đang kết nối, framework/linh kiện chưa chốt và thiếu rubric/ngân sách đã được bản v0.1 công bố rõ; không coi những giới hạn đó là lỗi mới. Cấu trúc thư mục đủ để tiếp tục đặc tả; chưa có căn cứ cần thêm microservices hoặc mở rộng cây source.
            - paragraph [ref=f4e3003]:
              - strong [ref=f4e3004]: "Bước tiếp theo đề xuất:"
              - text: sửa đồng bộ quy tắc ingest và vòng đời thông báo trong tài liệu 03/04, bổ sung tình huống vào tài liệu 08, rồi chốt semantics telemetry trước khi viết schema/simulator. Báo cáo này không đánh dấu các việc sửa là đã thực hiện.
