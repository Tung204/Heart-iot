            - paragraph [ref=f4e3229]:
              - text: Đề cương gốc cùng kế hoạch có trạng thái nằm trong dự án
              - strong [ref=f4e3230]: Đồ án sức khỏe IoT
              - text: ở Obsidian.
              - link "Nguồn và điều chưa xác minh" [ref=f4e3231] [cursor=pointer]:
                - /url: "#nguon"
              - text: ghi đường dẫn, tài liệu đã đọc và thông tin còn thiếu.
              - code [ref=f4e3232]: docs
              - text: là nguồn chính cho kỹ thuật; không duy trì checklist tiến độ thứ hai tại repository.
            - paragraph [ref=f4e3233]:
              - text: Bước tiếp theo là chốt phạm vi nền tảng, ranh giới tự chủ và cấu hình động, đối chiếu yêu cầu của trường/linh kiện, rồi cập nhật đồng bộ đặc tả trước khi triển khai.
              - link "Lộ trình v0.1" [ref=f4e3234] [cursor=pointer]:
                - /url: "#lo-trinh"
              - text: là baseline IoT;
              - link "chương 11" [ref=f4e3235] [cursor=pointer]:
                - /url: "#nen-tang-ai"
              - text: bổ sung bằng chứng cần trình diễn cho hướng AI thực thi.
