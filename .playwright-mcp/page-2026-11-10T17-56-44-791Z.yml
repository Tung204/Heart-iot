              - text: Đề xuất bắt đầu bằng
              - strong [ref=f4e118]: prototype trên bàn, rồi khảo sát vị trí đeo
              - text: . Một MAX30102 gắn trên mạch thử không chứng minh được nhịp tim ổn định khi đeo và đi lại. Thuật toán IMU được thử ở thắt lưng cũng không mặc nhiên đúng cho cổ tay.
            - heading "Ý tưởng tạo khác biệt có thể đánh giá" [level=3] [ref=f4e119]
            - list [ref=f4e120]:
              - listitem [ref=f4e121]:
                - strong [ref=f4e122]: "Cảnh báo có vòng đời:"
                - text: nghi ngã → cửa sổ hủy → xác nhận từ thiết bị → gửi cảnh báo → người thân xác nhận → kết thúc có lý do. Có lịch sử thao tác và thông báo tới muộn.
              - listitem [ref=f4e123]:
                - strong [ref=f4e124]: "Dữ liệu biết chất lượng:"
                - text: hiển thị rõ
                - code [ref=f4e125]: valid
                - text: ","
                - code [ref=f4e126]: poor_signal
                - text: ","
                - code [ref=f4e127]: not_worn
                - text: ", dữ liệu cũ và thiết bị offline. Không vẽ tiếp một đường đo như thể vẫn đang nhận dữ liệu."
              - listitem [ref=f4e128]:
                - strong [ref=f4e129]: "AI có bằng chứng:"
                - text: mỗi tóm tắt chỉ rõ khoảng dữ liệu và phần bị thiếu; giải thích kiến thức chung phải có nguồn đã duyệt. Không để AI tự quyết định có gửi cảnh báo hay không.
            - heading "Kịch bản demo đề xuất" [level=3] [ref=f4e130]
            - paragraph [ref=f4e131]: Người thân được mời vào hồ sơ theo dõi và xem dữ liệu tổng hợp từ simulator. Một sự kiện nghi ngã xuất hiện; lần đầu được hủy trên thiết bị giả lập, lần sau hết cửa sổ hủy và tạo cảnh báo. Người thân nhận cảnh báo trên dashboard, xác nhận đang xử lý, rồi đóng với kết quả “báo nhầm” hoặc “đã hỗ trợ”.
            - paragraph [ref=f4e132]: Sau đó mô phỏng mất mạng, gửi lại cùng sự kiện, thu hồi quyền chia sẻ và một ngày thiếu dữ liệu. Hệ thống phải giữ đúng số cảnh báo, chặn quyền đã thu hồi, và AI nói rõ dữ liệu thiếu. Khi thay simulator bằng phần cứng, giữ nguyên hợp đồng dữ liệu.
            - heading "Giới hạn đã biết" [level=3] [ref=f4e133]
            - paragraph [ref=f4e134]: Wi-Fi chỉ phục vụ vùng có mạng đã cấu hình. Cảnh báo tại chỗ có thể hoạt động khi mất mạng, nhưng báo từ xa cần đường truyền. Nhịp tim là dữ liệu cảm biến cần đối chiếu, không phải chẩn đoán. Chưa có ngân sách, thời lượng pin, độ chính xác hoặc biểu mẫu trường để cam kết.
