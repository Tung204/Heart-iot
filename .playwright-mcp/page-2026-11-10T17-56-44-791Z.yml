                - /url: "#kiem-thu"
              - text: .
            - paragraph [ref=f4e3271]: "Lát cắt đầu: ingest một telemetry và một incident từ simulator, lưu bền có chống trùng, đọc bằng tài khoản đúng quyền, xác nhận/đóng incident. Viết migration/constraint cùng hành vi; kiểm transaction outbox và truy cập chéo hồ sơ trước khi mở rộng."
            - heading "firmware — Chương trình thiết bị" [level=3] [ref=f4e3272]
            - paragraph [ref=f4e3273]:
              - text: Nơi đặt chương trình ESP32 sau khi chọn board, ESP-IDF, component MQTT và driver cảm biến.
              - strong [ref=f4e3274]: Chưa có firmware build được hoặc pin mapping đã xác minh.
            - paragraph [ref=f4e3275]:
              - text: Đọc
              - link "phần cứng và firmware" [ref=f4e3276] [cursor=pointer]:
                - /url: "#phan-cung"
              - text: ","
              - link "hợp đồng" [ref=f4e3277] [cursor=pointer]:
                - /url: "#du-lieu"
              - text: và
              - link "payload mẫu" [ref=f4e3278] [cursor=pointer]:
                - /url: "#payload"
              - text: .
            - paragraph [ref=f4e3279]: "Ranh giới dự kiến: cảm biến, xử lý tín hiệu, phát hiện nghi ngã, tương tác tại chỗ, kết nối, buffer, telemetry và cấu hình. Cần ghi version board/SDK/component, sample rate, đơn vị, vị trí đeo và tham số thuật toán trong từng phiên thử."
            - paragraph [ref=f4e3280]: Provision credential ngoài source. ACK MQTT không thay ACK lưu bền từ backend. Outbox thư viện không được mặc định là hàng đợi flash sống qua mất nguồn. Chỉ tạo project SDK sau khi xác nhận bộ version tương thích.
            - heading "hardware — Hồ sơ phần cứng" [level=3] [ref=f4e3281]
            - paragraph [ref=f4e3282]:
              - text: Nơi lưu BOM được xác minh, sơ đồ mạch/pin mapping, thiết kế vỏ và bằng chứng đo nguồn/tín hiệu.
              - strong [ref=f4e3283]: Hiện chưa có BOM chốt, schematic hoặc giá linh kiện.
            - paragraph [ref=f4e3284]:
              - text: Các ứng viên và trình tự khảo sát nằm ở
              - link "thiết kế phần cứng" [ref=f4e3285] [cursor=pointer]:
                - /url: "#phan-cung"
              - text: .
            - paragraph [ref=f4e3286]:
              - text: Khi có đầu ra, tổ chức theo
              - code [ref=f4e3287]: bom
              - text: ","
              - code [ref=f4e3288]: schematics
              - text: ","
              - code [ref=f4e3289]: enclosure
              - text: và
              - code [ref=f4e3290]: measurements
              - text: . BOM cần mã part/module cụ thể, số lượng, nguồn datasheet, nhà cung cấp, ngày/giá, điện áp và lý do chọn. Kết quả đo cần board/firmware/config/version và điều kiện thử.
            - paragraph [ref=f4e3291]: Chưa có linh kiện thì ghi “chưa xác minh”; không điền giá 0 hoặc thông số định mức của một chip thành thông số cả module. Ảnh/video lớn lưu ở nơi chia sẻ phù hợp và dẫn link đã kiểm quyền; không đưa dữ liệu nhận diện người tham gia vào Git.
            - heading "infra — Hạ tầng" [level=3] [ref=f4e3292]
            - paragraph [ref=f4e3293]:
              - text: Nơi đặt cấu hình chạy local/demo sau khi ứng dụng có thể build.
              - strong [ref=f4e3294]: Chưa có Compose, image hoặc môi trường đã deploy.
            - paragraph [ref=f4e3295]: Thành phần dự kiến gồm PostgreSQL, MQTT broker có ACL, API/worker và web. Chỉ thêm cache/queue chuyên dụng khi có nhu cầu được chứng minh; bản đầu có thể dùng notification outbox trong database.
            - paragraph [ref=f4e3296]:
              - text: Đọc
              - link "kiến trúc" [ref=f4e3297] [cursor=pointer]:
                - /url: "#kien-truc"
              - text: và
              - link "vận hành/bàn giao" [ref=f4e3298] [cursor=pointer]:
                - /url: "#lo-trinh"
              - text: . Cấu hình thực tế phải mô tả port, TLS, health check, volume, backup/restore, migration, credential rotation và cách rollback.
            - paragraph [ref=f4e3299]:
              - text: Secret không commit. Khi thêm
              - code [ref=f4e3300]: .env.example
              - text: ", chỉ ghi tên biến và giá trị demo vô hại, không sao chép"
              - code [ref=f4e3301]: .env
              - text: thật. Không mở broker/DB công khai để tiện demo.
            - heading "tools/simulator — Mô phỏng" [level=3] [ref=f4e3302]
            - paragraph [ref=f4e3303]:
              - text: Công cụ dự kiến tạo dữ liệu tổng hợp theo hợp đồng thiết bị để làm demo và kiểm lỗi trước khi có phần cứng.
              - strong [ref=f4e3304]: Hiện chưa có script simulator chạy được.
            - paragraph [ref=f4e3305]: "Các kịch bản cần triển khai: nhịp tim/vận động hợp lệ, tín hiệu kém, candidate rồi cancel, candidate rồi confirmed, SOS, gửi trùng, đảo thứ tự revision, mất mạng/gửi lại, clock unsynced và đổi boot."
            - paragraph [ref=f4e3306]: Mỗi kịch bản cần seed hoặc bộ input cố định, thời gian/ID kiểm soát được, nhãn mô phỏng rõ và khả năng chạy qua cùng đường ingest với thiết bị. Không tạo đường tắt bỏ kiểm quyền thiết bị chỉ cho demo.
            - paragraph [ref=f4e3307]:
              - text: Tham chiếu
              - link "hợp đồng và ví dụ" [ref=f4e3308] [cursor=pointer]:
                - /url: "#payload"
              - text: ","
              - link "kịch bản kiểm thử" [ref=f4e3309] [cursor=pointer]:
                - /url: "#kiem-thu"
              - text: . Chọn ngôn ngữ sau khi chốt backend; không cần thêm runtime riêng nếu TypeScript hiện có đáp ứng.
            - heading "tests — Kiểm thử" [level=3] [ref=f4e3310]
            - paragraph [ref=f4e3311]:
              - strong [ref=f4e3312]: Chưa có ứng dụng nên chưa có test executable.
              - text: Ma trận yêu cầu/kịch bản và cách đo nằm tại
              - link "kiểm thử và đánh giá" [ref=f4e3313] [cursor=pointer]:
                - /url: "#kiem-thu"
              - text: .
            - paragraph [ref=f4e3314]: Unit test đặt gần module sở hữu hành vi khi chọn framework. Thư mục này dành cho integration/E2E qua ranh giới thiết bị → ingest → lưu trữ → cảnh báo → người nhận, và fixture tổng hợp dùng chung khi thực sự cần.
            - paragraph [ref=f4e3315]: Ưu tiên lint/type-check rồi test nhỏ nhất liên quan; chạy tuần tự mặc định. Test cần bảo vệ quyền, idempotency, state transition, quality/time và khôi phục sau lỗi. Không viết test chỉ để khẳng định tên file/thư mục có mặt hoặc mô phỏng lại nội bộ framework.
            - paragraph [ref=f4e3316]: Kết quả phần cứng/AI cần thông số và bằng chứng riêng; không gọi một JSON parse thành công là test hệ thống IoT đạt.
            - heading "data — Dữ liệu" [level=3] [ref=f4e3317]
            - paragraph [ref=f4e3318]:
              - text: Chỉ commit dữ liệu tổng hợp hoặc dữ liệu có quyền sử dụng đã được xác minh. Payload minh họa hiện đặt trong
              - link "contracts/examples" [ref=f4e3319] [cursor=pointer]:
                - /url: "#payload"
              - text: ; không nhân bản thành một bộ dữ liệu khác ở đây.
            - paragraph [ref=f4e3320]:
              - text: Các vùng local
              - code [ref=f4e3321]: raw/
              - text: ","
              - code [ref=f4e3322]: private/
              - text: ","
              - code [ref=f4e3323]: processed/
              - text: ","
              - code [ref=f4e3324]: exports/
              - text: đã được loại khỏi Git. Chỉ tạo khi có nhu cầu;
              - code [ref=f4e3325]: .gitignore
              - text: không phải cơ chế kiểm soát truy cập hoặc bảo đảm bảo mật.
            - paragraph [ref=f4e3326]: Dataset thử nghiệm cần manifest mô tả nguồn/giấy phép hoặc sự đồng ý, cảm biến, vị trí đeo, đơn vị, sample rate, thời gian, nhãn, cách ẩn danh, version xử lý và cách chia tập. Không đưa tên/số điện thoại/ảnh nhận diện vào fixture.
            - paragraph [ref=f4e3327]:
              - text: Chưa có dữ liệu đo hoặc dataset học thuật được tải trong lượt chuẩn bị này. Chính sách retention/xóa phải được chốt trước dữ liệu thật theo
              - link "đặc tả dữ liệu" [ref=f4e3328] [cursor=pointer]:
                - /url: "#du-lieu"
              - text: .
            - heading "reports — Báo cáo" [level=3] [ref=f4e3329]
            - paragraph [ref=f4e3330]:
              - text: Nơi lưu đầu ra báo cáo, hình/sơ đồ đã kiểm và kịch bản bảo vệ.
              - strong [ref=f4e3331]: Chưa có biểu mẫu trường, báo cáo hoàn chỉnh, slide hoặc kết quả thí nghiệm.
            - paragraph [ref=f4e3332]:
              - text: Cấu trúc chương và các phụ lục đề xuất nằm ở
              - link "lộ trình/hồ sơ" [ref=f4e3333] [cursor=pointer]:
                - /url: "#lo-trinh"
              - text: . Thiết kế kỹ thuật tiếp tục sửa ở
              - code [ref=f4e3334]: docs
              - text: ", không sao chép thành nhiều bản báo cáo song song trước khi biết mẫu cần nộp."
            - paragraph [ref=f4e3335]: Khi có mẫu trường, ghi nguồn và yêu cầu định dạng; xuất Word/PDF/slide theo đúng đầu ra được yêu cầu và kiểm trình bày. Bảng số liệu phải dẫn tới bằng chứng thực nghiệm. Ảnh/video lớn nên lưu ngoài Git, giữ liên kết có quyền xem phù hợp.
            - paragraph [ref=f4e3336]:
              - text: Tài liệu chứa dữ liệu cá nhân đặt ở vùng được bảo vệ;
              - code [ref=f4e3337]: reports/private/
              - text: bị loại khỏi Git nhưng vẫn cần quản lý quyền và retention riêng.
        - region [ref=f4e3338]:
