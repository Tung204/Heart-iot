            - paragraph [ref=f4e1970]: REST không thay MQTT cho thiết bị, không thay cơ chế đẩy realtime và không tự cung cấp durable workflow. Tool runtime có thể gọi service nội bộ đã kiểm quyền; không bắt mọi lời gọi trong cùng backend phải đi vòng qua HTTP. Framework, database, broker, AI provider, version và thư viện workflow vẫn chưa khóa.
