            - heading "Lát cắt triển khai đầu tiên" [level=3] [ref=f4e1481]
            - paragraph [ref=f4e1482]: "Phạm vi đề xuất: một hồ sơ demo, hai tài khoản người thân với quyền khác nhau, một thiết bị giả lập, telemetry tổng hợp, candidate/cancel/confirmed, hộp cảnh báo và thao tác xác nhận/đóng. Dữ liệu tổng hợp giúp kiểm backend trước khi có cảm biến ổn định."
            - paragraph [ref=f4e1483]: "Điều kiện hoàn tất lát cắt: chạy lại cùng kịch bản cho cùng kết quả; gửi lặp không nhân cảnh báo; tài khoản không có quyền không đọc dữ liệu; mất kết nối tạo trạng thái cũ/offline; restart worker không mất bản ghi cần gửi. Sau đó mới mở rộng số màn hình và nguồn dữ liệu."
