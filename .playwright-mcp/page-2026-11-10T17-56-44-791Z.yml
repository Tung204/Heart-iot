          - generic [ref=f4e83]:
            - heading "Bài toán" [level=3] [ref=f4e84]
            - paragraph [ref=f4e85]: Người thân cần biết người cao tuổi có đang đeo thiết bị, dữ liệu có còn mới và một cảnh báo đã có ai xử lý hay chưa. Chỉ hiển thị số nhịp tim và gửi thông báo chưa giải quyết được việc mất kết nối, báo động giả hoặc không ai nhận trách nhiệm.
            - paragraph [ref=f4e86]:
              - strong [ref=f4e87]: "Hướng đề xuất:"
              - text: một hệ thống theo dõi tại nhà, lấy vòng đời cảnh báo và chất lượng dữ liệu làm trung tâm. Thiết bị ghi nhận nhịp tim, vận động và dấu hiệu nghi té ngã; người dùng có thể hủy báo nhầm; người thân xem tình trạng và xác nhận đang hỗ trợ. AI giúp đọc dữ liệu đã ghi nhận.
            - paragraph [ref=f4e88]: Đối tượng đầu tiên là một người được theo dõi và một số người thân được cấp quyền. Đây là phạm vi prototype học thuật; số người dùng thực tế và mô hình triển khai cần xác định sau.
            - heading "Nguồn yêu cầu và phần phát triển thêm" [level=3] [ref=f4e89]
            - paragraph [ref=f4e90]: "Đề cương gốc yêu cầu IoT, nhịp tim, bước chân/mức vận động, phát hiện té ngã, web/app có tài khoản, chia sẻ người thân, admin và trợ lý AI. Bản này bổ sung đề xuất: trạng thái dữ liệu cũ, quyền chia sẻ có thể thu hồi, xác nhận xử lý cảnh báo, chống gửi trùng, simulator và phép đo đánh giá."
            - paragraph [ref=f4e91]: Không tự bổ sung SpO₂, huyết áp, ECG, GPS, gọi cấp cứu tự động hoặc ứng dụng native vào MVP. Nếu cần thêm, phải xem tác động đến cảm biến, nguồn, dữ liệu và thời gian.
            - heading "So sánh hướng sản phẩm" [level=3] [ref=f4e92]
