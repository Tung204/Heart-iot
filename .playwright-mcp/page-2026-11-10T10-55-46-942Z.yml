            - heading "Hệ quả" [level=3] [ref=f1e1838]
            - paragraph [ref=f1e1839]: Cần thêm broker và quản lý credential thiết bị. Phải xử lý duplicate/out-of-order, application ACK và hàng đợi riêng. Demo web online không chứng minh thông báo nền. Vị trí đeo còn mở nên chưa thiết kế PCB/vỏ cuối cùng hoặc mua linh kiện theo một BOM cố định.
            - paragraph [ref=f1e1840]: Các thư mục đã tạo phản ánh ranh giới trách nhiệm, chưa khóa framework/package manager. Khi chốt một lựa chọn, cập nhật trạng thái, người/căn cứ xác nhận và bằng chứng; nếu đổi, giữ lý do trong ADR tiếp theo thay vì viết lại như thể chưa từng có đề xuất này.
