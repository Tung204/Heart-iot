                    - cell "Candidate không có kết quả cuối" [ref=f1e598]
                    - cell "Hiển thị “chưa xác định do thiếu dữ liệu”; không báo bình thường và không tự xác nhận ngã" [ref=f1e599]
            - paragraph [ref=f1e600]: "Tham số demo đề xuất: heartbeat 15 giây, offline sau 45 giây không có heartbeat, dữ liệu chỉ số bị coi là cũ sau 30 giây. Cần điều chỉnh theo chu kỳ gửi/pin. LWT là tín hiệu bổ sung, không thay việc theo dõi thời gian nhận cuối."
            - paragraph [ref=f1e601]: Một confirmed đến trễ hơn 5 phút hoặc không xác định được giờ được lưu vào lịch sử, gắn cờ cần kiểm tra và gửi thông báo “sự kiện nhận trễ, chưa rõ tình trạng hiện tại”. Ngưỡng 5 phút là chính sách demo đề xuất, phải đánh giá lại; không âm thầm bỏ cảnh báo.
            - heading "Ranh giới quyền và vận hành" [level=3] [ref=f1e602]
            - paragraph [ref=f1e603]: Broker chỉ cho thiết bị publish/subscribe topic của nó; API xác minh payload khớp định danh kết nối. API kiểm quyền theo hồ sơ trước truy vấn dữ liệu, đăng ký realtime, xuất báo cáo và gọi AI. Thu hồi quyền phải ngắt stream và hủy quyền của tác vụ gửi chưa thực hiện. Admin kỹ thuật không mặc định là người xem sức khỏe.
            - paragraph [ref=f1e604]:
              - text: Backup, restore, secret rotation, giới hạn retention và quan sát lỗi được mô tả ở
              - link "lộ trình/bàn giao" [ref=f1e605] [cursor=pointer]:
                - /url: "#lo-trinh"
              - text: ; cần bằng chứng trước khi dùng dữ liệu thật.
