                  - row [ref=f1e975]:
                    - cell "Admin" [ref=f1e976]
                    - cell [ref=f1e977]:
                      - code [ref=f1e978]: GET /admin/devices
                      - text: ","
                      - code [ref=f1e979]: GET /admin/audit
