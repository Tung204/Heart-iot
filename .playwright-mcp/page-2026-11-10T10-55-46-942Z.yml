                      - code [ref=f1e1097]: config
                    - cell "Phiên bản cấu hình, thông tin board, secret provisioned ngoài source" [ref=f1e1098]
            - paragraph [ref=f1e1099]: Chưa tạo cây source chi tiết trước khi chọn ESP-IDF/driver. Cấu trúc trên là ranh giới trách nhiệm, không phải danh sách file đã có.
            - heading "Lấy mẫu, pin và lưu đệm" [level=3] [ref=f1e1100]
            - paragraph [ref=f1e1101]: Tách tốc độ lấy mẫu cảm biến khỏi chu kỳ gửi mạng. Thử các tốc độ IMU trong khả năng cảm biến, ghi lại tradeoff độ nhạy/CPU/điện; chỉ gửi tổng hợp thường kỳ và sự kiện, trừ phiên thu raw được bật rõ ràng.
            - paragraph [ref=f1e1102]: "Hàng đợi có dung lượng/tuổi tối đa được cấu hình và đo. Khi đầy: ưu tiên giữ sự kiện quan trọng, bỏ mẫu telemetry cũ theo chính sách có bộ đếm; nếu sự kiện vẫn phải bị bỏ thì báo lỗi/trạng thái degraded khi có kết nối. Không hứa lưu vô hạn hoặc không mất dữ liệu khi tắt nguồn."
            - paragraph [ref=f1e1103]:
              - text: Ước lượng sơ bộ thời lượng pin bằng
              - code [ref=f1e1104]: usable_capacity_mAh / average_current_mA
              - text: ", sau đó đo dòng ở các chế độ và kiểm thời gian chạy thực tế. Ghi thêm hiệu suất nguồn, chu kỳ Wi-Fi, rung/còi và điều kiện đo; chưa có con số thời lượng pin."
            - heading "BOM và hồ sơ phần cứng" [level=3] [ref=f1e1105]
            - paragraph [ref=f1e1106]:
              - text: "Mỗi linh kiện được chọn phải có: mã cụ thể, số lượng, đường dẫn datasheet/module, nhà cung cấp, giá tại ngày kiểm, tổng tiền, tình trạng sẵn có và lý do chọn. Hồ sơ lưu ở"
              - link "hardware" [ref=f1e1107] [cursor=pointer]:
                - /url: "#cau-truc-hardware"
              - text: . Giá để chưa xác minh cho đến khi đọc được nguồn; không đặt số 0 thay cho chưa biết.
