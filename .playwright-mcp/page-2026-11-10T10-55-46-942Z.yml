                    - columnheader "Trách nhiệm" [ref=f1e1065]
                - rowgroup [ref=f1e1066]:
                  - row [ref=f1e1067]:
                    - cell [ref=f1e1068]:
                      - code [ref=f1e1069]: sensors
                    - cell "Driver, timestamp, chất lượng, lỗi bus" [ref=f1e1070]
                  - row [ref=f1e1071]:
