            - paragraph [ref=f1e1890]:
              - text: Đề cương gốc cùng kế hoạch có trạng thái nằm trong dự án
              - strong [ref=f1e1891]: Đồ án sức khỏe IoT
              - text: ở Obsidian.
              - link "Nguồn và điều chưa xác minh" [ref=f1e1892] [cursor=pointer]:
                - /url: "#nguon"
              - text: ghi đường dẫn, tài liệu đã đọc và thông tin còn thiếu.
              - code [ref=f1e1893]: docs
              - text: là nguồn chính cho kỹ thuật; không duy trì checklist tiến độ thứ hai tại repository.
            - paragraph [ref=f1e1894]:
              - text: "Bước phù hợp tiếp theo là đối chiếu bản thiết kế với yêu cầu của trường và linh kiện sẵn có, sau đó xây một lát cắt demo: simulator → backend → dashboard → xác nhận cảnh báo. Xem"
              - link "lộ trình và hồ sơ" [ref=f1e1895] [cursor=pointer]:
                - /url: "#lo-trinh"
              - text: .
            - heading "apps/web — Giao diện web" [level=3] [ref=f1e1896]
            - paragraph [ref=f1e1897]:
              - text: Nơi triển khai giao diện người được theo dõi, người thân và admin.
              - strong [ref=f1e1898]: Hiện chưa có mã ứng dụng hoặc lệnh chạy.
              - text: React + TypeScript + Vite là ứng viên, chưa khóa version.
            - paragraph [ref=f1e1899]:
              - text: "Nguồn thiết kế:"
              - link "yêu cầu" [ref=f1e1900] [cursor=pointer]:
                - /url: "#yeu-cau"
              - text: ","
              - link "màn hình" [ref=f1e1901] [cursor=pointer]:
                - /url: "#giao-dien"
              - text: ","
              - link "API" [ref=f1e1902] [cursor=pointer]:
                - /url: "#du-lieu"
              - text: .
            - paragraph [ref=f1e1903]:
              - text: Sau khi chốt framework, tổ chức theo chức năng
              - code [ref=f1e1904]: auth
              - text: ","
              - code [ref=f1e1905]: subjects
              - text: ","
              - code [ref=f1e1906]: devices
              - text: ","
              - code [ref=f1e1907]: measurements
              - text: ","
              - code [ref=f1e1908]: alerts
              - text: ","
              - code [ref=f1e1909]: sharing
              - text: ","
              - code [ref=f1e1910]: assistant
              - text: ","
              - code [ref=f1e1911]: admin
              - text: ; phần dùng chung gồm API client, thành phần giao diện và định dạng thời gian/đơn vị. Không tạo các thư mục source rỗng trước khi có lát cắt triển khai.
            - paragraph [ref=f1e1912]: Ưu tiên demo đọc dữ liệu, trạng thái cũ/offline và xác nhận cảnh báo. Không tính quyền truy cập chỉ ở giao diện; backend là nơi thực thi quyền. Trạng thái đang tải, rỗng, mất mạng, thiếu quyền và dữ liệu mô phỏng cần rõ ràng.
            - heading "apps/api — Backend" [level=3] [ref=f1e1913]
            - paragraph [ref=f1e1914]:
              - text: Nơi triển khai backend modular monolith.
              - strong [ref=f1e1915]: Hiện chưa có ứng dụng, migration hay endpoint đang chạy.
              - text: NestJS + TypeScript là ứng viên, chưa khóa version/ORM.
            - paragraph [ref=f1e1916]:
              - text: "Ranh giới module dự kiến:"
              - code [ref=f1e1917]: auth
              - text: ","
              - code [ref=f1e1918]: subjects
              - text: ","
              - code [ref=f1e1919]: care-links
              - text: ","
              - code [ref=f1e1920]: devices
              - text: ","
              - code [ref=f1e1921]: ingestion
              - text: ","
              - code [ref=f1e1922]: measurements
              - text: ","
              - code [ref=f1e1923]: incidents
              - text: ","
              - code [ref=f1e1924]: notifications
              - text: ","
              - code [ref=f1e1925]: assistant
              - text: ","
              - code [ref=f1e1926]: audit
              - text: . Adapter MQTT/HTTP/AI gọi nghiệp vụ qua ranh giới rõ; logic chuyển trạng thái và kiểm quyền không nằm rải trong transport handler.
            - paragraph [ref=f1e1927]:
              - text: "Nguồn chính:"
              - link "kiến trúc" [ref=f1e1928] [cursor=pointer]:
                - /url: "#kien-truc"
              - text: ","
              - link "dữ liệu/API" [ref=f1e1929] [cursor=pointer]:
                - /url: "#du-lieu"
              - text: và
              - link "kiểm thử" [ref=f1e1930] [cursor=pointer]:
                - /url: "#kiem-thu"
              - text: .
            - paragraph [ref=f1e1931]: "Lát cắt đầu: ingest một telemetry và một incident từ simulator, lưu bền có chống trùng, đọc bằng tài khoản đúng quyền, xác nhận/đóng incident. Viết migration/constraint cùng hành vi; kiểm transaction outbox và truy cập chéo hồ sơ trước khi mở rộng."
            - heading "firmware — Chương trình thiết bị" [level=3] [ref=f1e1932]
            - paragraph [ref=f1e1933]:
              - text: Nơi đặt chương trình ESP32 sau khi chọn board, ESP-IDF, component MQTT và driver cảm biến.
              - strong [ref=f1e1934]: Chưa có firmware build được hoặc pin mapping đã xác minh.
            - paragraph [ref=f1e1935]:
              - text: Đọc
              - link "phần cứng và firmware" [ref=f1e1936] [cursor=pointer]:
                - /url: "#phan-cung"
              - text: ","
              - link "hợp đồng" [ref=f1e1937] [cursor=pointer]:
                - /url: "#du-lieu"
              - text: và
              - link "payload mẫu" [ref=f1e1938] [cursor=pointer]:
                - /url: "#payload"
              - text: .
            - paragraph [ref=f1e1939]: "Ranh giới dự kiến: cảm biến, xử lý tín hiệu, phát hiện nghi ngã, tương tác tại chỗ, kết nối, buffer, telemetry và cấu hình. Cần ghi version board/SDK/component, sample rate, đơn vị, vị trí đeo và tham số thuật toán trong từng phiên thử."
            - paragraph [ref=f1e1940]: Provision credential ngoài source. ACK MQTT không thay ACK lưu bền từ backend. Outbox thư viện không được mặc định là hàng đợi flash sống qua mất nguồn. Chỉ tạo project SDK sau khi xác nhận bộ version tương thích.
            - heading "hardware — Hồ sơ phần cứng" [level=3] [ref=f1e1941]
            - paragraph [ref=f1e1942]:
              - text: Nơi lưu BOM được xác minh, sơ đồ mạch/pin mapping, thiết kế vỏ và bằng chứng đo nguồn/tín hiệu.
              - strong [ref=f1e1943]: Hiện chưa có BOM chốt, schematic hoặc giá linh kiện.
            - paragraph [ref=f1e1944]:
              - text: Các ứng viên và trình tự khảo sát nằm ở
              - link "thiết kế phần cứng" [ref=f1e1945] [cursor=pointer]:
                - /url: "#phan-cung"
              - text: .
            - paragraph [ref=f1e1946]:
              - text: Khi có đầu ra, tổ chức theo
              - code [ref=f1e1947]: bom
              - text: ","
              - code [ref=f1e1948]: schematics
              - text: ","
              - code [ref=f1e1949]: enclosure
              - text: và
              - code [ref=f1e1950]: measurements
              - text: . BOM cần mã part/module cụ thể, số lượng, nguồn datasheet, nhà cung cấp, ngày/giá, điện áp và lý do chọn. Kết quả đo cần board/firmware/config/version và điều kiện thử.
            - paragraph [ref=f1e1951]: Chưa có linh kiện thì ghi “chưa xác minh”; không điền giá 0 hoặc thông số định mức của một chip thành thông số cả module. Ảnh/video lớn lưu ở nơi chia sẻ phù hợp và dẫn link đã kiểm quyền; không đưa dữ liệu nhận diện người tham gia vào Git.
            - heading "infra — Hạ tầng" [level=3] [ref=f1e1952]
            - paragraph [ref=f1e1953]:
              - text: Nơi đặt cấu hình chạy local/demo sau khi ứng dụng có thể build.
              - strong [ref=f1e1954]: Chưa có Compose, image hoặc môi trường đã deploy.
            - paragraph [ref=f1e1955]: Thành phần dự kiến gồm PostgreSQL, MQTT broker có ACL, API/worker và web. Chỉ thêm cache/queue chuyên dụng khi có nhu cầu được chứng minh; bản đầu có thể dùng notification outbox trong database.
            - paragraph [ref=f1e1956]:
              - text: Đọc
              - link "kiến trúc" [ref=f1e1957] [cursor=pointer]:
                - /url: "#kien-truc"
              - text: và
              - link "vận hành/bàn giao" [ref=f1e1958] [cursor=pointer]:
                - /url: "#lo-trinh"
              - text: . Cấu hình thực tế phải mô tả port, TLS, health check, volume, backup/restore, migration, credential rotation và cách rollback.
            - paragraph [ref=f1e1959]:
              - text: Secret không commit. Khi thêm
              - code [ref=f1e1960]: .env.example
              - text: ", chỉ ghi tên biến và giá trị demo vô hại, không sao chép"
              - code [ref=f1e1961]: .env
              - text: thật. Không mở broker/DB công khai để tiện demo.
            - heading "tools/simulator — Mô phỏng" [level=3] [ref=f1e1962]
            - paragraph [ref=f1e1963]:
              - text: Công cụ dự kiến tạo dữ liệu tổng hợp theo hợp đồng thiết bị để làm demo và kiểm lỗi trước khi có phần cứng.
              - strong [ref=f1e1964]: Hiện chưa có script simulator chạy được.
            - paragraph [ref=f1e1965]: "Các kịch bản cần triển khai: nhịp tim/vận động hợp lệ, tín hiệu kém, candidate rồi cancel, candidate rồi confirmed, SOS, gửi trùng, đảo thứ tự revision, mất mạng/gửi lại, clock unsynced và đổi boot."
            - paragraph [ref=f1e1966]: Mỗi kịch bản cần seed hoặc bộ input cố định, thời gian/ID kiểm soát được, nhãn mô phỏng rõ và khả năng chạy qua cùng đường ingest với thiết bị. Không tạo đường tắt bỏ kiểm quyền thiết bị chỉ cho demo.
            - paragraph [ref=f1e1967]:
              - text: Tham chiếu
              - link "hợp đồng và ví dụ" [ref=f1e1968] [cursor=pointer]:
                - /url: "#payload"
              - text: ","
              - link "kịch bản kiểm thử" [ref=f1e1969] [cursor=pointer]:
                - /url: "#kiem-thu"
              - text: . Chọn ngôn ngữ sau khi chốt backend; không cần thêm runtime riêng nếu TypeScript hiện có đáp ứng.
            - heading "tests — Kiểm thử" [level=3] [ref=f1e1970]
            - paragraph [ref=f1e1971]:
              - strong [ref=f1e1972]: Chưa có ứng dụng nên chưa có test executable.
              - text: Ma trận yêu cầu/kịch bản và cách đo nằm tại
              - link "kiểm thử và đánh giá" [ref=f1e1973] [cursor=pointer]:
                - /url: "#kiem-thu"
              - text: .
            - paragraph [ref=f1e1974]: Unit test đặt gần module sở hữu hành vi khi chọn framework. Thư mục này dành cho integration/E2E qua ranh giới thiết bị → ingest → lưu trữ → cảnh báo → người nhận, và fixture tổng hợp dùng chung khi thực sự cần.
            - paragraph [ref=f1e1975]: Ưu tiên lint/type-check rồi test nhỏ nhất liên quan; chạy tuần tự mặc định. Test cần bảo vệ quyền, idempotency, state transition, quality/time và khôi phục sau lỗi. Không viết test chỉ để khẳng định tên file/thư mục có mặt hoặc mô phỏng lại nội bộ framework.
            - paragraph [ref=f1e1976]: Kết quả phần cứng/AI cần thông số và bằng chứng riêng; không gọi một JSON parse thành công là test hệ thống IoT đạt.
            - heading "data — Dữ liệu" [level=3] [ref=f1e1977]
            - paragraph [ref=f1e1978]:
              - text: Chỉ commit dữ liệu tổng hợp hoặc dữ liệu có quyền sử dụng đã được xác minh. Payload minh họa hiện đặt trong
              - link "contracts/examples" [ref=f1e1979] [cursor=pointer]:
                - /url: "#payload"
              - text: ; không nhân bản thành một bộ dữ liệu khác ở đây.
            - paragraph [ref=f1e1980]:
              - text: Các vùng local
              - code [ref=f1e1981]: raw/
              - text: ","
              - code [ref=f1e1982]: private/
              - text: ","
              - code [ref=f1e1983]: processed/
              - text: ","
              - code [ref=f1e1984]: exports/
              - text: đã được loại khỏi Git. Chỉ tạo khi có nhu cầu;
              - code [ref=f1e1985]: .gitignore
              - text: không phải cơ chế kiểm soát truy cập hoặc bảo đảm bảo mật.
            - paragraph [ref=f1e1986]: Dataset thử nghiệm cần manifest mô tả nguồn/giấy phép hoặc sự đồng ý, cảm biến, vị trí đeo, đơn vị, sample rate, thời gian, nhãn, cách ẩn danh, version xử lý và cách chia tập. Không đưa tên/số điện thoại/ảnh nhận diện vào fixture.
            - paragraph [ref=f1e1987]:
              - text: Chưa có dữ liệu đo hoặc dataset học thuật được tải trong lượt chuẩn bị này. Chính sách retention/xóa phải được chốt trước dữ liệu thật theo
              - link "đặc tả dữ liệu" [ref=f1e1988] [cursor=pointer]:
                - /url: "#du-lieu"
              - text: .
            - heading "reports — Báo cáo" [level=3] [ref=f1e1989]
            - paragraph [ref=f1e1990]:
              - text: Nơi lưu đầu ra báo cáo, hình/sơ đồ đã kiểm và kịch bản bảo vệ.
              - strong [ref=f1e1991]: Chưa có biểu mẫu trường, báo cáo hoàn chỉnh, slide hoặc kết quả thí nghiệm.
            - paragraph [ref=f1e1992]:
              - text: Cấu trúc chương và các phụ lục đề xuất nằm ở
              - link "lộ trình/hồ sơ" [ref=f1e1993] [cursor=pointer]:
                - /url: "#lo-trinh"
              - text: . Thiết kế kỹ thuật tiếp tục sửa ở
              - code [ref=f1e1994]: docs
              - text: ", không sao chép thành nhiều bản báo cáo song song trước khi biết mẫu cần nộp."
            - paragraph [ref=f1e1995]: Khi có mẫu trường, ghi nguồn và yêu cầu định dạng; xuất Word/PDF/slide theo đúng đầu ra được yêu cầu và kiểm trình bày. Bảng số liệu phải dẫn tới bằng chứng thực nghiệm. Ảnh/video lớn nên lưu ngoài Git, giữ liên kết có quyền xem phù hợp.
            - paragraph [ref=f1e1996]:
              - text: Tài liệu chứa dữ liệu cá nhân đặt ở vùng được bảo vệ;
              - code [ref=f1e1997]: reports/private/
              - text: bị loại khỏi Git nhưng vẫn cần quản lý quyền và retention riêng.
