            - heading "Chiến lược chạy" [level=3] [ref=f1e1320]
            - list [ref=f1e1321]:
              - listitem [ref=f1e1322]: Chạy lint và type-check liên quan khi đã có toolchain. Với thay đổi chỉ có tài liệu, kiểm Markdown/liên kết/JSON và sự nhất quán.
              - listitem [ref=f1e1323]: "Chạy test nhỏ nhất bao phủ hành vi thay đổi: quyền truy cập, state transition, tổng hợp, chống trùng hoặc parser hợp đồng do ứng dụng sở hữu."
              - listitem [ref=f1e1324]: Mở integration test khi chạm transaction DB, broker, thời gian, quyền realtime hoặc tác vụ gửi.
              - listitem [ref=f1e1325]: Dùng E2E cho đường demo quan trọng; race test cho xác nhận đồng thời; load/stress chỉ khi đánh giá giới hạn cụ thể. Full suite dành cho gate phát hành hoặc bằng chứng hồi quy rộng cần thiết.
            - paragraph [ref=f1e1326]: Mặc định chạy tuần tự. Khi fail phải đọc bằng chứng và tìm nguyên nhân trước khi chạy lại. Không bỏ/skip/nới test hợp lệ để làm xanh.
