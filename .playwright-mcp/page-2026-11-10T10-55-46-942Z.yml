            - list [ref=f1e546]:
              - listitem [ref=f1e547]:
                - text: Firmware là nơi quyết định kết thúc cửa sổ hủy, dùng đồng hồ monotonic. Tham số demo đề xuất là
                - strong [ref=f1e548]: 20 giây
                - text: ", chưa chốt sau thử thao tác."
              - listitem [ref=f1e549]:
                - code [ref=f1e550]: fall.candidate
                - text: chỉ tạo trạng thái
                - code [ref=f1e551]: suspected
                - text: . Backend
                - strong [ref=f1e552]: không tự suy ra confirmed
                - text: "vì hết thời gian nhận dữ liệu: có thể thiết bị đã hủy khi mất mạng."
              - listitem [ref=f1e553]:
                - code [ref=f1e554]: fall.cancelled
                - text: trước confirmed kết thúc incident và không gửi cảnh báo khẩn tới người thân. Nếu đã confirmed, yêu cầu hủy sau đó được ghi là
                - code [ref=f1e555]: user.cancel_requested
                - text: ; backend đóng với lý do và thông báo cập nhật cho những người đã nhận, không xóa lịch sử.
              - listitem [ref=f1e556]:
                - code [ref=f1e557]: fall.confirmed
                - text: mở cảnh báo ngay cả khi
                - code [ref=f1e558]: candidate
                - text: chưa tới.
                - code [ref=f1e559]: incident_id
                - text: ổn định,
                - code [ref=f1e560]: event_revision
                - text: tăng trong cùng incident; dữ liệu đến trễ không được làm lùi trạng thái cuối.
              - listitem [ref=f1e561]: SOS là incident riêng, mở trực tiếp sau thao tác xác nhận chủ động, không đợi 20 giây của nghi ngã.
              - listitem [ref=f1e562]:
                - text: Người thân
                - code [ref=f1e563]: acknowledged
                - text: chỉ có nghĩa đã nhận trách nhiệm hỗ trợ, không đồng nghĩa người dùng đã an toàn. Chỉ
                - code [ref=f1e564]: resolved
                - text: có kết quả và người thực hiện mới kết thúc xử lý.
            - heading "Tính bền vững và gửi thông báo" [level=3] [ref=f1e565]
            - paragraph [ref=f1e566]: Tiếp nhận sự kiện và tạo bản ghi cần gửi trong cùng transaction. Worker đọc notification outbox, thử gửi với backoff và số lần tối đa cấu hình được, lưu lỗi và lần thử. Unique key ngăn cùng incident/revision/người nhận/kênh tạo nhiều tác vụ gửi.
            - paragraph [ref=f1e567]:
              - text: MQTT QoS 1 vẫn có thể giao trùng. ACK của broker không có nghĩa ứng dụng đã lưu. Thiết bị chỉ coi sự kiện quan trọng đã tới backend khi nhận
              - strong [ref=f1e568]: application ACK sau commit
              - text: ; nếu chưa có thì gửi lại cùng định danh. Bộ nhớ bền của thiết bị, dung lượng và cách phục hồi sau mất nguồn phải được hiện thực riêng và kiểm chứng. Không coi outbox mặc định của thư viện là flash queue được bảo đảm.
            - paragraph [ref=f1e569]:
              - text: Kết nối realtime cũng có thể đứt. Web tải snapshot/cursor từ API khi reconnect; trạng thái server là nguồn chính. Gửi thành công tới kết nối không đồng nghĩa người dùng đã đọc;
              - code [ref=f1e570]: acknowledged
              - text: phải là hành động rõ ràng.
