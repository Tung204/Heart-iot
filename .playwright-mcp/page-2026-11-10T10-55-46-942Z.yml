              - text: . Giá trị
              - code [ref=f1e2029]: demo-*
              - text: ", timestamp và chỉ số đều là minh họa, không phải dữ liệu người thật hoặc kết quả thử."
            - paragraph [ref=f1e2030]: Khi triển khai, viết JSON Schema cho envelope/payload và OpenAPI cho HTTP, chọn một nguồn sinh kiểu dữ liệu thay vì giữ nhiều bản độc lập. Thay đổi phá tương thích phải có version mới và thử firmware cũ trong phạm vi hỗ trợ. Cần chốt giới hạn kích thước, độ dài ID, kiểu số và các enum trước khi dùng validator trong ingest.
            - heading "Telemetry — nhịp tim và bước chân" [level=3] [ref=f1e2031]
            - paragraph [ref=f1e2032]:
              - link "Mở telemetry.v1.json" [ref=f1e2033] [cursor=pointer]:
                - /url: ../../packages/contracts/examples/telemetry.v1.json
            - code [ref=f1e2035]: "{ \"schema_version\": \"1.0\", \"message_id\": \"demo-telemetry-001\", \"device_id\": \"demo-device-001\", \"boot_id\": \"demo-boot-001\", \"sequence\": 100, \"measured_at\": \"2026-11-10T09:20:00Z\", \"clock_status\": \"synced\", \"uptime_ms\": 120000, \"metrics\": { \"heart_rate_bpm\": 72, \"steps_since_boot\": 125 }, \"quality\": { \"heart_rate\": \"valid\", \"motion\": \"valid\" }, \"battery_percent\": null, \"firmware_version\": \"0.0.0-design\" }"
