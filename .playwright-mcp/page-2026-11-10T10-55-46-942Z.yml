            - paragraph [ref=f1e981]:
              - text: Lỗi API dùng envelope
              - code [ref=f1e982]: "{ \"code\": \"...\", \"message\": \"...\", \"request_id\": \"...\" }"
              - text: ; không trả stack trace hoặc thông tin hồ sơ khác. Dùng
              - code [ref=f1e983]: "401"
              - text: khi không có phiên,
              - code [ref=f1e984]: "403"
              - text: khi bị cấm theo chính sách,
              - code [ref=f1e985]: "409"
              - text: khi xung đột version,
              - code [ref=f1e986]: "422"
              - text: khi payload không phù hợp hợp đồng,
              - code [ref=f1e987]: "429"
              - text: khi vượt giới hạn. Với tài nguyên riêng tư cần thống nhất cách dùng
              - code [ref=f1e988]: "404"
              - text: để tránh dò tồn tại.
            - heading "Retention và xóa" [level=3] [ref=f1e989]
            - paragraph [ref=f1e990]: Trước dữ liệu thật, chốt thời hạn cho raw signal, telemetry tổng hợp, audit, AI và backup. Raw IMU/PPG chỉ thu trong phiên thử có mục đích, không truyền/lưu liên tục mặc định. Một yêu cầu xóa phải xét database, file export, cache, tóm tắt AI và vòng đời backup; không ghi “đã xóa hết” khi mới ẩn trên giao diện.
            - paragraph [ref=f1e991]: Tài khoản người thân đã bị thu hồi không nhận notification còn trong hàng đợi và không đọc bản tóm tắt cache. Dữ liệu đã xuất ra ngoài cần được giải thích trong chính sách chia sẻ trước khi sử dụng thực tế.
