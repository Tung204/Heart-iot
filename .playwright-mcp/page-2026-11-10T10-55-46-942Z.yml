                  - row [ref=f1e1213]:
                    - cell "AI lỗi hoặc bị tắt" [ref=f1e1214]
                    - cell "Chỉ số và cảnh báo vẫn dùng được; cung cấp tóm tắt theo mẫu nếu đủ dữ liệu" [ref=f1e1215]
            - heading "Dễ sử dụng và quyền riêng tư" [level=3] [ref=f1e1216]
            - paragraph [ref=f1e1217]: Nút hủy/SOS trên thiết bị cần thao tác dễ phân biệt. Giao diện dùng chữ rõ, nhãn có nghĩa, không dùng màu là tín hiệu duy nhất, điều hướng bàn phím và bố cục thích ứng. Cần thử nhiệm vụ thực tế để kết luận phù hợp với người cao tuổi; không coi thiết kế đẹp là bằng chứng sử dụng tốt.
            - paragraph [ref=f1e1218]: Thông báo ở màn hình khóa chỉ chứa nội dung tối thiểu theo lựa chọn chia sẻ, không đưa toàn bộ chỉ số sức khỏe. Nếu thêm Web Push, xin quyền tại thời điểm người dùng chọn nhận thông báo và kiểm chính nền tảng mục tiêu. Chưa có bằng chứng app đóng vẫn nhận được thông báo.
