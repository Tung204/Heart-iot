              - text: đã đọc đề cương gốc trong Obsidian và chuẩn bị tài liệu thiết kế v0.1 cùng khung thư mục. Chưa có mã ứng dụng, firmware chạy được, thiết bị đã kiểm chứng hoặc kết quả thử nghiệm. Các lựa chọn công nghệ và chỉ tiêu dưới đây là đề xuất để bắt đầu thảo luận.
