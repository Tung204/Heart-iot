                    - cell "Quyền chặn đúng; xóa có phạm vi và trạng thái, không chỉ ẩn UI" [ref=f1e1396]
                  - row [ref=f1e1397]:
                    - cell "T-13" [ref=f1e1398]
                    - cell "FR-12" [ref=f1e1399]
                    - cell "Trình duyệt đóng/tắt quyền push/kênh lỗi" [ref=f1e1400]
                    - cell "Chỉ công bố hỗ trợ ở nền tảng đã kiểm; trạng thái thất bại không bị coi đã nhận" [ref=f1e1401]
                  - row [ref=f1e1402]:
                    - cell "T-14" [ref=f1e1403]
                    - cell "NFR-07" [ref=f1e1404]
                    - cell "Đo chuỗi timestamp khi dashboard online" [ref=f1e1405]
                    - cell "Báo p50/p95 và số mẫu; tách cửa sổ hủy, truyền mạng, xử lý, hiển thị" [ref=f1e1406]
            - paragraph [ref=f1e1407]: T-13 chỉ chạy khi triển khai Web Push/P1. Các phép kiểm ở bảng là mục tiêu dự kiến; chưa có test executable hoặc kết quả đạt.
            - heading "Đánh giá phát hiện té ngã" [level=3] [ref=f1e1408]
            - paragraph [ref=f1e1409]:
              - text: Xác định đơn vị đánh giá là
              - strong [ref=f1e1410]: sự kiện
              - text: ", không đếm mỗi cửa sổ IMU như một người ngã độc lập. Lưu nhãn và ranh giới thời gian, vị trí đeo, người/phiên thử, cấu hình cảm biến và version thuật toán."
            - region "Bảng dữ liệu có thể cuộn ngang" [ref=f1e1411]:
              - table [ref=f1e1412]:
                - rowgroup [ref=f1e1413]:
                  - row [ref=f1e1414]:
                    - columnheader "Chỉ số" [ref=f1e1415]
                    - columnheader "Cách tính/ghi nhận" [ref=f1e1416]
                - rowgroup [ref=f1e1417]:
                  - row [ref=f1e1418]:
                    - cell "Precision" [ref=f1e1419]
                    - cell [ref=f1e1420]:
                      - code [ref=f1e1421]: TP / (TP + FP)
                      - text: ; không xác định khi mẫu số bằng 0
                  - row [ref=f1e1422]:
                    - cell "Recall" [ref=f1e1423]
                    - cell [ref=f1e1424]:
                      - code [ref=f1e1425]: TP / (TP + FN)
                      - text: ; không xác định khi mẫu số bằng 0
                  - row [ref=f1e1426]:
                    - cell "F1" [ref=f1e1427]
                    - cell [ref=f1e1428]:
                      - code [ref=f1e1429]: 2 * precision * recall / (precision + recall)
                      - text: khi xác định
                  - row [ref=f1e1430]:
                    - cell "Báo nhầm theo thời gian" [ref=f1e1431]
                    - cell "Số cảnh báo giả / giờ theo dõi hợp lệ trong các hoạt động thường ngày" [ref=f1e1432]
                  - row [ref=f1e1433]:
                    - cell "Độ trễ" [ref=f1e1434]
                    - cell "Từ mốc sự kiện đã gán nhãn đến candidate và confirmed; báo riêng cửa sổ hủy" [ref=f1e1435]
                  - row [ref=f1e1436]:
                    - cell "Mất dữ liệu" [ref=f1e1437]
                    - cell "Thời gian hoặc mẫu thiếu / lượng kỳ vọng theo cấu hình" [ref=f1e1438]
            - paragraph [ref=f1e1439]: Không chỉ dùng accuracy khi dữ liệu không ngã chiếm phần lớn. Nếu dùng dataset công khai, ghi giấy phép, thiết bị/vị trí thu và khác biệt với prototype. Chia train/tune/test theo người hoặc phiên, không để các cửa sổ gần nhau rơi vào cả train và test. Giữ tập test không dùng để chọn ngưỡng.
            - paragraph [ref=f1e1440]: Tập hoạt động âm tính nên có ngồi xuống nhanh, nằm xuống, đi bộ, vung tay, tháo thiết bị và thiết bị rơi khỏi bàn. Mô phỏng bằng vật thay thế cần báo riêng; không gộp với thử trên người để tăng số liệu. Chưa có quy mô mẫu/đích accuracy được chốt.
            - heading "Đánh giá nhịp tim và bước chân" [level=3] [ref=f1e1441]
            - paragraph [ref=f1e1442]: "Nhịp tim: căn chỉnh thời gian với thiết bị tham chiếu, ghi nguồn/giới hạn tham chiếu, MAE trên cặp mẫu hợp lệ, phân bố sai số và tỷ lệ không có phép đo. Không loại im lặng các đoạn nhiễu để tạo kết quả đẹp; báo riêng nghỉ/vận động và điều kiện tiếp xúc."
            - paragraph [ref=f1e1443]: "Bước chân: dùng số bước đếm thủ công/nguồn tham chiếu của từng phiên, so chênh lệch tuyệt đối/tương đối theo hoạt động và vị trí đeo. Phiên có bước tham chiếu bằng 0 không dùng phần trăm chia cho 0; báo số đếm nhầm."
            - paragraph [ref=f1e1444]: "Pin: ghi cấu hình đo, chu kỳ gửi, RSSI/điều kiện mạng, dung lượng sử dụng và hoạt động cảnh báo. Thời lượng ước tính không thay phép đo chạy thực tế."
            - heading "Biểu mẫu bằng chứng tối thiểu" [level=3] [ref=f1e1445]
            - paragraph [ref=f1e1446]: "Mỗi lần thử ghi: mã lần thử, mục đích, phiên bản code/config, phần cứng/vị trí đeo, dữ liệu đầu vào và quyền dùng, bước thực hiện, kết quả kỳ vọng/thực tế, số mẫu/thời lượng, lỗi/giới hạn và đường dẫn artifact. Dùng ID ẩn danh; raw data ở vùng local đã loại khỏi Git."
            - paragraph [ref=f1e1447]: Kết luận báo cáo phải kèm điều kiện thử. Không suy rộng từ một demo vài phút sang độ tin cậy trong gia đình hoặc khả năng chẩn đoán.
