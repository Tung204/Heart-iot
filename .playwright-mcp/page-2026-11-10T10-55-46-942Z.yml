            - paragraph [ref=f1e840]:
              - text: Server bổ sung
              - code [ref=f1e841]: received_at
              - text: ","
              - code [ref=f1e842]: assignment_id
              - text: và cờ dữ liệu trễ. Firmware không được tự khai người được theo dõi. Khi không đủ bằng chứng để gán dữ liệu vào lịch sử assignment, giữ bản tin ở vùng cách ly; không tự gán vào chủ hiện tại.
            - paragraph [ref=f1e843]: Tổng bước theo ngày được tính từ delta trong từng boot và gán vào khoảng có thời gian tin cậy. Lần nhận đầu của boot sau một đoạn mất dữ liệu có thể không phân bổ chính xác theo ngày; đánh dấu chưa đủ dữ liệu thay vì cộng toàn bộ vào ngày nhận. Khi counter giảm trong cùng boot, ghi lỗi dữ liệu. Ngày hiển thị theo timezone hồ sơ; lưu timestamp UTC.
            - heading "Topic và giao nhận MQTT" [level=3] [ref=f1e844]
            - region "Bảng dữ liệu có thể cuộn ngang" [ref=f1e845]:
              - table [ref=f1e846]:
                - rowgroup [ref=f1e847]:
                  - row [ref=f1e848]:
                    - columnheader "Topic" [ref=f1e849]
                    - columnheader "Hướng" [ref=f1e850]
                    - columnheader "Payload/chính sách" [ref=f1e851]
                - rowgroup [ref=f1e852]:
                  - row [ref=f1e853]:
                    - cell [ref=f1e854]:
                      - code [ref=f1e855]: "v1/devices/{device_id}/telemetry"
                    - cell "Thiết bị → backend" [ref=f1e856]
                    - cell "Envelope telemetry; QoS 1 đề xuất, có thể tổng hợp mẫu để giảm băng thông" [ref=f1e857]
                  - row [ref=f1e858]:
                    - cell [ref=f1e859]:
                      - code [ref=f1e860]: "v1/devices/{device_id}/events"
                    - cell "Thiết bị → backend" [ref=f1e861]
                    - cell [ref=f1e862]:
                      - code [ref=f1e863]: fall.candidate
                      - text: ","
                      - code [ref=f1e864]: fall.cancelled
                      - text: ","
                      - code [ref=f1e865]: fall.confirmed
                      - text: ","
                      - code [ref=f1e866]: user.cancel_requested
                      - text: ","
                      - code [ref=f1e867]: sos.confirmed
                      - text: ; QoS 1
                  - row [ref=f1e868]:
                    - cell [ref=f1e869]:
                      - code [ref=f1e870]: "v1/devices/{device_id}/status"
                    - cell "Thiết bị/broker → backend" [ref=f1e871]
                    - cell "Presence/heartbeat gồm boot_id, uptime, firmware, pin nếu có; LWT chỉ là gợi ý mất kết nối" [ref=f1e872]
                  - row [ref=f1e873]:
                    - cell [ref=f1e874]:
                      - code [ref=f1e875]: "v1/devices/{device_id}/acks"
                    - cell "Backend → thiết bị" [ref=f1e876]
                    - cell "ACK ứng dụng cho sự kiện quan trọng sau commit" [ref=f1e877]
            - paragraph [ref=f1e878]: "Không retain telemetry hoặc sự kiện té ngã: subscriber mới không được hiểu một sự kiện cũ là mới. Có thể retain presence, nhưng phải kiểm thời gian nhận. Topic status dùng cùng envelope định danh khi do thiết bị gửi; LWT do broker gửi phải được nhận diện riêng và không đưa vào bảng dữ liệu đo."
            - paragraph [ref=f1e879]:
              - text: ACL buộc
              - code [ref=f1e880]: device_id
              - text: trong topic và payload khớp định danh đã cấp. Subscriber backend không tin một device_id chỉ vì JSON hợp lệ. Certificate/credential provisioning và rotation được chọn khi dựng broker; không dùng chung một tài khoản thiết bị cho mọi board.
            - heading "Incident và ACK" [level=3] [ref=f1e881]
            - paragraph [ref=f1e882]:
              - text: Sự kiện dùng envelope như telemetry, thay
              - code [ref=f1e883]: metrics
              - text: bằng
              - code [ref=f1e884]: incident_id
              - text: ","
              - code [ref=f1e885]: event_revision
              - text: ","
              - code [ref=f1e886]: event_type
              - text: và
              - code [ref=f1e887]: evidence
              - text: .
              - code [ref=f1e888]: event_revision
              - text: bắt đầu 1 ở candidate, tăng theo từng thay đổi của incident và cần phục hồi được sau reboot nếu incident còn mở.
              - code [ref=f1e889]: fall.confirmed
              - text: phải mang đủ dữ liệu để xử lý khi candidate chưa đến.
            - paragraph [ref=f1e890]:
              - code [ref=f1e891]: evidence.algorithm_version
              - text: ", vị trí đeo và cờ chất lượng giúp giải thích nguyên nhân; không gọi một điểm heuristic là “xác suất té ngã” nếu chưa hiệu chuẩn."
            - paragraph [ref=f1e892]:
              - text: ACK gồm
              - code [ref=f1e893]: source_message_id
              - text: ","
              - code [ref=f1e894]: incident_id
              - text: ","
              - code [ref=f1e895]: accepted_revision
              - text: ","
              - code [ref=f1e896]: status
              - text: ","
              - code [ref=f1e897]: received_at
              - text: .
              - code [ref=f1e898]: accepted
              - text: nghĩa server đã ghi bền;
              - code [ref=f1e899]: duplicate
              - text: nghĩa bản tin giống hệt đã được ghi.
              - code [ref=f1e900]: rejected
              - text: kèm mã lý do để không retry vô hạn. Thiết bị chỉ xóa sự kiện khỏi hàng đợi sau ACK accepted/duplicate đúng định danh; bản tin bị reject chuyển vùng lỗi hữu hạn để kiểm tra.
            - paragraph [ref=f1e901]:
              - text: Nếu revision mới tới trước revision cũ, server lưu lịch sử và áp dụng transition hợp lệ theo revision mới; bản cũ tới sau không làm lùi trạng thái. Hai payload khác nhau cùng revision là lỗi giao thức cần audit. Chuyển
              - code [ref=f1e902]: cancelled
              - text: sang
              - code [ref=f1e903]: open
              - text: bằng dữ liệu cũ bị cấm.
            - heading "API dự kiến" [level=3] [ref=f1e904]
            - paragraph [ref=f1e905]:
              - text: Prefix
              - code [ref=f1e906]: /api/v1
              - text: ; đây là inventory thiết kế, chưa có endpoint chạy.
