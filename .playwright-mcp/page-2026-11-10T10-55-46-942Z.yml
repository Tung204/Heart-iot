          - generic [ref=f1e129]:
            - heading "Bài toán" [level=3] [ref=f1e130]
            - paragraph [ref=f1e131]: Người thân cần biết người cao tuổi có đang đeo thiết bị, dữ liệu có còn mới và một cảnh báo đã có ai xử lý hay chưa. Chỉ hiển thị số nhịp tim và gửi thông báo chưa giải quyết được việc mất kết nối, báo động giả hoặc không ai nhận trách nhiệm.
            - paragraph [ref=f1e132]:
              - strong [ref=f1e133]: "Hướng đề xuất:"
              - text: một hệ thống theo dõi tại nhà, lấy vòng đời cảnh báo và chất lượng dữ liệu làm trung tâm. Thiết bị ghi nhận nhịp tim, vận động và dấu hiệu nghi té ngã; người dùng có thể hủy báo nhầm; người thân xem tình trạng và xác nhận đang hỗ trợ. AI giúp đọc dữ liệu đã ghi nhận.
            - paragraph [ref=f1e134]: Đối tượng đầu tiên là một người được theo dõi và một số người thân được cấp quyền. Đây là phạm vi prototype học thuật; số người dùng thực tế và mô hình triển khai cần xác định sau.
            - heading "Nguồn yêu cầu và phần phát triển thêm" [level=3] [ref=f1e135]
            - paragraph [ref=f1e136]: "Đề cương gốc yêu cầu IoT, nhịp tim, bước chân/mức vận động, phát hiện té ngã, web/app có tài khoản, chia sẻ người thân, admin và trợ lý AI. Bản này bổ sung đề xuất: trạng thái dữ liệu cũ, quyền chia sẻ có thể thu hồi, xác nhận xử lý cảnh báo, chống gửi trùng, simulator và phép đo đánh giá."
            - paragraph [ref=f1e137]: Không tự bổ sung SpO₂, huyết áp, ECG, GPS, gọi cấp cứu tự động hoặc ứng dụng native vào MVP. Nếu cần thêm, phải xem tác động đến cảm biến, nguồn, dữ liệu và thời gian.
            - heading "So sánh hướng sản phẩm" [level=3] [ref=f1e138]
            - region "Bảng dữ liệu có thể cuộn ngang" [ref=f1e139]:
              - table [ref=f1e140]:
                - rowgroup [ref=f1e141]:
                  - row [ref=f1e142]:
                    - columnheader "Hướng" [ref=f1e143]
                    - columnheader "Giá trị" [ref=f1e144]
                    - columnheader "Khó khăn cần chứng minh" [ref=f1e145]
                    - columnheader "Đánh giá cho đồ án" [ref=f1e146]
                - rowgroup [ref=f1e147]:
                  - row [ref=f1e148]:
                    - cell "Một thiết bị đeo cổ tay + Wi-Fi + web" [ref=f1e149]
                    - cell "Ít thành phần, dễ thao tác, có thể đo PPG tại vị trí đeo" [ref=f1e150]
                    - cell "Nhiễu vận động; cử động tay dễ tạo báo ngã giả; tiêu thụ pin Wi-Fi" [ref=f1e151]
                    - cell "Ứng viên khảo sát, chưa chốt hình dạng" [ref=f1e152]
                  - row [ref=f1e153]:
                    - cell "IMU đeo thân/thắt lưng + đo nhịp tim theo phiên" [ref=f1e154]
                    - cell "Tách bài toán chuyển động và đo quang học; dễ so sánh vị trí" [ref=f1e155]
                    - cell "Hai thao tác/thiết bị; không được mô tả là đo nhịp tim liên tục" [ref=f1e156]
                    - cell "Phương án dự phòng có thể kiểm chứng trên bàn" [ref=f1e157]
                  - row [ref=f1e158]:
                    - cell "BLE qua điện thoại hoặc thiết bị có kết nối di động" [ref=f1e159]
                    - cell "Có khả năng theo dõi ngoài nhà" [ref=f1e160]
                    - cell "Gateway, ứng dụng nền, vùng phủ, SIM và pin" [ref=f1e161]
                    - cell "Mở rộng sau prototype Wi-Fi" [ref=f1e162]
            - paragraph [ref=f1e163]:
              - text: Đề xuất bắt đầu bằng
              - strong [ref=f1e164]: prototype trên bàn, rồi khảo sát vị trí đeo
              - text: . Một MAX30102 gắn trên mạch thử không chứng minh được nhịp tim ổn định khi đeo và đi lại. Thuật toán IMU được thử ở thắt lưng cũng không mặc nhiên đúng cho cổ tay.
            - heading "Ý tưởng tạo khác biệt có thể đánh giá" [level=3] [ref=f1e165]
            - list [ref=f1e166]:
              - listitem [ref=f1e167]:
                - strong [ref=f1e168]: "Cảnh báo có vòng đời:"
                - text: nghi ngã → cửa sổ hủy → xác nhận từ thiết bị → gửi cảnh báo → người thân xác nhận → kết thúc có lý do. Có lịch sử thao tác và thông báo tới muộn.
              - listitem [ref=f1e169]:
                - strong [ref=f1e170]: "Dữ liệu biết chất lượng:"
                - text: hiển thị rõ
                - code [ref=f1e171]: valid
                - text: ","
                - code [ref=f1e172]: poor_signal
                - text: ","
                - code [ref=f1e173]: not_worn
                - text: ", dữ liệu cũ và thiết bị offline. Không vẽ tiếp một đường đo như thể vẫn đang nhận dữ liệu."
              - listitem [ref=f1e174]:
                - strong [ref=f1e175]: "AI có bằng chứng:"
                - text: mỗi tóm tắt chỉ rõ khoảng dữ liệu và phần bị thiếu; giải thích kiến thức chung phải có nguồn đã duyệt. Không để AI tự quyết định có gửi cảnh báo hay không.
            - heading "Kịch bản demo đề xuất" [level=3] [ref=f1e176]
            - paragraph [ref=f1e177]: Người thân được mời vào hồ sơ theo dõi và xem dữ liệu tổng hợp từ simulator. Một sự kiện nghi ngã xuất hiện; lần đầu được hủy trên thiết bị giả lập, lần sau hết cửa sổ hủy và tạo cảnh báo. Người thân nhận cảnh báo trên dashboard, xác nhận đang xử lý, rồi đóng với kết quả “báo nhầm” hoặc “đã hỗ trợ”.
            - paragraph [ref=f1e178]: Sau đó mô phỏng mất mạng, gửi lại cùng sự kiện, thu hồi quyền chia sẻ và một ngày thiếu dữ liệu. Hệ thống phải giữ đúng số cảnh báo, chặn quyền đã thu hồi, và AI nói rõ dữ liệu thiếu. Khi thay simulator bằng phần cứng, giữ nguyên hợp đồng dữ liệu.
            - heading "Giới hạn đã biết" [level=3] [ref=f1e179]
            - paragraph [ref=f1e180]: Wi-Fi chỉ phục vụ vùng có mạng đã cấu hình. Cảnh báo tại chỗ có thể hoạt động khi mất mạng, nhưng báo từ xa cần đường truyền. Nhịp tim là dữ liệu cảm biến cần đối chiếu, không phải chẩn đoán. Chưa có ngân sách, thời lượng pin, độ chính xác hoặc biểu mẫu trường để cam kết.
