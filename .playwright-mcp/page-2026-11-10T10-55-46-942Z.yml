              - text: danh sách ứng viên và phương án thử. Chưa xác nhận đã sở hữu linh kiện, sơ đồ chân, giá mua, điện áp module hoặc độ chính xác.
            - heading "Phương án khảo sát" [level=3] [ref=f1e1011]
            - region "Bảng dữ liệu có thể cuộn ngang" [ref=f1e1012]:
