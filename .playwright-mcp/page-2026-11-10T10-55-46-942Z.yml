                    - cell "Câu hỏi và đoạn tài liệu đã duyệt" [ref=f1e1259]
                    - cell "Giải thích chung có nguồn; từ chối khi không đủ căn cứ" [ref=f1e1260]
                    - cell "Có danh mục tài liệu, quyền sử dụng và bộ đánh giá" [ref=f1e1261]
                  - row [ref=f1e1262]:
                    - cell "Gợi ý nguyên nhân/biện pháp trong đề cương" [ref=f1e1263]
                    - cell "Bối cảnh được phép và nguồn y tế phù hợp" [ref=f1e1264]
                    - cell "Chỉ khả năng chung được dẫn nguồn, không kết luận bệnh" [ref=f1e1265]
                    - cell "Chưa đủ nguồn/đánh giá nên chưa đưa vào MVP" [ref=f1e1266]
            - paragraph [ref=f1e1267]: MVP vẫn có thành phần AI, nhưng bắt đầu bằng việc tóm tắt có thể đối chiếu. Chưa chọn nhà cung cấp, chưa có corpus y tế được duyệt và chưa có bằng chứng chất lượng trả lời.
            - heading "Luồng dữ liệu" [level=3] [ref=f1e1268]
            - list [ref=f1e1269]:
              - listitem [ref=f1e1270]: Backend xác thực người yêu cầu và quyền trên hồ sơ/khoảng thời gian.
              - listitem [ref=f1e1271]: "Code truy vấn và tính aggregate: số mẫu hợp lệ, coverage theo cấu hình thu, khoảng bị thiếu, min/max/trung bình trên mẫu hợp lệ và incident."
              - listitem [ref=f1e1272]: Bộ lọc tạo đầu vào tối thiểu, bỏ tên, số điện thoại, credential và thông tin không phục vụ câu hỏi.
              - listitem [ref=f1e1273]: Adapter gọi model hoặc trả tóm tắt theo mẫu khi AI tắt/lỗi. Model không tự chạy SQL, truy cập broker hoặc gửi thông báo.
              - listitem [ref=f1e1274]: Validator kiểm cấu trúc, tham chiếu nguồn, khoảng thời gian và các số liệu được trích. Không đạt thì trả fallback hoặc yêu cầu diễn đạt lại có giới hạn.
              - listitem [ref=f1e1275]: Kiểm lại quyền trước khi trả/lưu kết quả; thao tác thu hồi quyền trong lúc sinh không được làm rò dữ liệu.
            - paragraph [ref=f1e1276]:
              - text: Đầu ra dự thảo gồm
              - code [ref=f1e1277]: summary
              - text: ","
              - code [ref=f1e1278]: period
              - text: ","
              - code [ref=f1e1279]: data_refs
              - text: ","
              - code [ref=f1e1280]: coverage
              - text: ","
              - code [ref=f1e1281]: missing_data
              - text: ","
              - code [ref=f1e1282]: source_refs
              - text: ","
              - code [ref=f1e1283]: limitations
              - text: .
              - code [ref=f1e1284]: data_refs
              - text: tham chiếu aggregate thật;
              - code [ref=f1e1285]: source_refs
              - text: chỉ dùng các tài liệu đã tra được. Dẫn nguồn không tự chứng minh nội dung suy luận đúng.
            - heading "Quy tắc nội dung" [level=3] [ref=f1e1286]
            - list [ref=f1e1287]:
              - listitem [ref=f1e1288]: Không suy luận “sức khỏe bình thường” từ việc không có sự kiện hoặc từ thời gian thiết bị offline.
              - listitem [ref=f1e1289]: Không biến ít dữ liệu thành kết luận tăng/giảm vận động; nêu giới hạn khi so sánh hai ngày có độ phủ khác nhau.
              - listitem [ref=f1e1290]: Không tự đề xuất thuốc, liều dùng hoặc kết luận bệnh từ BPM/cảnh báo ngã.
              - listitem [ref=f1e1291]: Khi câu hỏi về tình huống cần hỗ trợ ngay, ưu tiên hướng dẫn liên hệ người hỗ trợ/chuyên môn phù hợp; không trì hoãn hành động để chờ AI.
              - listitem [ref=f1e1292]: Nội dung tài liệu và lời người dùng là dữ liệu, không được ghi đè quyền truy cập hoặc chỉ dẫn hệ thống. Kiểm prompt injection trong tài liệu được truy hồi.
              - listitem [ref=f1e1293]: Không huấn luyện lại hoặc gửi dữ liệu sức khỏe thật sang dịch vụ bên ngoài mặc định; phải xác định cơ sở đồng ý và chính sách lưu dữ liệu trước.
            - heading "Chuẩn bị nguồn" [level=3] [ref=f1e1294]
            - paragraph [ref=f1e1295]: Mỗi nguồn kiến thức cần URL/tài liệu gốc, tổ chức/tác giả, ngày xuất bản/cập nhật, ngày truy cập, quyền sử dụng, chủ đề, đoạn được dùng và người/cách kiểm. Đề xuất tìm ở tổ chức y tế có thẩm quyền, hướng dẫn chuyên môn và bài nghiên cứu được đánh giá; chưa xem một URL chưa đọc là nguồn đã xác minh.
            - paragraph [ref=f1e1296]: Chưa cần vector database ở bản đầu. Bắt đầu bằng tập tài liệu nhỏ được duyệt và truy xuất có kiểm soát; chỉ thêm tìm kiếm ngữ nghĩa khi có bài toán và phép đo cần thiết.
            - heading "Đánh giá đề xuất" [level=3] [ref=f1e1297]
            - paragraph [ref=f1e1298]: "Chuẩn bị bộ tình huống tổng hợp với đáp án/tiêu chí trước khi chạy: ngày đủ dữ liệu, thiếu 80% thời gian, chỉ số không hợp lệ, thay đổi timezone, một incident trùng, câu hỏi ngoài phạm vi, yêu cầu dữ liệu người khác, nguồn không có câu trả lời và prompt injection."
            - paragraph [ref=f1e1299]: Chấm riêng tính đúng số liệu, đúng người/khoảng dữ liệu, khả năng nhận biết thiếu dữ liệu, độ đúng của dẫn nguồn, mức suy diễn vượt bằng chứng, độ trễ và chi phí mỗi lượt. Không chỉ chấm “nghe hợp lý”. Một số lỗi như lộ dữ liệu hồ sơ khác hoặc bịa số đo là lỗi chặn sử dụng, dù điểm trung bình cao.
            - paragraph [ref=f1e1300]:
              - text: Kết quả lưu model/version, prompt/config version, tập tình huống và điều kiện; chưa có kết quả ở thời điểm soạn. Xem
              - link "kiểm thử và đánh giá" [ref=f1e1301] [cursor=pointer]:
                - /url: "#kiem-thu"
              - text: .
