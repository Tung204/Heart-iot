            - heading "Khung thư mục" [level=3] [ref=f1e1877]
            - code [ref=f1e1879]: "DATN/ ├── apps/ │ ├── web/ # Web responsive cho người dùng, người thân, admin │ └── api/ # Backend nghiệp vụ, tiếp nhận dữ liệu, cảnh báo ├── firmware/ # Chương trình trên thiết bị IoT ├── hardware/ # BOM, sơ đồ mạch, kết quả khảo sát cơ khí/nguồn ├── packages/contracts/ # Hợp đồng dữ liệu và payload minh họa ├── infra/ # Cấu hình môi trường và triển khai dự kiến ├── tools/simulator/ # Công cụ mô phỏng thiết bị dự kiến ├── tests/ # Quy ước và kịch bản kiểm thử liên thành phần ├── data/ # Quy ước dữ liệu mẫu/thử nghiệm ├── reports/ # Báo cáo, hình, tài liệu bảo vệ └── docs/ # Nguồn chính của thiết kế kỹ thuật"
            - paragraph [ref=f1e1880]:
              - text: Các thư mục hiện có README nêu trách nhiệm và điều kiện bắt đầu. Payload trong
              - code [ref=f1e1881]: packages/contracts/examples/
              - text: là dữ liệu tổng hợp để trao đổi thiết kế; chưa phải bộ dữ liệu đo. Chưa tạo package manifest, lockfile hay lệnh chạy giả khi framework/version chưa được chốt.
            - heading "Hướng đề xuất" [level=3] [ref=f1e1882]
            - list [ref=f1e1883]:
              - listitem [ref=f1e1884]: Prototype tại nhà dùng Wi-Fi; web responsive là giao diện đầu tiên.
              - listitem [ref=f1e1885]: Kiểm chứng vị trí đeo, IMU và tín hiệu nhịp tim trước khi chốt vỏ thiết bị.
              - listitem [ref=f1e1886]: Backend dạng modular monolith, database quan hệ, giao tiếp thiết bị có định danh và chống xử lý trùng.
              - listitem [ref=f1e1887]: Cảnh báo hoạt động độc lập với AI. AI bắt đầu từ tóm tắt dữ liệu có nguồn và có thể tắt.
              - listitem [ref=f1e1888]: Bản demo đầu tiên dùng dữ liệu mô phỏng, thể hiện đủ mất mạng, báo nhầm và xác nhận cảnh báo.
