              - text: ; secret ở môi trường thực thi, file mẫu chỉ chứa tên biến và giá trị vô hại. Chốt runtime/package manager/version trước khi thêm manifest và lockfile. Nêu rõ cổng, TLS, broker ACL, migration và rollback trong hướng dẫn triển khai thực tế.
            - paragraph [ref=f1e1525]: "Quan sát tối thiểu: last_seen thiết bị, số bản tin nhận/từ chối/trùng, sự kiện cách ly, tuổi notification outbox, số lần gửi lỗi, độ trễ xử lý, lỗi AI. Log dùng ID tham chiếu, không dump toàn bộ dữ liệu sức khỏe hoặc secret."
            - paragraph [ref=f1e1526]: "Trước dữ liệu thật: thử backup/restore, thu hồi quyền và credential, migration với backup, giới hạn retention/xóa, khôi phục worker và hành vi khi DB/broker lỗi. Bản backup phải được bảo vệ và có vòng đời; không đặt cạnh code để đồng bộ công khai."
