            - paragraph [ref=f7e2198]: "Phạm vi: README, tài liệu thiết kế, ADR, trách nhiệm các thư mục và ba payload mẫu. Dự án chưa có ứng dụng, firmware hoặc simulator chạy được. Các phát hiện là thiếu sót/mâu thuẫn của thiết kế, không phải lỗi runtime đã tái hiện. P1 cần giải quyết trước khi triển khai luồng liên quan; P2 cần làm rõ để các thành phần thực hiện thống nhất. Mức độ này thuộc báo cáo review, không thay thứ tự P0/P1 của phạm vi sản phẩm hoặc kế hoạch gốc."
            - 'heading "R-01 — P1: Thông báo chờ gửi chưa bị vô hiệu hóa khi incident đã đóng" [level=3] [ref=f7e2199]'
            - paragraph [ref=f7e2200]:
              - strong [ref=f7e2201]: "Vị trí:"
              - link "kiến trúc" [ref=f7e2202] [cursor=pointer]:
