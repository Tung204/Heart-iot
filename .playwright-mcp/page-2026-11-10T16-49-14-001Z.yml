                    - cell "Có yêu cầu, impact analysis, diff, kiểm thử, review và quyền phát hành riêng" [ref=f7e1894]
                  - row [ref=f7e1895]:
                    - cell "Cơ chế auth, cách ly tenant, secrets, luật bảo vệ cốt lõi" [ref=f7e1896]
