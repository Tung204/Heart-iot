                  - row [ref=f7e1272]:
                    - cell "Baseline không dùng LLM" [ref=f7e1273]
                    - cell "Thống kê xác định bằng code" [ref=f7e1274]
                    - cell "Tóm tắt theo mẫu và cảnh báo thiếu dữ liệu" [ref=f7e1275]
                    - cell "Có thể làm ngay khi có aggregate đúng" [ref=f7e1276]
                  - row [ref=f7e1277]:
                    - cell "MVP AI giới hạn" [ref=f7e1278]
                    - cell "Aggregate đã kiểm quyền, chất lượng/coverage, khoảng thời gian" [ref=f7e1279]
