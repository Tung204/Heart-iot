            - paragraph [ref=f7e2038]: Đo tỷ lệ hoàn thành nhiệm vụ, số lần cần người can thiệp, bước/thời gian thủ công so với AI, độ trễ, chi phí, lỗi quyền và tác động lặp. Xác định bộ tình huống trước khi đo, dùng trường hợp chưa có trong prompt demo; không đặt con số thành tích hoặc hứa điểm số khi chưa có dữ liệu/rubric.
            - heading "Những quyết định còn cần chốt" [level=3] [ref=f7e2039]
            - list [ref=f7e2040]:
              - listitem [ref=f7e2041]: Phê chuẩn ranh giới AI runtime/coding ở trên; có đưa sinh code module vào đồ án hay chỉ mở rộng bằng cấu hình.
              - listitem [ref=f7e2042]: Ý nghĩa workspace/tenant, đối tượng người dùng và ma trận quyền thực tế; ai duyệt giao diện dùng chung.
              - listitem [ref=f7e2043]: Phạm vi tự chạy, loại hành động phải duyệt, khả năng hoàn tác và giới hạn chi phí.
              - listitem [ref=f7e2044]: Rubric, nhóm, thời hạn, phần cứng và ngân sách; từ đó chốt mức nền tảng và stack cụ thể.
            - paragraph [ref=f7e2045]:
              - text: Không cần đủ mọi thông tin để tiếp tục khảo sát tài liệu, nhưng chưa được điền các lựa chọn còn thiếu vào code như quyết định đã duyệt. Bốn phát hiện trong
              - link "review v0.1" [ref=f7e2046] [cursor=pointer]:
                - /url: "#review"
              - text: vẫn chưa được giải quyết bởi tài liệu định hướng này.
