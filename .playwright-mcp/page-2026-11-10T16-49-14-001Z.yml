            - paragraph [ref=f7e1936]:
              - text: "Đề xuất vòng đời cấu hình:"
              - strong [ref=f7e1937]: nháp → kiểm hợp lệ → xem trước/chạy thử → chấp nhận theo chính sách → kích hoạt → theo dõi
              - text: . Lưu phiên bản nền, nội dung thay đổi, người yêu cầu, phạm vi, người duyệt nếu có và phiên bản đang áp dụng. Thay nội dung sau khi duyệt thì bản duyệt cũ không còn hiệu lực cho nội dung mới.
            - paragraph [ref=f7e1938]: Mỗi lần chạy gắn với phiên bản workflow/tool phù hợp để giải thích và phục hồi. Quyền truy cập phải kiểm lại theo trạng thái hiện tại trước từng tác động và trước giao kết quả; version cũ không được giữ lại quyền đã bị thu hồi. Cấu hình thay đổi không được âm thầm đổi cách xử lý một tác vụ đang chạy.
            - paragraph [ref=f7e1939]: Các hằng số giao thức, thuật toán đã kiểm thử và bất biến bảo mật có thể nằm trong code. “Không hard-code” ở đây là không đóng cứng dữ liệu khách hàng, tên hồ sơ, kết quả báo cáo hay quy trình cần thay đổi vào code/prompt để demo. Một manifest mới chỉ kết hợp những khả năng engine đã hỗ trợ; nó không tự tạo ra một integration hoặc thuật toán chưa tồn tại.
            - heading "Tự chủ mà vẫn biết lúc thiếu thông tin" [level=3] [ref=f7e1940]
            - paragraph [ref=f7e1941]:
              - text: Đề xuất người dùng giao
              - strong [ref=f7e1942]: mục tiêu kèm phạm vi ủy quyền
              - text: ": đối tượng, tool được phép, thời hạn, lịch chạy, hạn mức tác động/chi phí, điều kiện dừng và hành động cần duyệt. Với quy trình đã được ủy quyền, AI tự làm các bước hợp lệ mà không hỏi lại từng thao tác. Có thể thu hồi nhiệm vụ và quyền; nút dừng ngăn bước tiếp theo, không mặc định đảo ngược tác động đã xảy ra."
            - paragraph [ref=f7e1943]: "Ví dụ tổng hợp: “Theo dõi các thiết bị được giao, tạo công việc kiểm tra khi mất tín hiệu theo chính sách đã cấu hình và chuẩn bị báo cáo hằng ngày.” AI có thể tìm thiết bị, kiểm lại tình trạng, tạo công việc tránh trùng, cập nhật báo cáo và ghi lịch sử. Quy trình xác định được chạy bằng scheduler/event handler; không cần gọi model cho từng mẫu cảm biến. Model hỗ trợ lập kế hoạch, phân tích và xử lý ngoại lệ trong phạm vi tool."
            - paragraph [ref=f7e1944]: Thiếu ngưỡng đã được chấp thuận, không rõ hồ sơ nào, hoặc có nhiều bản ghi cùng tên thì AI tìm thêm bằng chứng hoặc yêu cầu làm rõ phần đó. Nó có thể tiếp tục phần độc lập nhưng không tự bịa giá trị rồi ghi dữ liệu. Tool không tồn tại thì báo giới hạn và tạo đề xuất mở rộng, không giả báo thành công.
            - paragraph [ref=f7e1945]: Đường cảnh báo té ngã tiếp tục hoạt động khi model lỗi hoặc không có AI. Không dùng sự tự chủ của Agent để thay quyền của người thân hoặc tự kết luận người được theo dõi đã an toàn.
            - heading "Preview frontend phải kiểm được gì" [level=3] [ref=f7e1946]
            - paragraph [ref=f7e1947]:
              - text: Yêu cầu người dùng là
              - strong [ref=f7e1948]: xem trước và chấp nhận trước khi áp dụng
              - text: ". Cơ chế hiện thực đề xuất:"
            - list [ref=f7e1949]:
              - listitem [ref=f7e1950]: Tạo bản nháp có ID/version, diff với bản hiện tại và phạm vi cá nhân/workspace/toàn hệ thống.
              - listitem [ref=f7e1951]: "Hiển thị preview có thể tương tác: layout, dữ liệu mẫu có nhãn hoặc dữ liệu được phép, trạng thái rỗng/lỗi và màn hình nhỏ. Những nút trong preview không được âm thầm ghi vào dữ liệu thật."
              - listitem [ref=f7e1952]: Kiểm schema, component/data source được phép và quyền; ẩn nút không thay kiểm quyền backend.
              - listitem [ref=f7e1953]: Người có quyền chấp nhận đúng phiên bản. Ghi nhận phiên bản nền để phát hiện có người đã sửa trong lúc xem trước.
              - listitem [ref=f7e1954]: Áp dụng phiên bản được duyệt, đồng bộ giao diện; cung cấp cách trở lại cấu hình trước nếu tương thích.
            - paragraph [ref=f7e1955]: Bảng/biểu đồ trả về trong AI Canvas là kết quả tạm của yêu cầu, không tự được lưu thành trang chính thức. Nếu có thao tác “Lưu thành dashboard/trang”, phải đi qua preview và chấp nhận. Cần chốt cụ thể ai duyệt giao diện cá nhân và ai duyệt giao diện dùng chung.
            - heading "Các lựa chọn kỹ thuật để chốt có căn cứ" [level=3] [ref=f7e1956]
            - paragraph [ref=f7e1957]:
              - text: Đây là
              - strong [ref=f7e1958]: đề xuất có nguồn
              - text: ", chưa phải quyết định chốt framework/version. Nguồn chính thức và giới hạn được ghi ở"
              - link "chương 10" [ref=f7e1959] [cursor=pointer]:
                - /url: "#nguon"
              - text: .
