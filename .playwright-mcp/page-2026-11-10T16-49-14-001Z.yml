            - paragraph [ref=f7e1548]:
              - text: Khi có code, cấu hình local sẽ được đặt trong
              - code [ref=f7e1549]: infra
              - text: ; secret ở môi trường thực thi, file mẫu chỉ chứa tên biến và giá trị vô hại. Chốt runtime/package manager/version trước khi thêm manifest và lockfile. Nêu rõ cổng, TLS, broker ACL, migration và rollback trong hướng dẫn triển khai thực tế.
            - paragraph [ref=f7e1550]: "Quan sát tối thiểu: last_seen thiết bị, số bản tin nhận/từ chối/trùng, sự kiện cách ly, tuổi notification outbox, số lần gửi lỗi, độ trễ xử lý, lỗi AI. Log dùng ID tham chiếu, không dump toàn bộ dữ liệu sức khỏe hoặc secret."
            - paragraph [ref=f7e1551]: "Trước dữ liệu thật: thử backup/restore, thu hồi quyền và credential, migration với backup, giới hạn retention/xóa, khôi phục worker và hành vi khi DB/broker lỗi. Bản backup phải được bảo vệ và có vòng đời; không đặt cạnh code để đồng bộ công khai."
            - heading "Hồ sơ học thuật đề xuất" [level=3] [ref=f7e1552]
            - paragraph [ref=f7e1553]: "Chưa có yêu cầu chính thức của trường. Cấu trúc tham khảo có thể gồm:"
            - list [ref=f7e1554]:
              - listitem [ref=f7e1555]: Bối cảnh, mục tiêu, phạm vi và phương pháp thực hiện.
              - listitem [ref=f7e1556]: Cơ sở lý thuyết, nghiên cứu/sản phẩm liên quan và nguồn có quyền sử dụng.
              - listitem [ref=f7e1557]: Phân tích yêu cầu, use case, phân quyền và thiết kế hệ thống.
              - listitem [ref=f7e1558]: Thiết kế phần cứng, firmware, phần mềm và hợp đồng dữ liệu.
              - listitem [ref=f7e1559]: Cách tích hợp AI, nguồn dữ liệu và đánh giá đầu ra.
