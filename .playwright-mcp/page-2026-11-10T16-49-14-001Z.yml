            - paragraph [ref=f7e1899]:
              - text: Hai vai trò AI có thể sử dụng cùng model nhưng phải khác credential và đường thực thi.
              - strong [ref=f7e1900]: AI vận hành
              - text: chỉ dùng capability được cấp;
              - strong [ref=f7e1901]: AI hỗ trợ phát triển
              - text: tạo code/tài liệu/bài kiểm thử ở môi trường phát triển. Không chuyển quyền production hoặc credential của developer vào Agent runtime.
            - paragraph [ref=f7e1902]: "Luồng đề xuất khi thật sự cần code mới: yêu cầu → khảo sát/tài liệu/impact map → branch hoặc sandbox → diff và test → review/preview phù hợp → phát hành đúng bản được duyệt → theo dõi. Rollback code không tự phục hồi dữ liệu đã biến đổi; migration cần xét riêng khả năng phục hồi, backup và tương thích với phiên bản cũ."
            - heading "Dynamic / Configurable có ranh giới cụ thể" [level=3] [ref=f7e1903]
