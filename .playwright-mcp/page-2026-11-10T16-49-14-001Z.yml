              - text: . Giá trị
              - code [ref=f7e2518]: demo-*
              - text: ", timestamp và chỉ số đều là minh họa, không phải dữ liệu người thật hoặc kết quả thử."
            - paragraph [ref=f7e2519]: Khi triển khai, viết JSON Schema cho envelope/payload và OpenAPI cho HTTP, chọn một nguồn sinh kiểu dữ liệu thay vì giữ nhiều bản độc lập. Thay đổi phá tương thích phải có version mới và thử firmware cũ trong phạm vi hỗ trợ. Cần chốt giới hạn kích thước, độ dài ID, kiểu số và các enum trước khi dùng validator trong ingest.
