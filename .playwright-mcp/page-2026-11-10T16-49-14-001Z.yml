            - paragraph [ref=f7e1432]: T-13 chỉ chạy khi triển khai Web Push/P1. Các phép kiểm ở bảng là mục tiêu dự kiến; chưa có test executable hoặc kết quả đạt.
            - heading "Đánh giá phát hiện té ngã" [level=3] [ref=f7e1433]
            - paragraph [ref=f7e1434]:
              - text: Xác định đơn vị đánh giá là
              - strong [ref=f7e1435]: sự kiện
              - text: ", không đếm mỗi cửa sổ IMU như một người ngã độc lập. Lưu nhãn và ranh giới thời gian, vị trí đeo, người/phiên thử, cấu hình cảm biến và version thuật toán."
            - region "Bảng dữ liệu có thể cuộn ngang" [ref=f7e1436]:
              - table [ref=f7e1437]:
                - rowgroup [ref=f7e1438]:
                  - row [ref=f7e1439]:
                    - columnheader "Chỉ số" [ref=f7e1440]
                    - columnheader "Cách tính/ghi nhận" [ref=f7e1441]
                - rowgroup [ref=f7e1442]:
                  - row [ref=f7e1443]:
                    - cell "Precision" [ref=f7e1444]
                    - cell [ref=f7e1445]:
                      - code [ref=f7e1446]: TP / (TP + FP)
                      - text: ; không xác định khi mẫu số bằng 0
                  - row [ref=f7e1447]:
                    - cell "Recall" [ref=f7e1448]
                    - cell [ref=f7e1449]:
                      - code [ref=f7e1450]: TP / (TP + FN)
                      - text: ; không xác định khi mẫu số bằng 0
                  - row [ref=f7e1451]:
                    - cell "F1" [ref=f7e1452]
                    - cell [ref=f7e1453]:
                      - code [ref=f7e1454]: 2 * precision * recall / (precision + recall)
                      - text: khi xác định
                  - row [ref=f7e1455]:
                    - cell "Báo nhầm theo thời gian" [ref=f7e1456]
                    - cell "Số cảnh báo giả / giờ theo dõi hợp lệ trong các hoạt động thường ngày" [ref=f7e1457]
                  - row [ref=f7e1458]:
                    - cell "Độ trễ" [ref=f7e1459]
                    - cell "Từ mốc sự kiện đã gán nhãn đến candidate và confirmed; báo riêng cửa sổ hủy" [ref=f7e1460]
                  - row [ref=f7e1461]:
                    - cell "Mất dữ liệu" [ref=f7e1462]
                    - cell "Thời gian hoặc mẫu thiếu / lượng kỳ vọng theo cấu hình" [ref=f7e1463]
            - paragraph [ref=f7e1464]: Không chỉ dùng accuracy khi dữ liệu không ngã chiếm phần lớn. Nếu dùng dataset công khai, ghi giấy phép, thiết bị/vị trí thu và khác biệt với prototype. Chia train/tune/test theo người hoặc phiên, không để các cửa sổ gần nhau rơi vào cả train và test. Giữ tập test không dùng để chọn ngưỡng.
            - paragraph [ref=f7e1465]: Tập hoạt động âm tính nên có ngồi xuống nhanh, nằm xuống, đi bộ, vung tay, tháo thiết bị và thiết bị rơi khỏi bàn. Mô phỏng bằng vật thay thế cần báo riêng; không gộp với thử trên người để tăng số liệu. Chưa có quy mô mẫu/đích accuracy được chốt.
            - heading "Đánh giá nhịp tim và bước chân" [level=3] [ref=f7e1466]
            - paragraph [ref=f7e1467]: "Nhịp tim: căn chỉnh thời gian với thiết bị tham chiếu, ghi nguồn/giới hạn tham chiếu, MAE trên cặp mẫu hợp lệ, phân bố sai số và tỷ lệ không có phép đo. Không loại im lặng các đoạn nhiễu để tạo kết quả đẹp; báo riêng nghỉ/vận động và điều kiện tiếp xúc."
            - paragraph [ref=f7e1468]: "Bước chân: dùng số bước đếm thủ công/nguồn tham chiếu của từng phiên, so chênh lệch tuyệt đối/tương đối theo hoạt động và vị trí đeo. Phiên có bước tham chiếu bằng 0 không dùng phần trăm chia cho 0; báo số đếm nhầm."
            - paragraph [ref=f7e1469]: "Pin: ghi cấu hình đo, chu kỳ gửi, RSSI/điều kiện mạng, dung lượng sử dụng và hoạt động cảnh báo. Thời lượng ước tính không thay phép đo chạy thực tế."
            - heading "Biểu mẫu bằng chứng tối thiểu" [level=3] [ref=f7e1470]
            - paragraph [ref=f7e1471]: "Mỗi lần thử ghi: mã lần thử, mục đích, phiên bản code/config, phần cứng/vị trí đeo, dữ liệu đầu vào và quyền dùng, bước thực hiện, kết quả kỳ vọng/thực tế, số mẫu/thời lượng, lỗi/giới hạn và đường dẫn artifact. Dùng ID ẩn danh; raw data ở vùng local đã loại khỏi Git."
            - paragraph [ref=f7e1472]: Kết luận báo cáo phải kèm điều kiện thử. Không suy rộng từ một demo vài phút sang độ tin cậy trong gia đình hoặc khả năng chẩn đoán.
