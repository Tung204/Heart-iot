              - strong [ref=f7e2342]: Hệ thống Giám sát sức khỏe và Cảnh báo té ngã cho Người cao tuổi ứng dụng IoT và Trợ lý (AI).
            - paragraph [ref=f7e2343]: "Hệ thống gồm thiết bị ghi nhận nhịp tim/vận động, nền tảng theo dõi cho người dùng và người thân, luồng cảnh báo té ngã có xác nhận. Yêu cầu bổ sung: AI thực hiện nghiệp vụ và tự chạy trong phạm vi được giao, cùng web/app có cấu hình động và giao diện thao tác thông thường."
            - paragraph [ref=f7e2344]:
              - strong [ref=f7e2345]: "Trạng thái ngày 10/11/2026:"
              - text: có thiết kế IoT v0.1, khung thư mục và tài liệu thu thập yêu cầu nền tảng AI/cấu hình động. Đã đọc cuộc trò chuyện chia sẻ và đối chiếu nguồn kỹ thuật liên quan. Chưa có mã ứng dụng, firmware chạy được, thiết bị đã kiểm chứng hoặc kết quả thử nghiệm. Hướng nền tảng và các lựa chọn công nghệ còn cần chốt; không coi baseline v0.1 là đặc tả đầy đủ cho AI thực thi.
            - heading "Bắt đầu đọc" [level=3] [ref=f7e2346]
            - paragraph [ref=f7e2347]:
              - strong [ref=f7e2348]:
                - link "Mở bộ tài liệu HTML" [ref=f7e2349] [cursor=pointer]:
                  - /url: "#mo-dau"
              - text: — đọc ngoại tuyến, tìm kiếm không dấu, xem sơ đồ và in/lưu PDF. Bản HTML gồm thiết kế, review, cấu trúc và payload; được sinh từ các nguồn Markdown/JSON.
              - link "Cách cập nhật HTML" [ref=f7e2350] [cursor=pointer]:
                - /url: ../../tools/docs/README.md
              - text: .
            - list [ref=f7e2351]:
              - listitem [ref=f7e2352]:
                - link "Tổng quan và ý tưởng" [ref=f7e2353] [cursor=pointer]:
                  - /url: "#tong-quan"
                - text: ": bài toán, các phương án và hướng đề xuất."
              - listitem [ref=f7e2354]:
                - link "Yêu cầu và phạm vi" [ref=f7e2355] [cursor=pointer]:
                  - /url: "#yeu-cau"
                - text: ": MVP, vai trò, tiêu chí chấp nhận."
              - listitem [ref=f7e2356]:
                - link "Kiến trúc hệ thống" [ref=f7e2357] [cursor=pointer]:
                  - /url: "#kien-truc"
                - text: ": thành phần, luồng cảnh báo và công nghệ ứng viên."
              - listitem [ref=f7e2358]:
                - link "Mục lục tài liệu" [ref=f7e2359] [cursor=pointer]:
                  - /url: "#mo-dau"
                - text: ": dữ liệu/API, phần cứng, màn hình, AI, kiểm thử và hồ sơ."
              - listitem [ref=f7e2360]:
                - link "Nền tảng AI, web/app và cấu hình động" [ref=f7e2361] [cursor=pointer]:
                  - /url: "#nen-tang-ai"
                - text: ": yêu cầu mới, ranh giới AI sửa backend, preview frontend và phương án cần chốt."
              - listitem [ref=f7e2362]:
                - link "Nguyên tắc phát triển và bằng chứng" [ref=f7e2363] [cursor=pointer]:
                  - /url: "#nguyen-tac-phat-trien"
                - text: ": luôn cập nhật docs, đọc đúng version, tái sử dụng và kiểm tác động xuyên module."
            - heading "Khung thư mục" [level=3] [ref=f7e2364]
            - code [ref=f7e2366]: "DATN/ ├── apps/ │ ├── web/ # Web responsive cho người dùng, người thân, admin │ └── api/ # Backend nghiệp vụ, tiếp nhận dữ liệu, cảnh báo ├── firmware/ # Chương trình trên thiết bị IoT ├── hardware/ # BOM, sơ đồ mạch, kết quả khảo sát cơ khí/nguồn ├── packages/contracts/ # Hợp đồng dữ liệu và payload minh họa ├── infra/ # Cấu hình môi trường và triển khai dự kiến ├── tools/ │ ├── simulator/ # Công cụ mô phỏng thiết bị dự kiến │ └── docs/ # Công cụ sinh và kiểm bản HTML từ Markdown/JSON ├── tests/ # Quy ước và kịch bản kiểm thử liên thành phần ├── data/ # Quy ước dữ liệu mẫu/thử nghiệm ├── reports/ # Báo cáo, hình, tài liệu bảo vệ └── docs/ # Nguồn chính của thiết kế kỹ thuật └── html/index.html # Bản đọc ngoại tuyến được sinh từ nguồn"
            - paragraph [ref=f7e2367]:
              - text: Các thư mục hiện có README nêu trách nhiệm và điều kiện bắt đầu. Payload trong
              - code [ref=f7e2368]: packages/contracts/examples/
              - text: là dữ liệu tổng hợp để trao đổi thiết kế; chưa phải bộ dữ liệu đo. Chưa tạo package manifest, lockfile hay lệnh chạy giả khi framework/version chưa được chốt.
            - heading "Hướng đề xuất" [level=3] [ref=f7e2369]
            - list [ref=f7e2370]:
              - listitem [ref=f7e2371]: Prototype tại nhà dùng Wi-Fi; web responsive là giao diện đầu tiên.
              - listitem [ref=f7e2372]: Kiểm chứng vị trí đeo, IMU và tín hiệu nhịp tim trước khi chốt vỏ thiết bị.
              - listitem [ref=f7e2373]: Backend dạng modular monolith, database quan hệ, giao tiếp thiết bị có định danh và chống xử lý trùng.
              - listitem [ref=f7e2374]: Cảnh báo hoạt động độc lập với AI. Baseline có tóm tắt dữ liệu; hướng mới bổ sung AI thực thi qua Business Tools dùng chung với UI, được kiểm quyền và ghi lịch sử.
              - listitem [ref=f7e2375]: Đề xuất lõi nền tảng dùng chung, lấy sức khỏe IoT làm ứng dụng hoàn chỉnh đầu tiên; phạm vi tổng quát và mức sinh code chưa chốt.
              - listitem [ref=f7e2376]: Bản demo đầu tiên dùng dữ liệu mô phỏng, thể hiện đủ mất mạng, báo nhầm và xác nhận cảnh báo.
            - heading "Nguồn và cách tiếp tục" [level=3] [ref=f7e2377]
            - paragraph [ref=f7e2378]:
              - text: Đề cương gốc cùng kế hoạch có trạng thái nằm trong dự án
              - strong [ref=f7e2379]: Đồ án sức khỏe IoT
              - text: ở Obsidian.
              - link "Nguồn và điều chưa xác minh" [ref=f7e2380] [cursor=pointer]:
                - /url: "#nguon"
              - text: ghi đường dẫn, tài liệu đã đọc và thông tin còn thiếu.
              - code [ref=f7e2381]: docs
              - text: là nguồn chính cho kỹ thuật; không duy trì checklist tiến độ thứ hai tại repository.
            - paragraph [ref=f7e2382]:
              - text: Bước tiếp theo là chốt phạm vi nền tảng, ranh giới tự chủ và cấu hình động, đối chiếu yêu cầu của trường/linh kiện, rồi cập nhật đồng bộ đặc tả trước khi triển khai.
              - link "Lộ trình v0.1" [ref=f7e2383] [cursor=pointer]:
                - /url: "#lo-trinh"
              - text: là baseline IoT;
              - link "chương 11" [ref=f7e2384] [cursor=pointer]:
                - /url: "#nen-tang-ai"
              - text: bổ sung bằng chứng cần trình diễn cho hướng AI thực thi.
            - heading "apps/web — Giao diện web" [level=3] [ref=f7e2385]
            - paragraph [ref=f7e2386]:
              - text: Nơi triển khai giao diện người được theo dõi, người thân và admin.
              - strong [ref=f7e2387]: Hiện chưa có mã ứng dụng hoặc lệnh chạy.
              - text: React + TypeScript + Vite là ứng viên, chưa khóa version.
            - paragraph [ref=f7e2388]:
              - text: "Nguồn thiết kế:"
              - link "yêu cầu" [ref=f7e2389] [cursor=pointer]:
                - /url: "#yeu-cau"
              - text: ","
              - link "màn hình" [ref=f7e2390] [cursor=pointer]:
                - /url: "#giao-dien"
              - text: ","
              - link "API" [ref=f7e2391] [cursor=pointer]:
                - /url: "#du-lieu"
              - text: .
            - paragraph [ref=f7e2392]:
              - text: Sau khi chốt framework, tổ chức theo chức năng
              - code [ref=f7e2393]: auth
              - text: ","
              - code [ref=f7e2394]: subjects
              - text: ","
              - code [ref=f7e2395]: devices
              - text: ","
              - code [ref=f7e2396]: measurements
              - text: ","
              - code [ref=f7e2397]: alerts
              - text: ","
              - code [ref=f7e2398]: sharing
              - text: ","
              - code [ref=f7e2399]: assistant
              - text: ","
              - code [ref=f7e2400]: admin
              - text: ; phần dùng chung gồm API client, thành phần giao diện và định dạng thời gian/đơn vị. Không tạo các thư mục source rỗng trước khi có lát cắt triển khai.
            - paragraph [ref=f7e2401]: Ưu tiên demo đọc dữ liệu, trạng thái cũ/offline và xác nhận cảnh báo. Không tính quyền truy cập chỉ ở giao diện; backend là nơi thực thi quyền. Trạng thái đang tải, rỗng, mất mạng, thiếu quyền và dữ liệu mô phỏng cần rõ ràng.
            - heading "apps/api — Backend" [level=3] [ref=f7e2402]
            - paragraph [ref=f7e2403]:
              - text: Nơi triển khai backend modular monolith.
              - strong [ref=f7e2404]: Hiện chưa có ứng dụng, migration hay endpoint đang chạy.
              - text: NestJS + TypeScript là ứng viên, chưa khóa version/ORM.
            - paragraph [ref=f7e2405]:
              - text: "Ranh giới module dự kiến:"
              - code [ref=f7e2406]: auth
              - text: ","
              - code [ref=f7e2407]: subjects
              - text: ","
              - code [ref=f7e2408]: care-links
              - text: ","
              - code [ref=f7e2409]: devices
              - text: ","
              - code [ref=f7e2410]: ingestion
              - text: ","
              - code [ref=f7e2411]: measurements
              - text: ","
              - code [ref=f7e2412]: incidents
              - text: ","
              - code [ref=f7e2413]: notifications
              - text: ","
              - code [ref=f7e2414]: assistant
              - text: ","
              - code [ref=f7e2415]: audit
              - text: . Adapter MQTT/HTTP/AI gọi nghiệp vụ qua ranh giới rõ; logic chuyển trạng thái và kiểm quyền không nằm rải trong transport handler.
            - paragraph [ref=f7e2416]:
              - text: "Nguồn chính:"
              - link "kiến trúc" [ref=f7e2417] [cursor=pointer]:
                - /url: "#kien-truc"
              - text: ","
              - link "dữ liệu/API" [ref=f7e2418] [cursor=pointer]:
                - /url: "#du-lieu"
              - text: và
              - link "kiểm thử" [ref=f7e2419] [cursor=pointer]:
                - /url: "#kiem-thu"
              - text: .
            - paragraph [ref=f7e2420]: "Lát cắt đầu: ingest một telemetry và một incident từ simulator, lưu bền có chống trùng, đọc bằng tài khoản đúng quyền, xác nhận/đóng incident. Viết migration/constraint cùng hành vi; kiểm transaction outbox và truy cập chéo hồ sơ trước khi mở rộng."
            - heading "firmware — Chương trình thiết bị" [level=3] [ref=f7e2421]
            - paragraph [ref=f7e2422]:
              - text: Nơi đặt chương trình ESP32 sau khi chọn board, ESP-IDF, component MQTT và driver cảm biến.
              - strong [ref=f7e2423]: Chưa có firmware build được hoặc pin mapping đã xác minh.
            - paragraph [ref=f7e2424]:
              - text: Đọc
              - link "phần cứng và firmware" [ref=f7e2425] [cursor=pointer]:
                - /url: "#phan-cung"
              - text: ","
              - link "hợp đồng" [ref=f7e2426] [cursor=pointer]:
                - /url: "#du-lieu"
              - text: và
              - link "payload mẫu" [ref=f7e2427] [cursor=pointer]:
                - /url: "#payload"
              - text: .
            - paragraph [ref=f7e2428]: "Ranh giới dự kiến: cảm biến, xử lý tín hiệu, phát hiện nghi ngã, tương tác tại chỗ, kết nối, buffer, telemetry và cấu hình. Cần ghi version board/SDK/component, sample rate, đơn vị, vị trí đeo và tham số thuật toán trong từng phiên thử."
            - paragraph [ref=f7e2429]: Provision credential ngoài source. ACK MQTT không thay ACK lưu bền từ backend. Outbox thư viện không được mặc định là hàng đợi flash sống qua mất nguồn. Chỉ tạo project SDK sau khi xác nhận bộ version tương thích.
            - heading "hardware — Hồ sơ phần cứng" [level=3] [ref=f7e2430]
            - paragraph [ref=f7e2431]:
              - text: Nơi lưu BOM được xác minh, sơ đồ mạch/pin mapping, thiết kế vỏ và bằng chứng đo nguồn/tín hiệu.
              - strong [ref=f7e2432]: Hiện chưa có BOM chốt, schematic hoặc giá linh kiện.
            - paragraph [ref=f7e2433]:
              - text: Các ứng viên và trình tự khảo sát nằm ở
              - link "thiết kế phần cứng" [ref=f7e2434] [cursor=pointer]:
                - /url: "#phan-cung"
              - text: .
            - paragraph [ref=f7e2435]:
              - text: Khi có đầu ra, tổ chức theo
              - code [ref=f7e2436]: bom
              - text: ","
              - code [ref=f7e2437]: schematics
              - text: ","
              - code [ref=f7e2438]: enclosure
              - text: và
              - code [ref=f7e2439]: measurements
              - text: . BOM cần mã part/module cụ thể, số lượng, nguồn datasheet, nhà cung cấp, ngày/giá, điện áp và lý do chọn. Kết quả đo cần board/firmware/config/version và điều kiện thử.
            - paragraph [ref=f7e2440]: Chưa có linh kiện thì ghi “chưa xác minh”; không điền giá 0 hoặc thông số định mức của một chip thành thông số cả module. Ảnh/video lớn lưu ở nơi chia sẻ phù hợp và dẫn link đã kiểm quyền; không đưa dữ liệu nhận diện người tham gia vào Git.
            - heading "infra — Hạ tầng" [level=3] [ref=f7e2441]
            - paragraph [ref=f7e2442]:
              - text: Nơi đặt cấu hình chạy local/demo sau khi ứng dụng có thể build.
              - strong [ref=f7e2443]: Chưa có Compose, image hoặc môi trường đã deploy.
            - paragraph [ref=f7e2444]: Thành phần dự kiến gồm PostgreSQL, MQTT broker có ACL, API/worker và web. Chỉ thêm cache/queue chuyên dụng khi có nhu cầu được chứng minh; bản đầu có thể dùng notification outbox trong database.
            - paragraph [ref=f7e2445]:
              - text: Đọc
              - link "kiến trúc" [ref=f7e2446] [cursor=pointer]:
                - /url: "#kien-truc"
              - text: và
              - link "vận hành/bàn giao" [ref=f7e2447] [cursor=pointer]:
                - /url: "#lo-trinh"
              - text: . Cấu hình thực tế phải mô tả port, TLS, health check, volume, backup/restore, migration, credential rotation và cách rollback.
            - paragraph [ref=f7e2448]:
              - text: Secret không commit. Khi thêm
              - code [ref=f7e2449]: .env.example
              - text: ", chỉ ghi tên biến và giá trị demo vô hại, không sao chép"
              - code [ref=f7e2450]: .env
              - text: thật. Không mở broker/DB công khai để tiện demo.
            - heading "tools/simulator — Mô phỏng" [level=3] [ref=f7e2451]
            - paragraph [ref=f7e2452]:
              - text: Công cụ dự kiến tạo dữ liệu tổng hợp theo hợp đồng thiết bị để làm demo và kiểm lỗi trước khi có phần cứng.
              - strong [ref=f7e2453]: Hiện chưa có script simulator chạy được.
            - paragraph [ref=f7e2454]: "Các kịch bản cần triển khai: nhịp tim/vận động hợp lệ, tín hiệu kém, candidate rồi cancel, candidate rồi confirmed, SOS, gửi trùng, đảo thứ tự revision, mất mạng/gửi lại, clock unsynced và đổi boot."
            - paragraph [ref=f7e2455]: Mỗi kịch bản cần seed hoặc bộ input cố định, thời gian/ID kiểm soát được, nhãn mô phỏng rõ và khả năng chạy qua cùng đường ingest với thiết bị. Không tạo đường tắt bỏ kiểm quyền thiết bị chỉ cho demo.
            - paragraph [ref=f7e2456]:
              - text: Tham chiếu
              - link "hợp đồng và ví dụ" [ref=f7e2457] [cursor=pointer]:
                - /url: "#payload"
              - text: ","
              - link "kịch bản kiểm thử" [ref=f7e2458] [cursor=pointer]:
                - /url: "#kiem-thu"
              - text: . Chọn ngôn ngữ sau khi chốt backend; không cần thêm runtime riêng nếu TypeScript hiện có đáp ứng.
            - heading "tests — Kiểm thử" [level=3] [ref=f7e2459]
            - paragraph [ref=f7e2460]:
              - strong [ref=f7e2461]: Chưa có ứng dụng nên chưa có test executable.
              - text: Ma trận yêu cầu/kịch bản và cách đo nằm tại
              - link "kiểm thử và đánh giá" [ref=f7e2462] [cursor=pointer]:
                - /url: "#kiem-thu"
              - text: .
            - paragraph [ref=f7e2463]: Unit test đặt gần module sở hữu hành vi khi chọn framework. Thư mục này dành cho integration/E2E qua ranh giới thiết bị → ingest → lưu trữ → cảnh báo → người nhận, và fixture tổng hợp dùng chung khi thực sự cần.
            - paragraph [ref=f7e2464]: Ưu tiên lint/type-check rồi test nhỏ nhất liên quan; chạy tuần tự mặc định. Test cần bảo vệ quyền, idempotency, state transition, quality/time và khôi phục sau lỗi. Không viết test chỉ để khẳng định tên file/thư mục có mặt hoặc mô phỏng lại nội bộ framework.
            - paragraph [ref=f7e2465]: Kết quả phần cứng/AI cần thông số và bằng chứng riêng; không gọi một JSON parse thành công là test hệ thống IoT đạt.
            - heading "data — Dữ liệu" [level=3] [ref=f7e2466]
            - paragraph [ref=f7e2467]:
              - text: Chỉ commit dữ liệu tổng hợp hoặc dữ liệu có quyền sử dụng đã được xác minh. Payload minh họa hiện đặt trong
              - link "contracts/examples" [ref=f7e2468] [cursor=pointer]:
                - /url: "#payload"
              - text: ; không nhân bản thành một bộ dữ liệu khác ở đây.
            - paragraph [ref=f7e2469]:
              - text: Các vùng local
              - code [ref=f7e2470]: raw/
              - text: ","
              - code [ref=f7e2471]: private/
              - text: ","
              - code [ref=f7e2472]: processed/
              - text: ","
              - code [ref=f7e2473]: exports/
              - text: đã được loại khỏi Git. Chỉ tạo khi có nhu cầu;
              - code [ref=f7e2474]: .gitignore
              - text: không phải cơ chế kiểm soát truy cập hoặc bảo đảm bảo mật.
            - paragraph [ref=f7e2475]: Dataset thử nghiệm cần manifest mô tả nguồn/giấy phép hoặc sự đồng ý, cảm biến, vị trí đeo, đơn vị, sample rate, thời gian, nhãn, cách ẩn danh, version xử lý và cách chia tập. Không đưa tên/số điện thoại/ảnh nhận diện vào fixture.
            - paragraph [ref=f7e2476]:
              - text: Chưa có dữ liệu đo hoặc dataset học thuật được tải trong lượt chuẩn bị này. Chính sách retention/xóa phải được chốt trước dữ liệu thật theo
              - link "đặc tả dữ liệu" [ref=f7e2477] [cursor=pointer]:
                - /url: "#du-lieu"
              - text: .
            - heading "reports — Báo cáo" [level=3] [ref=f7e2478]
            - paragraph [ref=f7e2479]:
              - text: Nơi lưu đầu ra báo cáo, hình/sơ đồ đã kiểm và kịch bản bảo vệ.
              - strong [ref=f7e2480]: Chưa có biểu mẫu trường, báo cáo hoàn chỉnh, slide hoặc kết quả thí nghiệm.
            - paragraph [ref=f7e2481]:
              - text: Cấu trúc chương và các phụ lục đề xuất nằm ở
              - link "lộ trình/hồ sơ" [ref=f7e2482] [cursor=pointer]:
                - /url: "#lo-trinh"
              - text: . Thiết kế kỹ thuật tiếp tục sửa ở
              - code [ref=f7e2483]: docs
              - text: ", không sao chép thành nhiều bản báo cáo song song trước khi biết mẫu cần nộp."
            - paragraph [ref=f7e2484]: Khi có mẫu trường, ghi nguồn và yêu cầu định dạng; xuất Word/PDF/slide theo đúng đầu ra được yêu cầu và kiểm trình bày. Bảng số liệu phải dẫn tới bằng chứng thực nghiệm. Ảnh/video lớn nên lưu ngoài Git, giữ liên kết có quyền xem phù hợp.
            - paragraph [ref=f7e2485]:
              - text: Tài liệu chứa dữ liệu cá nhân đặt ở vùng được bảo vệ;
              - code [ref=f7e2486]: reports/private/
              - text: bị loại khỏi Git nhưng vẫn cần quản lý quyền và retention riêng.
