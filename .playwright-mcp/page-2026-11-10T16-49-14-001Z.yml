          - generic [ref=f7e138]:
            - heading "Bài toán" [level=3] [ref=f7e139]
            - paragraph [ref=f7e140]: Người thân cần biết người cao tuổi có đang đeo thiết bị, dữ liệu có còn mới và một cảnh báo đã có ai xử lý hay chưa. Chỉ hiển thị số nhịp tim và gửi thông báo chưa giải quyết được việc mất kết nối, báo động giả hoặc không ai nhận trách nhiệm.
            - paragraph [ref=f7e141]:
              - strong [ref=f7e142]: "Hướng đề xuất:"
              - text: một hệ thống theo dõi tại nhà, lấy vòng đời cảnh báo và chất lượng dữ liệu làm trung tâm. Thiết bị ghi nhận nhịp tim, vận động và dấu hiệu nghi té ngã; người dùng có thể hủy báo nhầm; người thân xem tình trạng và xác nhận đang hỗ trợ. AI giúp đọc dữ liệu đã ghi nhận.
            - paragraph [ref=f7e143]: Đối tượng đầu tiên là một người được theo dõi và một số người thân được cấp quyền. Đây là phạm vi prototype học thuật; số người dùng thực tế và mô hình triển khai cần xác định sau.
            - heading "Nguồn yêu cầu và phần phát triển thêm" [level=3] [ref=f7e144]
            - paragraph [ref=f7e145]: "Đề cương gốc yêu cầu IoT, nhịp tim, bước chân/mức vận động, phát hiện té ngã, web/app có tài khoản, chia sẻ người thân, admin và trợ lý AI. Bản này bổ sung đề xuất: trạng thái dữ liệu cũ, quyền chia sẻ có thể thu hồi, xác nhận xử lý cảnh báo, chống gửi trùng, simulator và phép đo đánh giá."
            - paragraph [ref=f7e146]: Không tự bổ sung SpO₂, huyết áp, ECG, GPS, gọi cấp cứu tự động hoặc ứng dụng native vào MVP. Nếu cần thêm, phải xem tác động đến cảm biến, nguồn, dữ liệu và thời gian.
            - heading "So sánh hướng sản phẩm" [level=3] [ref=f7e147]
            - region "Bảng dữ liệu có thể cuộn ngang" [ref=f7e148]:
              - table [ref=f7e149]:
                - rowgroup [ref=f7e150]:
                  - row [ref=f7e151]:
                    - columnheader "Hướng" [ref=f7e152]
                    - columnheader "Giá trị" [ref=f7e153]
                    - columnheader "Khó khăn cần chứng minh" [ref=f7e154]
                    - columnheader "Đánh giá cho đồ án" [ref=f7e155]
                - rowgroup [ref=f7e156]:
                  - row [ref=f7e157]:
                    - cell "Một thiết bị đeo cổ tay + Wi-Fi + web" [ref=f7e158]
                    - cell "Ít thành phần, dễ thao tác, có thể đo PPG tại vị trí đeo" [ref=f7e159]
                    - cell "Nhiễu vận động; cử động tay dễ tạo báo ngã giả; tiêu thụ pin Wi-Fi" [ref=f7e160]
                    - cell "Ứng viên khảo sát, chưa chốt hình dạng" [ref=f7e161]
                  - row [ref=f7e162]:
                    - cell "IMU đeo thân/thắt lưng + đo nhịp tim theo phiên" [ref=f7e163]
                    - cell "Tách bài toán chuyển động và đo quang học; dễ so sánh vị trí" [ref=f7e164]
                    - cell "Hai thao tác/thiết bị; không được mô tả là đo nhịp tim liên tục" [ref=f7e165]
                    - cell "Phương án dự phòng có thể kiểm chứng trên bàn" [ref=f7e166]
                  - row [ref=f7e167]:
                    - cell "BLE qua điện thoại hoặc thiết bị có kết nối di động" [ref=f7e168]
                    - cell "Có khả năng theo dõi ngoài nhà" [ref=f7e169]
                    - cell "Gateway, ứng dụng nền, vùng phủ, SIM và pin" [ref=f7e170]
                    - cell "Mở rộng sau prototype Wi-Fi" [ref=f7e171]
            - paragraph [ref=f7e172]:
              - text: Đề xuất bắt đầu bằng
              - strong [ref=f7e173]: prototype trên bàn, rồi khảo sát vị trí đeo
              - text: . Một MAX30102 gắn trên mạch thử không chứng minh được nhịp tim ổn định khi đeo và đi lại. Thuật toán IMU được thử ở thắt lưng cũng không mặc nhiên đúng cho cổ tay.
            - heading "Ý tưởng tạo khác biệt có thể đánh giá" [level=3] [ref=f7e174]
            - list [ref=f7e175]:
              - listitem [ref=f7e176]:
                - strong [ref=f7e177]: "Cảnh báo có vòng đời:"
                - text: nghi ngã → cửa sổ hủy → xác nhận từ thiết bị → gửi cảnh báo → người thân xác nhận → kết thúc có lý do. Có lịch sử thao tác và thông báo tới muộn.
              - listitem [ref=f7e178]:
                - strong [ref=f7e179]: "Dữ liệu biết chất lượng:"
                - text: hiển thị rõ
                - code [ref=f7e180]: valid
                - text: ","
                - code [ref=f7e181]: poor_signal
                - text: ","
                - code [ref=f7e182]: not_worn
                - text: ", dữ liệu cũ và thiết bị offline. Không vẽ tiếp một đường đo như thể vẫn đang nhận dữ liệu."
              - listitem [ref=f7e183]:
                - strong [ref=f7e184]: "AI có bằng chứng:"
                - text: mỗi tóm tắt chỉ rõ khoảng dữ liệu và phần bị thiếu; giải thích kiến thức chung phải có nguồn đã duyệt. Không để AI tự quyết định có gửi cảnh báo hay không.
            - heading "Kịch bản demo đề xuất" [level=3] [ref=f7e185]
            - paragraph [ref=f7e186]: Người thân được mời vào hồ sơ theo dõi và xem dữ liệu tổng hợp từ simulator. Một sự kiện nghi ngã xuất hiện; lần đầu được hủy trên thiết bị giả lập, lần sau hết cửa sổ hủy và tạo cảnh báo. Người thân nhận cảnh báo trên dashboard, xác nhận đang xử lý, rồi đóng với kết quả “báo nhầm” hoặc “đã hỗ trợ”.
            - paragraph [ref=f7e187]: Sau đó mô phỏng mất mạng, gửi lại cùng sự kiện, thu hồi quyền chia sẻ và một ngày thiếu dữ liệu. Hệ thống phải giữ đúng số cảnh báo, chặn quyền đã thu hồi, và AI nói rõ dữ liệu thiếu. Khi thay simulator bằng phần cứng, giữ nguyên hợp đồng dữ liệu.
            - heading "Giới hạn đã biết" [level=3] [ref=f7e188]
            - paragraph [ref=f7e189]: Wi-Fi chỉ phục vụ vùng có mạng đã cấu hình. Cảnh báo tại chỗ có thể hoạt động khi mất mạng, nhưng báo từ xa cần đường truyền. Nhịp tim là dữ liệu cảm biến cần đối chiếu, không phải chẩn đoán. Chưa có ngân sách, thời lượng pin, độ chính xác hoặc biểu mẫu trường để cam kết.
