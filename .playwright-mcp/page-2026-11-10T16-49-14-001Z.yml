            - paragraph [ref=f7e1061]: Tên linh kiện chỉ là ứng viên. Không suy ra module bất kỳ tương thích 3,3 V/5 V từ tên chip; phải đọc datasheet và sơ đồ module được mua. Chưa đưa pin/charger vào thiết kế chi tiết trước khi xác định yêu cầu nguồn.
            - heading "Trình tự khảo sát vị trí đeo" [level=3] [ref=f7e1062]
            - list [ref=f7e1063]:
              - listitem [ref=f7e1064]: "Trên bàn: đọc định danh cảm biến, kiểm nguồn và dữ liệu thô ổn định; ghi cấu hình và phiên bản driver."
              - listitem [ref=f7e1065]: "PPG: thu phiên ngồi yên, so với thiết bị tham chiếu đã biết giới hạn; ghi tỷ lệ mất tín hiệu và ảnh hưởng tiếp xúc."
              - listitem [ref=f7e1066]: "IMU: ghi hoạt động thường ngày có nhãn ở vị trí đề xuất như cổ tay/thắt lưng; không trộn vị trí mà không lưu metadata."
              - listitem [ref=f7e1067]: So sánh tỷ lệ báo nhầm, khả năng đeo và chất lượng nhịp tim để chọn một thiết bị hay tách phép đo theo phiên.
            - paragraph [ref=f7e1068]: Không yêu cầu người cao tuổi cố tình té ngã. Thử va chạm trước bằng mô hình/vật thay thế; dữ liệu đó chỉ chứng minh phản ứng với kịch bản cơ học, không đại diện độ nhạy trên người. Thử có người cần phương án phù hợp, đồng ý và điều kiện an toàn riêng.
            - heading "Thuật toán ban đầu có thể giải thích" [level=3] [ref=f7e1069]
            - paragraph [ref=f7e1070]:
              - text: "Luồng dự kiến: kiểm chất lượng → lọc nhiễu IMU → trích độ lớn gia tốc/thay đổi tư thế → nhận diện chuỗi đặc trưng →"
              - code [ref=f7e1071]: fall.candidate
              - text: → cửa sổ hủy →
              - code [ref=f7e1072]: fall.confirmed
              - text: hoặc
              - code [ref=f7e1073]: fall.cancelled
              - text: .
            - paragraph [ref=f7e1074]: Free-fall, impact và bất động có thể là đặc trưng nghiên cứu; không bắt buộc mọi cú ngã đều có đủ ba dấu hiệu. Ngồi mạnh, vỗ tay, tháo/rơi thiết bị cũng phải có trong tập hoạt động âm tính. Ngưỡng lấy từ calibration, không đặt một giá trị g rồi gọi là đã phát hiện ngã chính xác.
            - paragraph [ref=f7e1075]: Bắt đầu bằng rule-based baseline và ghi version/tham số. Chỉ cân nhắc mô hình học máy sau khi có dữ liệu đủ nguồn, chia tập đúng và chứng minh cải thiện trên cùng phép đo. Không dùng AI ngôn ngữ để phân loại từng mẫu cảm biến trong đường cảnh báo.
            - heading "Ranh giới module firmware dự kiến" [level=3] [ref=f7e1076]
            - region "Bảng dữ liệu có thể cuộn ngang" [ref=f7e1077]:
