                - strong [ref=f7e1258]: "Baseline v0.1 — AI đọc và tóm tắt:"
                - text: đây là phạm vi thiết kế ban đầu. Người dùng đã yêu cầu AI thực thi nghiệp vụ và tự chạy trong phạm vi được giao; xem
                - link "chương 11" [ref=f7e1259] [cursor=pointer]:
                  - /url: "#nen-tang-ai"
                - text: . Chưa triển khai theo baseline này như đặc tả AI cuối cùng; các nguyên tắc kiểm quyền, dẫn nguồn và cảnh báo độc lập tiếp tục được giữ.
            - paragraph [ref=f7e1260]:
              - strong [ref=f7e1261]: "Mục đích đề xuất:"
              - text: giúp người dùng/người thân hiểu dữ liệu đã có, nhận biết dữ liệu thiếu và tra cứu kiến thức phổ thông từ nguồn được duyệt. AI không nằm trong đường quyết định phát hiện/gửi cảnh báo té ngã.
            - heading "Phạm vi theo mức hoàn thiện" [level=3] [ref=f7e1262]
            - region "Bảng dữ liệu có thể cuộn ngang" [ref=f7e1263]:
              - table [ref=f7e1264]:
                - rowgroup [ref=f7e1265]:
                  - row [ref=f7e1266]:
                    - columnheader "Mức" [ref=f7e1267]
                    - columnheader "Đầu vào" [ref=f7e1268]
