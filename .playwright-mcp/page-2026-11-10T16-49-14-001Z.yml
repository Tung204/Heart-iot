            - paragraph [ref=f7e777]:
              - text: "Khóa/index dự kiến: unique"
              - code [ref=f7e778]: (device_id, message_id)
              - text: ", unique"
              - code [ref=f7e779]: (device_id, boot_id, sequence)
              - text: cho envelope thiết bị; index
              - code [ref=f7e780]: (assignment_id, measured_at)
              - text: cho truy vấn biểu đồ và
              - code [ref=f7e781]: (state, detected_at)
              - text: cho cảnh báo.
              - code [ref=f7e782]: message_id
              - text: phải được giữ nguyên khi retry;
              - code [ref=f7e783]: sequence
              - text: tăng chung cho các bản tin trong một boot. Cùng key nhưng khác nội dung là xung đột, không âm thầm overwrite.
            - heading "Hợp đồng telemetry" [level=3] [ref=f7e784]
            - region "Bảng dữ liệu có thể cuộn ngang" [ref=f7e785]:
              - table [ref=f7e786]:
                - rowgroup [ref=f7e787]:
                  - row [ref=f7e788]:
                    - columnheader "Trường" [ref=f7e789]
                    - columnheader "Quy tắc" [ref=f7e790]
                - rowgroup [ref=f7e791]:
                  - row [ref=f7e792]:
                    - cell [ref=f7e793]:
                      - code [ref=f7e794]: schema_version
                    - cell [ref=f7e795]:
                      - code [ref=f7e796]: "1.0"
                      - text: cho bản dự thảo này; version không hỗ trợ bị từ chối/cách ly có lý do
                  - row [ref=f7e797]:
                    - cell [ref=f7e798]:
                      - code [ref=f7e799]: message_id
                      - text: ","
                      - code [ref=f7e800]: device_id
                      - text: ","
                      - code [ref=f7e801]: boot_id
                    - cell "Định danh không chứa tên/số điện thoại; ví dụ dùng ID minh họa" [ref=f7e802]
                  - row [ref=f7e803]:
                    - cell [ref=f7e804]:
                      - code [ref=f7e805]: sequence
                    - cell "Số nguyên không âm; tăng trong cùng boot, giữ khi gửi lại" [ref=f7e806]
                  - row [ref=f7e807]:
                    - cell [ref=f7e808]:
                      - code [ref=f7e809]: measured_at
                    - cell [ref=f7e810]:
                      - text: RFC 3339 UTC hoặc
                      - code [ref=f7e811]: "null"
                      - text: khi chưa có đồng hồ tin cậy
                  - row [ref=f7e812]:
                    - cell [ref=f7e813]:
                      - code [ref=f7e814]: clock_status
                    - cell [ref=f7e815]:
                      - code [ref=f7e816]: synced
                      - text: hoặc
                      - code [ref=f7e817]: unsynced
                      - text: ;
                      - code [ref=f7e818]: unsynced
                      - text: đi với
                      - code [ref=f7e819]: "measured_at: null"
                  - row [ref=f7e820]:
                    - cell [ref=f7e821]:
                      - code [ref=f7e822]: uptime_ms
                    - cell "Thời gian monotonic tính từ boot; không so trực tiếp giữa hai boot" [ref=f7e823]
                  - row [ref=f7e824]:
                    - cell [ref=f7e825]:
                      - code [ref=f7e826]: metrics.heart_rate_bpm
                    - cell [ref=f7e827]:
                      - text: Số hoặc
                      - code [ref=f7e828]: "null"
                      - text: ; chỉ số không hợp lệ phải là
                      - code [ref=f7e829]: "null"
                      - text: ", không dùng 0 giả"
                  - row [ref=f7e830]:
                    - cell [ref=f7e831]:
                      - code [ref=f7e832]: metrics.steps_since_boot
                    - cell "Tổng bước của boot hiện tại, số nguyên không âm; không phải tổng ngày" [ref=f7e833]
                  - row [ref=f7e834]:
                    - cell [ref=f7e835]:
                      - code [ref=f7e836]: quality.heart_rate
                    - cell [ref=f7e837]:
                      - code [ref=f7e838]: valid
                      - text: ","
                      - code [ref=f7e839]: poor_signal
                      - text: ","
                      - code [ref=f7e840]: not_worn
                      - text: hoặc
                      - code [ref=f7e841]: sensor_error
                  - row [ref=f7e842]:
                    - cell [ref=f7e843]:
                      - code [ref=f7e844]: quality.motion
                    - cell [ref=f7e845]:
                      - code [ref=f7e846]: valid
                      - text: hoặc
                      - code [ref=f7e847]: sensor_error
                      - text: ; lỗi cảm biến không tự thành ít vận động
                  - row [ref=f7e848]:
                    - cell [ref=f7e849]:
                      - code [ref=f7e850]: battery_percent
                    - cell [ref=f7e851]:
                      - text: Số 0–100 hoặc
                      - code [ref=f7e852]: "null"
                      - text: khi chưa có phép đo/cấu hình chuyển đổi
                  - row [ref=f7e853]:
                    - cell [ref=f7e854]:
                      - code [ref=f7e855]: firmware_version
                    - cell "Phiên bản tạo payload; phiên bản demo không đại diện firmware đã build" [ref=f7e856]
            - paragraph [ref=f7e857]:
              - text: Server bổ sung
              - code [ref=f7e858]: received_at
              - text: ","
              - code [ref=f7e859]: assignment_id
              - text: và cờ dữ liệu trễ. Firmware không được tự khai người được theo dõi. Khi không đủ bằng chứng để gán dữ liệu vào lịch sử assignment, giữ bản tin ở vùng cách ly; không tự gán vào chủ hiện tại.
            - paragraph [ref=f7e860]: Tổng bước theo ngày được tính từ delta trong từng boot và gán vào khoảng có thời gian tin cậy. Lần nhận đầu của boot sau một đoạn mất dữ liệu có thể không phân bổ chính xác theo ngày; đánh dấu chưa đủ dữ liệu thay vì cộng toàn bộ vào ngày nhận. Khi counter giảm trong cùng boot, ghi lỗi dữ liệu. Ngày hiển thị theo timezone hồ sơ; lưu timestamp UTC.
            - heading "Topic và giao nhận MQTT" [level=3] [ref=f7e861]
            - region "Bảng dữ liệu có thể cuộn ngang" [ref=f7e862]:
              - table [ref=f7e863]:
                - rowgroup [ref=f7e864]:
                  - row [ref=f7e865]:
                    - columnheader "Topic" [ref=f7e866]
                    - columnheader "Hướng" [ref=f7e867]
                    - columnheader "Payload/chính sách" [ref=f7e868]
                - rowgroup [ref=f7e869]:
                  - row [ref=f7e870]:
                    - cell [ref=f7e871]:
                      - code [ref=f7e872]: "v1/devices/{device_id}/telemetry"
                    - cell "Thiết bị → backend" [ref=f7e873]
                    - cell "Envelope telemetry; QoS 1 đề xuất, có thể tổng hợp mẫu để giảm băng thông" [ref=f7e874]
                  - row [ref=f7e875]:
                    - cell [ref=f7e876]:
                      - code [ref=f7e877]: "v1/devices/{device_id}/events"
                    - cell "Thiết bị → backend" [ref=f7e878]
                    - cell [ref=f7e879]:
                      - code [ref=f7e880]: fall.candidate
                      - text: ","
                      - code [ref=f7e881]: fall.cancelled
                      - text: ","
                      - code [ref=f7e882]: fall.confirmed
                      - text: ","
                      - code [ref=f7e883]: user.cancel_requested
                      - text: ","
                      - code [ref=f7e884]: sos.confirmed
                      - text: ; QoS 1
                  - row [ref=f7e885]:
                    - cell [ref=f7e886]:
                      - code [ref=f7e887]: "v1/devices/{device_id}/status"
                    - cell "Thiết bị/broker → backend" [ref=f7e888]
                    - cell "Presence/heartbeat gồm boot_id, uptime, firmware, pin nếu có; LWT chỉ là gợi ý mất kết nối" [ref=f7e889]
                  - row [ref=f7e890]:
                    - cell [ref=f7e891]:
                      - code [ref=f7e892]: "v1/devices/{device_id}/acks"
                    - cell "Backend → thiết bị" [ref=f7e893]
                    - cell "ACK ứng dụng cho sự kiện quan trọng sau commit" [ref=f7e894]
            - paragraph [ref=f7e895]: "Không retain telemetry hoặc sự kiện té ngã: subscriber mới không được hiểu một sự kiện cũ là mới. Có thể retain presence, nhưng phải kiểm thời gian nhận. Topic status dùng cùng envelope định danh khi do thiết bị gửi; LWT do broker gửi phải được nhận diện riêng và không đưa vào bảng dữ liệu đo."
            - paragraph [ref=f7e896]:
              - text: ACL buộc
              - code [ref=f7e897]: device_id
              - text: trong topic và payload khớp định danh đã cấp. Subscriber backend không tin một device_id chỉ vì JSON hợp lệ. Certificate/credential provisioning và rotation được chọn khi dựng broker; không dùng chung một tài khoản thiết bị cho mọi board.
            - heading "Incident và ACK" [level=3] [ref=f7e898]
            - paragraph [ref=f7e899]:
              - text: Sự kiện dùng envelope như telemetry, thay
              - code [ref=f7e900]: metrics
              - text: bằng
              - code [ref=f7e901]: incident_id
              - text: ","
              - code [ref=f7e902]: event_revision
              - text: ","
              - code [ref=f7e903]: event_type
              - text: và
              - code [ref=f7e904]: evidence
              - text: .
              - code [ref=f7e905]: event_revision
              - text: bắt đầu 1 ở candidate, tăng theo từng thay đổi của incident và cần phục hồi được sau reboot nếu incident còn mở.
              - code [ref=f7e906]: fall.confirmed
              - text: phải mang đủ dữ liệu để xử lý khi candidate chưa đến.
            - paragraph [ref=f7e907]:
              - code [ref=f7e908]: evidence.algorithm_version
              - text: ", vị trí đeo và cờ chất lượng giúp giải thích nguyên nhân; không gọi một điểm heuristic là “xác suất té ngã” nếu chưa hiệu chuẩn."
            - paragraph [ref=f7e909]:
              - text: ACK gồm
              - code [ref=f7e910]: source_message_id
              - text: ","
              - code [ref=f7e911]: incident_id
              - text: ","
              - code [ref=f7e912]: accepted_revision
              - text: ","
              - code [ref=f7e913]: status
              - text: ","
              - code [ref=f7e914]: received_at
              - text: .
              - code [ref=f7e915]: accepted
              - text: nghĩa server đã ghi bền;
              - code [ref=f7e916]: duplicate
              - text: nghĩa bản tin giống hệt đã được ghi.
              - code [ref=f7e917]: rejected
              - text: kèm mã lý do để không retry vô hạn. Thiết bị chỉ xóa sự kiện khỏi hàng đợi sau ACK accepted/duplicate đúng định danh; bản tin bị reject chuyển vùng lỗi hữu hạn để kiểm tra.
            - paragraph [ref=f7e918]:
              - text: Nếu revision mới tới trước revision cũ, server lưu lịch sử và áp dụng transition hợp lệ theo revision mới; bản cũ tới sau không làm lùi trạng thái. Hai payload khác nhau cùng revision là lỗi giao thức cần audit. Chuyển
              - code [ref=f7e919]: cancelled
              - text: sang
              - code [ref=f7e920]: open
              - text: bằng dữ liệu cũ bị cấm.
            - heading "API dự kiến" [level=3] [ref=f7e921]
            - paragraph [ref=f7e922]:
              - text: Prefix
              - code [ref=f7e923]: /api/v1
              - text: ; đây là inventory thiết kế, chưa có endpoint chạy.
            - region "Bảng dữ liệu có thể cuộn ngang" [ref=f7e924]:
              - table [ref=f7e925]:
                - rowgroup [ref=f7e926]:
                  - row [ref=f7e927]:
                    - columnheader "Nhóm" [ref=f7e928]
                    - columnheader "Endpoint minh họa" [ref=f7e929]
                    - columnheader "Kiểm quyền/hành vi" [ref=f7e930]
                - rowgroup [ref=f7e931]:
                  - row [ref=f7e932]:
                    - cell "Phiên" [ref=f7e933]
                    - cell [ref=f7e934]:
                      - code [ref=f7e935]: POST /auth/register
                      - text: ","
                      - code [ref=f7e936]: /auth/login
                      - text: ","
                      - code [ref=f7e937]: /auth/logout
                      - text: ;
                      - code [ref=f7e938]: GET /me
                    - cell "Session cookie bảo vệ phù hợp, rate limit, CSRF với thao tác dùng cookie; chốt cơ chế khi chọn stack" [ref=f7e939]
                  - row [ref=f7e940]:
                    - cell "Hồ sơ" [ref=f7e941]
                    - cell [ref=f7e942]:
                      - code [ref=f7e943]: GET /subjects
                      - text: ","
                      - code [ref=f7e944]: "GET /subjects/{id}"
                    - cell "Chỉ hồ sơ sở hữu/được chia sẻ" [ref=f7e945]
                  - row [ref=f7e946]:
                    - cell "Chia sẻ" [ref=f7e947]
                    - cell [ref=f7e948]:
                      - code [ref=f7e949]: "POST /subjects/{id}/invitations"
                      - text: ;
                      - code [ref=f7e950]: "POST /invitations/{token}/accept"
                      - text: ;
                      - code [ref=f7e951]: "DELETE /subjects/{id}/care-links/{link_id}"
                    - cell "Chủ hồ sơ tạo/thu hồi; token dùng một lần, có hạn; không ghi token vào log" [ref=f7e952]
                  - row [ref=f7e953]:
                    - cell "Thiết bị" [ref=f7e954]
                    - cell [ref=f7e955]:
                      - code [ref=f7e956]: POST /devices/claim
                      - text: ;
                      - code [ref=f7e957]: "POST /devices/{id}/release"
                    - cell "Bằng chứng ghép thiết bị dùng một lần; assignment được đóng/mở đúng thời điểm" [ref=f7e958]
                  - row [ref=f7e959]:
                    - cell "Chỉ số" [ref=f7e960]
                    - cell [ref=f7e961]:
                      - code [ref=f7e962]: "GET /subjects/{id}/measurements?from=&to=&cursor="
                    - cell "Giới hạn khoảng, pagination và quyền lịch sử" [ref=f7e963]
                  - row [ref=f7e964]:
                    - cell "Tổng hợp" [ref=f7e965]
                    - cell [ref=f7e966]:
                      - code [ref=f7e967]: "GET /subjects/{id}/daily-summary?date="
                    - cell "Trả coverage, khoảng thiếu và timezone bên cạnh giá trị" [ref=f7e968]
                  - row [ref=f7e969]:
                    - cell "Cảnh báo" [ref=f7e970]
                    - cell [ref=f7e971]:
                      - code [ref=f7e972]: "GET /subjects/{id}/alerts"
                      - text: ;
                      - code [ref=f7e973]: "POST /alerts/{id}/acknowledge"
                      - text: ;
                      - code [ref=f7e974]: "POST /alerts/{id}/resolve"
                    - cell "Quyền hỗ trợ; đóng phải có reason; dùng version và idempotency key" [ref=f7e975]
                  - row [ref=f7e976]:
                    - cell "Realtime" [ref=f7e977]
                    - cell [ref=f7e978]:
                      - code [ref=f7e979]: "GET /subjects/{id}/events"
                      - text: nếu chọn SSE
                    - cell "Xác thực stream, thu hồi quyền, reconnect bằng cursor/snapshot" [ref=f7e980]
                  - row [ref=f7e981]:
                    - cell "AI" [ref=f7e982]
                    - cell [ref=f7e983]:
                      - code [ref=f7e984]: "POST /subjects/{id}/assistant/summary"
                    - cell "Kiểm quyền trước tổng hợp và trước trả kết quả; giới hạn dữ liệu/chi phí" [ref=f7e985]
                  - row [ref=f7e986]:
                    - cell "Dữ liệu cá nhân" [ref=f7e987]
                    - cell [ref=f7e988]:
                      - code [ref=f7e989]: "POST /subjects/{id}/exports"
                      - text: ;
                      - code [ref=f7e990]: "POST /subjects/{id}/deletion-requests"
                    - cell "Chủ hồ sơ hoặc đại diện được xác minh; export có hạn; theo dõi tiến trình xóa" [ref=f7e991]
                  - row [ref=f7e992]:
                    - cell "Admin" [ref=f7e993]
                    - cell [ref=f7e994]:
                      - code [ref=f7e995]: GET /admin/devices
                      - text: ","
                      - code [ref=f7e996]: GET /admin/audit
                    - cell "Quyền quản trị; không cung cấp payload sức khỏe mặc định" [ref=f7e997]
            - paragraph [ref=f7e998]:
              - text: Lỗi API dùng envelope
              - code [ref=f7e999]: "{ \"code\": \"...\", \"message\": \"...\", \"request_id\": \"...\" }"
              - text: ; không trả stack trace hoặc thông tin hồ sơ khác. Dùng
              - code [ref=f7e1000]: "401"
              - text: khi không có phiên,
              - code [ref=f7e1001]: "403"
              - text: khi bị cấm theo chính sách,
              - code [ref=f7e1002]: "409"
              - text: khi xung đột version,
              - code [ref=f7e1003]: "422"
              - text: khi payload không phù hợp hợp đồng,
              - code [ref=f7e1004]: "429"
              - text: khi vượt giới hạn. Với tài nguyên riêng tư cần thống nhất cách dùng
              - code [ref=f7e1005]: "404"
              - text: để tránh dò tồn tại.
            - heading "Retention và xóa" [level=3] [ref=f7e1006]
            - paragraph [ref=f7e1007]: Trước dữ liệu thật, chốt thời hạn cho raw signal, telemetry tổng hợp, audit, AI và backup. Raw IMU/PPG chỉ thu trong phiên thử có mục đích, không truyền/lưu liên tục mặc định. Một yêu cầu xóa phải xét database, file export, cache, tóm tắt AI và vòng đời backup; không ghi “đã xóa hết” khi mới ẩn trên giao diện.
            - paragraph [ref=f7e1008]: Tài khoản người thân đã bị thu hồi không nhận notification còn trong hàng đợi và không đọc bản tóm tắt cache. Dữ liệu đã xuất ra ngoài cần được giải thích trong chính sách chia sẻ trước khi sử dụng thực tế.
