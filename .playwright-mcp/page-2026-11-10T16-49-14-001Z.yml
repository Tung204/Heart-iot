            - paragraph [ref=f7e1861]:
              - text: "Ứng dụng sức khỏe IoT vẫn cần hoàn chỉnh: thiết bị → tiếp nhận dữ liệu → quyền chia sẻ → giao diện theo dõi → vòng đời cảnh báo → trợ lý và báo cáo. Đề xuất module thứ hai là"
              - strong [ref=f7e1862]: công việc/bảo trì thiết bị
              - text: để chứng minh lõi dùng chung. Chưa chốt thêm CRM, ERP, thanh toán thuê bao hay nhiều ứng dụng độc lập vào phạm vi đồ án.
            - paragraph [ref=f7e1863]: "Workspace/tenant cần định nghĩa theo người dùng thực tế: hộ gia đình, tổ chức hay đơn vị cung cấp dịch vụ. Không mặc định một tài khoản tương đương một tenant; quyền trên hồ sơ sức khỏe vẫn cần xét riêng. Admin kỹ thuật không mặc định được đọc sức khỏe hoặc hội thoại riêng."
