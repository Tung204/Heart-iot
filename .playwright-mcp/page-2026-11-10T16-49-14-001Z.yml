            - 'heading "Ví dụ soft-delete: chốt nghĩa trước khi chia sẻ code" [level=3] [ref=f7e2160]'
            - paragraph [ref=f7e2161]:
              - text: Đây là tình huống người dùng kể về dự án khác,
              - strong [ref=f7e2162]: chưa phải chính sách xóa đã chọn cho DATN
              - text: . “Soft-delete”, “archive”, vô hiệu hóa truy cập và tháo liên kết có thể là các hành vi khác nhau. Không suy việc gắn
              - code [ref=f7e2163]: deleted_at
              - text: sẽ tự gỡ khóa ngoại hoặc tự thu hồi toàn bộ quyền.
            - paragraph [ref=f7e2164]: "Khi đặc tả chính sách xóa, cần xác định: dữ liệu giữ lại, quyền đọc chi tiết/truy vấn trực tiếp, quan hệ còn giữ hay được kết thúc, tác vụ đang chạy, phục hồi, xung đột định danh và lịch sử audit. Quan hệ lịch sử phục vụ báo cáo có thể cần giữ nguyên; nếu cần tháo quan hệ hoạt động thì mô tả riêng, không xóa khóa ngoại hàng loạt từ một tên chức năng."
            - paragraph [ref=f7e2165]: "Tình huống hồi quy phù hợp: một đối tượng bị xóa theo chính sách không còn xuất hiện hoặc được thao tác qua các đường bị cấm như danh sách, URL chi tiết, search, export, AI tool, job và cache; những đường lịch sử/quản trị được phép vẫn đúng quyền. Có kiểm restore nếu nghiệp vụ cho phép. Không chỉ test một utility hoặc hai trang rồi kết luận toàn hệ thống nhất quán."
            - heading "Phát triển backend và preview frontend" [level=3] [ref=f7e2166]
            - paragraph [ref=f7e2167]:
              - text: Áp dụng ranh giới trong
              - link "định hướng nền tảng" [ref=f7e2168] [cursor=pointer]:
                - /url: "#nen-tang-ai"
              - text: . Người dùng yêu cầu frontend có preview/chấp nhận; chuẩn bị đầy đủ bản xem trước, diff và kiểm liên quan trước khi xin quyết định áp dụng. Thay đổi nội dung tài liệu hiện tại không phải phát hành frontend của sản phẩm.
            - paragraph [ref=f7e2169]: Việc AI được giao sửa backend ở môi trường phát triển không có nghĩa AI runtime có quyền sửa chính backend đang chạy. Cơ chế branch/review/release/sandbox của sản phẩm là đề xuất cần chốt, không tự coi bài trả lời ở link chia sẻ là ủy quyền triển khai production.
            - heading "Kiểm chứng đúng lớp và đúng phạm vi" [level=3] [ref=f7e2170]
            - list [ref=f7e2171]:
              - listitem [ref=f7e2172]: Bắt đầu bằng lint/type-check hoặc syntax liên quan khi đã có toolchain, rồi test nhỏ nhất bao phủ hành vi ứng dụng sở hữu.
              - listitem [ref=f7e2173]: Mở rộng integration/contract khi luồng dữ liệu qua nhiều module, quyền hoặc lưu trữ bị ảnh hưởng. E2E, race, load và stress dùng khi khớp rủi ro cần điều tra.
              - listitem [ref=f7e2174]: Không test lại nội bộ framework, không viết test chỉ lặp lại implementation hoặc tạo test hình thức cho sửa đổi tài liệu nhỏ.
              - listitem [ref=f7e2175]: Chạy test tuần tự mặc định. Lỗi thì đọc bằng chứng và sửa nguyên nhân; không retry mù, bỏ/nới test để làm xanh.
              - listitem [ref=f7e2176]: Chỉ chạy full suite khi cần release gate hoặc bằng chứng hồi quy rộng. Chạy đạt không đồng nghĩa đã deploy hoặc được nghiệm thu.
            - paragraph [ref=f7e2177]: Khi có source, có thể thêm kiểm dependency boundary, contract và policy để ngăn lệch kiến trúc. Chọn kiểm tra gắn với rủi ro cụ thể; không mặc định phải cài mọi công cụ nêu trong bài tham khảo. Hiện chưa có các quality gate đó.
            - heading "Điều kiện báo hoàn thành" [level=3] [ref=f7e2178]
            - paragraph [ref=f7e2179]: "Kết quả phải ghi đúng: đã thay gì, vì sao, phạm vi/API/data bị ảnh hưởng, kiểm nào đã chạy với kết quả thật, phần chưa kiểm và giới hạn. Tài liệu liên quan phải cập nhật, HTML phải khớp nguồn, phần cần preview phải có bản review được. Chỉ nói một module/khả năng hoạt động khi có bằng chứng thực thi, không dựa vào việc đã viết thiết kế."
            - paragraph [ref=f7e2180]: Hướng dẫn bằng văn bản giúp các agent làm nhất quán; nó không bảo đảm AI không bao giờ sai. Cần kiểm chứng thực tế và cơ chế backend/CI ở những ranh giới đã xác định.
