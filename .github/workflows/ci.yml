name: CI

on:
  push:
    branches: [master, v10-backend]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.5.1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: OpenAPI check
        run: pnpm openapi:check

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install docs dependencies
        run: python -m pip install -r tools/docs/requirements.txt

      - name: Docs check
        run: python tools/docs/build.py --check

      - name: Example payload check
        run: node tools/docs/check-examples.mjs

      - name: MQTT static exposure check
        run: node infra/check-mqtt-exposure.mjs
