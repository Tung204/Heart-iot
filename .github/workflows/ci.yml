name: CI

on:
  push:
    branches: [master, v10-backend]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.5.1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: OpenAPI check
        run: pnpm openapi:check

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install docs dependencies
        run: python -m pip install -r tools/docs/requirements.txt

      - name: Docs check
        run: python tools/docs/build.py --check

      - name: Example payload check
        run: node tools/docs/check-examples.mjs

      - name: MQTT static exposure check
        run: node infra/check-mqtt-exposure.mjs
  postgres:
    name: PostgreSQL smoke
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: heartiot
          POSTGRES_PASSWORD: heartiot-smoke
          POSTGRES_DB: heartiot
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U heartiot -d heartiot"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgres://heartiot:heartiot-smoke@localhost:5432/heartiot
      NODE_ENV: development
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.5.1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build contracts
        run: pnpm build:contracts

      - name: Build API
        run: pnpm --filter @heart-iot/api build

      - name: Migrate PostgreSQL
        run: pnpm --filter @heart-iot/api db:migrate

      - name: Seed PostgreSQL
        run: pnpm --filter @heart-iot/api seed

      - name: Smoke API on PostgreSQL
        run: pnpm --filter @heart-iot/api smoke:postgres
  e2e:
    name: Browser E2E
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PGLITE_DATA_DIR: .data/e2e-ci
      NODE_ENV: development
      PORT: "3000"
      WEB_ORIGIN: http://localhost:5173
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.5.1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build contracts
        run: pnpm build:contracts

      - name: Build API
        run: pnpm --filter @heart-iot/api build

      - name: Migrate PGlite
        run: pnpm --filter @heart-iot/api db:migrate

      - name: Seed PGlite
        run: pnpm --filter @heart-iot/api seed

      - name: Install Chromium
        run: pnpm --filter @heart-iot/web exec playwright install --with-deps chromium firefox webkit

      - name: Start API
        run: |
          nohup node backend/dist/src/main.js > /tmp/e2e-api.log 2>&1 &
          for i in $(seq 1 40); do
            if curl -sf http://localhost:3000/api/v1/health; then
              exit 0
            fi
            sleep 0.5
          done
          cat /tmp/e2e-api.log
          exit 1

      - name: Run Playwright
        run: pnpm --filter @heart-iot/web test:e2e
